<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Jogador - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        html, body { margin: 0; min-height: 100%; background: #030708; color: #fff7df; }
        body { overflow-x: hidden; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.34) saturate(1.15); z-index: 0; }
        .perfil-app { position: relative; z-index: 1; min-height: 100vh; padding: clamp(14px, 2.5vw, 30px); background: radial-gradient(circle at 22% 22%, rgba(255,226,138,.13), transparent 30%), radial-gradient(circle at 78% 32%, rgba(54,224,255,.12), transparent 30%); }
        .painel { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(5,12,14,.92), rgba(1,4,6,.96)); box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,247,223,.06); backdrop-filter: blur(8px); }
        .topo { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 14px; }
        .topo small, .rotulo { color: #ffe28a; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
        h1 { margin: 3px 0 6px; font-family: "Segoe UI Black", "Arial Black", Impact, sans-serif; font-size: clamp(2rem, 5vw, 4rem); line-height: .92; text-transform: uppercase; text-shadow: 0 5px 0 #210b08, 0 16px 30px rgba(0,0,0,.72); }
        .voltar { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #fff7df; background: rgba(4,12,13,.72); font-weight: 900; text-transform: uppercase; text-decoration: none; display: inline-grid; place-items: center; }
        .grid { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(0, 1.15fr); gap: 14px; }
        .cartao-personagem { padding: 18px; display: grid; gap: 14px; }
        .avatar { min-height: 280px; border: 1px solid rgba(255,226,138,.26); border-radius: 8px; display: grid; place-items: center; background: radial-gradient(circle at 50% 75%, rgba(247,200,75,.22), transparent 45%), rgba(4,12,13,.58); overflow: hidden; }
        .avatar img { max-width: 100%; max-height: 360px; object-fit: contain; filter: drop-shadow(0 22px 30px rgba(0,0,0,.58)); }
        .avatar span { color: #ffe28a; font-weight: 900; text-transform: uppercase; }
        .nome { margin: 0; font-size: 1.8rem; line-height: 1; text-transform: uppercase; }
        .classe { margin: 0; color: #d9e8d4; }
        .xp-card { padding: 18px; display: grid; gap: 14px; }
        .nivel { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
        .nivel-numero { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; color: #07100d; background: radial-gradient(circle, #fff7df, #ffe28a 55%, #c3922b); font-size: 2rem; font-weight: 1000; box-shadow: 0 0 28px rgba(255,226,138,.35); }
        .barra { height: 18px; border: 1px solid rgba(255,247,223,.16); border-radius: 999px; background: rgba(0,0,0,.58); overflow: hidden; }
        .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #36e0ff, #ffe28a); box-shadow: 0 0 18px rgba(54,224,255,.55); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat { padding: 12px; border: 1px solid rgba(247,200,75,.2); border-radius: 8px; background: rgba(255,247,223,.04); }
        .stat strong { display: block; color: #fff7df; font-size: 1.35rem; }
        .historico { padding: 18px; margin-top: 14px; }
        .historico-lista { display: grid; gap: 10px; }
        .linha { padding: 11px; border: 1px solid rgba(255,247,223,.1); border-radius: 8px; background: rgba(0,0,0,.38); color: #d9e8d4; }
        @media (max-width: 820px) { .video-fundo { display: none; } .topo, .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } .painel { backdrop-filter: none; } }
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="perfil-app">
        <header class="topo painel">
            <div>
                <small>Registro de Pirata</small>
                <h1>Perfil</h1>
                <p class="classe">Nível, EXP, berris e histórico do personagem ativo.</p>
            </div>
            <a class="voltar" href="lobby.html">Voltar ao Lobby</a>
        </header>
        <section class="grid">
            <article class="cartao-personagem painel">
                <div class="avatar" id="avatar-perfil"></div>
                <div>
                    <p class="rotulo">Personagem</p>
                    <h2 class="nome" id="nome-perfil">Sem personagem</h2>
                    <p class="classe" id="classe-perfil">Volte ao lobby e selecione/crie um personagem.</p>
                </div>
            </article>
            <article class="xp-card painel">
                <div class="nivel">
                    <div class="nivel-numero" id="nivel-perfil">1</div>
                    <div>
                        <p class="rotulo">Experiência</p>
                        <div class="barra"><i id="barra-perfil"></i></div>
                        <p class="classe" id="xp-perfil">0 / 0 EXP</p>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat"><span class="rotulo">EXP Livre</span><strong id="exp-livre">0</strong></div>
                    <div class="stat"><span class="rotulo">Berris</span><strong id="berris-perfil">0</strong></div>
                    <div class="stat"><span class="rotulo">Pontos</span><strong id="pontos-perfil">0</strong></div>
                </div>
            </article>
        </section>
        <section class="historico painel">
            <p class="rotulo">Últimas atividades</p>
            <div class="historico-lista" id="historico-perfil"></div>
        </section>
    </main>
    <script src="rpg-sistemas.js"></script>
    <script src="musica-fundo.js?v=20260605-rpg4"></script>
    <script>
        function obterPersonagem() {
            try {
                const direto = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
                if (direto?.nome) return direto;
                const lista = JSON.parse(localStorage.getItem("personagensCriados") || "[]");
                return Array.isArray(lista) ? lista[lista.length - 1] : null;
            } catch (erro) { return null; }
        }
        const personagem = obterPersonagem();
        const progresso = window.RpgSistemas?.obterProgresso(personagem) || {};
        const estado = window.RpgSistemas?.estadoNivel(progresso) || { nivel: 1, expAtual: 0, proximo: 0, percentual: 0 };
        const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");
        document.getElementById("nome-perfil").textContent = personagem?.nome || "Sem personagem";
        document.getElementById("classe-perfil").textContent = personagem ? `${personagem.raca || "Raça indefinida"} / ${personagem.estiloLuta || "Estilo livre"} / ${personagem.ocupacao || "Sem ocupação"}` : "Volte ao lobby e selecione/crie um personagem.";
        document.getElementById("nivel-perfil").textContent = estado.nivel || 1;
        document.getElementById("barra-perfil").style.width = `${estado.percentual || 0}%`;
        document.getElementById("xp-perfil").textContent = `${fmt(estado.expAtual)} / ${fmt(estado.proximo)} EXP`;
        document.getElementById("exp-livre").textContent = fmt(progresso.expDisponivel);
        document.getElementById("berris-perfil").textContent = fmt(progresso.berris);
        document.getElementById("pontos-perfil").textContent = fmt(progresso.pontosMissao);
        const avatar = document.getElementById("avatar-perfil");
        if (personagem?.imagem) avatar.innerHTML = `<img src="${personagem.imagem}" alt="">`;
        else avatar.innerHTML = "<span>Sem imagem</span>";
        const historico = Array.isArray(progresso.historico) ? progresso.historico.slice(-8).reverse() : [];
        document.getElementById("historico-perfil").innerHTML = historico.length ? historico.map((item) => `<div class="linha"><strong>${item.titulo || "Atividade"}</strong><br>${item.quandoTexto || ""} - +${fmt(item.exp)} EXP, +${fmt(item.berris)} berris</div>`).join("") : "<div class='linha'>Nenhuma atividade registrada ainda.</div>";
    </script>
</body>
</html>
