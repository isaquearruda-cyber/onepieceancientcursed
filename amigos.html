<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos e Grupo - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game28">
    <style>
        body.pagina-formulario { position: relative; min-height: 100vh; padding: 0; overflow-x: hidden; background: #040c0d; color: #fff7df; }
        .social-app { position: relative; z-index: 2; width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: clamp(18px, 4vw, 42px) 0; display: grid; gap: 18px; }
        .social-topo, .social-card, .jogador-card { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(7,20,22,.9), rgba(3,8,10,.92)); box-shadow: 0 22px 54px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,247,223,.06); }
        .social-topo { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: clamp(16px,3vw,26px); }
        .social-topo small, .social-card h2 { color: #ffe28a; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
        .social-topo h1 { margin: 4px 0 8px; color: #fff7df; font-family: "Segoe UI Black", "Arial Black", Impact, sans-serif; font-size: clamp(2.2rem,6vw,4.2rem); line-height: .94; text-transform: uppercase; text-shadow: 0 5px 0 #2a0d08, 0 14px 28px rgba(0,0,0,.68); }
        .botao-voltar, button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #1e211c; background: #f7c84b; font-weight: 900; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; }
        .botao-voltar { color: #fff7df; background: rgba(4,12,13,.72); }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
        .social-card { padding: clamp(14px,3vw,22px); display: grid; gap: 14px; }
        .social-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        input { min-height: 42px; border: 1px solid rgba(247,200,75,.3); border-radius: 8px; background: rgba(4,12,13,.58); color: #fff7df; padding: 0 12px; }
        .lista-social { display: grid; gap: 10px; }
        .jogador-card { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; box-shadow: none; }
        .jogador-card img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
        .jogador-card strong { display: block; color: #fff7df; }
        .jogador-card span { color: #d9e8d4; font-size: .9rem; }
        .grupo-banner { min-height: 180px; padding: 18px; border-radius: 8px; background: linear-gradient(135deg, rgba(247,200,75,.16), rgba(3,8,10,.76)), url("assets/img/sistemas/sistema-2.webp") right center / contain no-repeat; }
        .grupo-banner.organizacao { background-image: linear-gradient(135deg, rgba(54,224,255,.14), rgba(3,8,10,.76)), url("assets/img/sistemas/sistema-3.webp"); }
        @media (max-width: 860px) { .social-grid, .social-topo, .social-form { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="pagina-formulario">
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>

    <main class="social-app">
        <header class="social-topo">
            <div>
                <small>Rede de Jogadores</small>
                <h1>Amigos</h1>
                <p id="texto-social">Convide jogadores, aceite pedidos e organize sua tripulação.</p>
            </div>
            <a class="botao-voltar" href="lobby.html">Voltar</a>
        </header>

        <section class="social-grid">
            <article class="social-card">
                <h2>Adicionar amigo</h2>
                <form class="social-form" id="form-convite">
                    <input id="nome-convite" type="text" placeholder="Nome do personagem" required>
                    <button type="submit">Enviar convite</button>
                </form>
                <p id="status-convite"></p>
                <div class="lista-social" id="lista-jogadores"></div>
            </article>

            <article class="social-card">
                <h2>Pedidos recebidos</h2>
                <div class="lista-social" id="lista-pedidos"></div>
                <h2>Amigos</h2>
                <div class="lista-social" id="lista-amigos"></div>
            </article>
        </section>

        <section class="social-card" id="grupo">
            <h2 id="titulo-grupo">Bando</h2>
            <div class="grupo-banner" id="grupo-banner">
                <h3 id="nome-grupo">Sem grupo criado</h3>
                <p id="descricao-grupo">Piratas podem criar bandos. Caçadores de Recompensa criam organização.</p>
            </div>
            <form class="social-form" id="form-grupo">
                <input id="input-grupo" type="text" placeholder="Nome do bando ou organização" required>
                <button type="submit">Salvar grupo</button>
            </form>
        </section>
    </main>

    <script src="supabase-config.js"></script>
    <script src="banco-personagens.js?v=20260626-sync1"></script>
    <script src="musica-fundo.js?v=20260626-sync1"></script>
    <script src="rpg-sistemas.js?v=20260626-sync1"></script>
    <script>
        const personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const chaveRede = "rpg_rede_social";
        let jogadores = [];

        function rede() {
            try { return JSON.parse(localStorage.getItem(chaveRede) || '{"convites":[],"amizades":[]}'); }
            catch { return { convites: [], amizades: [] }; }
        }
        function salvarRede(dados) { localStorage.setItem(chaveRede, JSON.stringify(dados)); }
        function id(nome) { return RpgSistemas.normalizar(nome); }
        function par(a, b) { return [id(a), id(b)].sort().join("::"); }
        function avatar(p) { return p?.imagemPersonagem || "assets/img/sistemas/sistema-1.webp"; }
        function orgAtual() { return personagem?.organizacao || personagem?.organização || personagem?.organization || "Piratas"; }

        async function carregar() {
            if (!personagem?.nome) { window.location.href = "index.html"; return; }
            jogadores = await BancoPersonagens.obterTodos();
            renderizar();
        }

        function renderizarJogadores() {
            const r = rede();
            const amigos = new Set(r.amizades.filter((a) => a.includes(id(personagem.nome))).flatMap((a) => a.split("::")));
            document.getElementById("lista-jogadores").innerHTML = jogadores
                .filter((p) => id(p.nome) && id(p.nome) !== id(personagem.nome) && !amigos.has(id(p.nome)))
                .slice(0, 12)
                .map((p) => `<div class="jogador-card"><img src="${avatar(p)}" alt=""><span><strong>${p.nome}</strong>${p.organizacao || "Sem organização"}</span><button type="button" data-convidar="${p.nome}">Convidar</button></div>`)
                .join("") || "<p>Nenhum jogador disponível no cache ainda.</p>";
            document.querySelectorAll("[data-convidar]").forEach((botao) => botao.addEventListener("click", () => enviarConvite(botao.dataset.convidar)));
        }

        function renderizarPedidos() {
            const r = rede();
            const pedidos = r.convites.filter((c) => c.para === id(personagem.nome) && c.status === "pendente");
            document.getElementById("lista-pedidos").innerHTML = pedidos.map((c) => `
                <div class="jogador-card"><img src="assets/img/sistemas/sistema-1.webp" alt=""><span><strong>${c.deNome}</strong>quer jogar junto</span><button type="button" data-aceitar="${c.de}">Aceitar</button></div>
            `).join("") || "<p>Nenhum pedido pendente.</p>";
            document.querySelectorAll("[data-aceitar]").forEach((botao) => botao.addEventListener("click", () => aceitarConvite(botao.dataset.aceitar)));
        }

        function renderizarAmigos() {
            const r = rede();
            const meus = r.amizades.filter((a) => a.includes(id(personagem.nome))).map((a) => a.split("::").find((nome) => nome !== id(personagem.nome)));
            document.getElementById("lista-amigos").innerHTML = meus.map((nome) => {
                const p = jogadores.find((j) => id(j.nome) === nome);
                return `<div class="jogador-card"><img src="${avatar(p)}" alt=""><span><strong>${p?.nome || nome}</strong>${p?.organizacao || "Aliado"}</span><button type="button" disabled>Amigo</button></div>`;
            }).join("") || "<p>Sua lista de amigos está vazia.</p>";
        }

        function renderizarGrupo() {
            const org = RpgSistemas.normalizar(orgAtual());
            const cacador = org.includes("cacadores");
            const pirata = org.includes("pirata");
            document.getElementById("titulo-grupo").textContent = cacador ? "Organização" : "Bando";
            document.getElementById("grupo-banner").classList.toggle("organizacao", cacador);
            const grupo = personagem.grupoSocial || {};
            document.getElementById("nome-grupo").textContent = grupo.nome || (cacador ? "Organização não criada" : "Bando não criado");
            document.getElementById("descricao-grupo").textContent = cacador ? "Rede exclusiva para Caçadores de Recompensa." : pirata ? "Rede exclusiva para personagens piratas." : "Seu personagem nao pertence aos Piratas nem aos Caçadores de Recompensa.";
            document.getElementById("input-grupo").placeholder = cacador ? "Nome da organização" : "Nome do bando";
            document.querySelector("#form-grupo button").disabled = !(cacador || pirata);
            document.getElementById("input-grupo").disabled = !(cacador || pirata);
        }

        function renderizar() {
            renderizarJogadores();
            renderizarPedidos();
            renderizarAmigos();
            renderizarGrupo();
        }

        function enviarConvite(nome) {
            const alvo = jogadores.find((p) => id(p.nome) === id(nome));
            if (!alvo) return;
            const r = rede();
            const existe = r.convites.some((c) => c.de === id(personagem.nome) && c.para === id(alvo.nome) && c.status === "pendente");
            if (!existe) r.convites.push({ de: id(personagem.nome), deNome: personagem.nome, para: id(alvo.nome), paraNome: alvo.nome, status: "pendente", criadoEm: new Date().toISOString() });
            salvarRede(r);
            document.getElementById("status-convite").textContent = `Convite enviado para ${alvo.nome}.`;
            renderizar();
        }

        function aceitarConvite(de) {
            const r = rede();
            r.convites = r.convites.map((c) => c.de === de && c.para === id(personagem.nome) ? { ...c, status: "aceito" } : c);
            const amizade = par(de, personagem.nome);
            if (!r.amizades.includes(amizade)) r.amizades.push(amizade);
            salvarRede(r);
            renderizar();
        }

        document.getElementById("form-convite").addEventListener("submit", (evento) => {
            evento.preventDefault();
            enviarConvite(document.getElementById("nome-convite").value);
        });

        document.getElementById("form-grupo").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            const org = RpgSistemas.normalizar(orgAtual());
            if (!org.includes("pirata") && !org.includes("cacadores")) return;
            personagem.grupoSocial = { nome: document.getElementById("input-grupo").value.trim(), tipo: document.getElementById("titulo-grupo").textContent, atualizadoEm: new Date().toISOString() };
            await BancoPersonagens.salvarPersonagem(personagem);
            renderizarGrupo();
        });

        carregar();
    </script>
</body>
</html>
