<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Amigos e Grupo - One Piece RPG</title><link rel="stylesheet" href="estilo.css"><style>body.pagina-formulario{position:relative;min-height:100vh;padding:0;overflow-x:hidden;background:#040c0d;color:#fff7df}.app{position:relative;z-index:2;width:min(1180px,calc(100% - 28px));margin:0 auto;padding:clamp(18px,4vw,42px) 0;display:grid;gap:18px}.topo,.card,.jogador{border:1px solid rgba(247,200,75,.28);border-radius:8px;background:linear-gradient(180deg,rgba(7,20,22,.9),rgba(3,8,10,.92));box-shadow:0 22px 54px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,247,223,.06)}.topo{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:clamp(16px,3vw,26px)}small,.card h2{color:#ffe28a;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{margin:4px 0 8px;color:#fff7df;font-family:"Segoe UI Black","Arial Black",Impact,sans-serif;font-size:clamp(2.2rem,6vw,4.2rem);line-height:.94;text-transform:uppercase;text-shadow:0 5px 0 #2a0d08,0 14px 28px rgba(0,0,0,.68)}.voltar,button{min-height:42px;padding:0 14px;border:1px solid rgba(255,226,138,.52);border-radius:8px;color:#1e211c;background:#f7c84b;font-weight:900;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}.voltar{color:#fff7df;background:rgba(4,12,13,.72)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{padding:clamp(14px,3vw,22px);display:grid;gap:14px}.form{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-height:42px;border:1px solid rgba(247,200,75,.3);border-radius:8px;background:rgba(4,12,13,.58);color:#fff7df;padding:0 12px}.lista{display:grid;gap:10px}.jogador{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;box-shadow:none}.jogador img{width:56px;height:56px;border-radius:8px;object-fit:cover}.jogador strong{display:block;color:#fff7df}.jogador span{color:#d9e8d4;font-size:.9rem}.banner{min-height:180px;padding:18px;border-radius:8px;background:linear-gradient(135deg,rgba(247,200,75,.16),rgba(3,8,10,.76)),url("assets/img/sistemas/sistema-2.webp") right center/contain no-repeat}.banner.organizacao{background-image:linear-gradient(135deg,rgba(54,224,255,.14),rgba(3,8,10,.76)),url("assets/img/sistemas/sistema-3.webp")}button:disabled,input:disabled{opacity:.45;cursor:not-allowed}@media(max-width:860px){.grid,.topo,.form{grid-template-columns:1fr}}</style></head><body class="pagina-formulario"><audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio><video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header class="topo"><div><small>Rede de Jogadores</small><h1>Amigos</h1><p>Convide jogadores, aceite pedidos e organize sua tripulação.</p></div><a class="voltar" href="lobby.html">Voltar</a></header><section class="grid"><article class="card"><h2>Adicionar amigo</h2><form class="form" id="formConvite"><input id="nomeConvite" type="text" placeholder="Nome do personagem" required><button>Enviar convite</button></form><p id="status"></p><div class="lista" id="jogadores"></div></article><article class="card"><h2>Pedidos recebidos</h2><div class="lista" id="pedidos"></div><h2>Amigos</h2><div class="lista" id="amigos"></div></article></section><section class="card" id="grupo"><h2 id="tituloGrupo">Bando</h2><div class="banner" id="banner"><h3 id="nomeGrupo">Sem grupo criado</h3><p id="descGrupo">Piratas podem criar bandos. Caçadores de Recompensa criam organização.</p></div><form class="form" id="formGrupo"><input id="inputGrupo" type="text" placeholder="Nome do bando ou organização" required><button>Salvar grupo</button></form></section></main><script src="supabase-config.js"></script><script src="banco-personagens.js"></script><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null'),chave='rpg_rede_social';let lista=[];function rede(){try{return JSON.parse(localStorage.getItem(chave)||'{"convites":[],"amizades":[]}')}catch{return{convites:[],amizades:[]}}}function salvar(r){localStorage.setItem(chave,JSON.stringify(r))}function id(n){return RpgSistemas.normalizar(n)}function par(a,b){return[id(a),id(b)].sort().join('::')}function avatar(p){return p?.imagemPersonagem||'assets/img/sistemas/sistema-1.webp'}function org(){return personagem?.organizacao||personagem?.organização||personagem?.organization||'Piratas'}async function carregar(){if(!personagem?.nome){location.href='index.html';return}lista=await BancoPersonagens.obterTodos();render()}function renderJogadores(){const r=rede(),meus=new Set(r.amizades.filter(a=>a.includes(id(personagem.nome))).flatMap(a=>a.split('::')));jogadores.innerHTML=lista.filter(p=>id(p.nome)&&id(p.nome)!==id(personagem.nome)&&!meus.has(id(p.nome))).slice(0,12).map(p=>`<div class="jogador"><img src="${avatar(p)}" alt=""><span><strong>${p.nome}</strong>${p.organizacao||'Sem organização'}</span><button type="button" data-convidar="${p.nome}">Convidar</button></div>`).join('')||'<p>Nenhum jogador disponível no cache ainda.</p>';document.querySelectorAll('[data-convidar]').forEach(b=>b.onclick=()=>enviar(b.dataset.convidar))}function renderPedidos(){const r=rede(),arr=r.convites.filter(c=>c.para===id(personagem.nome)&&c.status==='pendente');pedidos.innerHTML=arr.map(c=>`<div class="jogador"><img src="assets/img/sistemas/sistema-1.webp" alt=""><span><strong>${c.deNome}</strong>quer jogar junto</span><button type="button" data-aceitar="${c.de}">Aceitar</button></div>`).join('')||'<p>Nenhum pedido pendente.</p>';document.querySelectorAll('[data-aceitar]').forEach(b=>b.onclick=()=>aceitar(b.dataset.aceitar))}function renderAmigos(){const r=rede(),meus=r.amizades.filter(a=>a.includes(id(personagem.nome))).map(a=>a.split('::').find(n=>n!==id(personagem.nome)));amigos.innerHTML=meus.map(n=>{const p=lista.find(j=>id(j.nome)===n);return`<div class="jogador"><img src="${avatar(p)}" alt=""><span><strong>${p?.nome||n}</strong>${p?.organizacao||'Aliado'}</span><button disabled>Amigo</button></div>`}).join('')||'<p>Sua lista de amigos está vazia.</p>'}function renderGrupo(){const o=RpgSistemas.normalizar(org()),cac=o.includes('cacadores'),pir=o.includes('pirata');tituloGrupo.textContent=cac?'Organização':'Bando';banner.classList.toggle('organizacao',cac);nomeGrupo.textContent=personagem.grupoSocial?.nome||(cac?'Organização não criada':'Bando não criado');descGrupo.textContent=cac?'Rede exclusiva para Caçadores de Recompensa.':pir?'Rede exclusiva para personagens piratas.':'Seu personagem não pertence aos Piratas nem aos Caçadores de Recompensa.';inputGrupo.placeholder=cac?'Nome da organização':'Nome do bando';formGrupo.querySelector('button').disabled=!(cac||pir);inputGrupo.disabled=!(cac||pir)}function render(){renderJogadores();renderPedidos();renderAmigos();renderGrupo()}function enviar(nome){const alvo=lista.find(p=>id(p.nome)===id(nome));if(!alvo)return;const r=rede();if(!r.convites.some(c=>c.de===id(personagem.nome)&&c.para===id(alvo.nome)&&c.status==='pendente'))r.convites.push({de:id(personagem.nome),deNome:personagem.nome,para:id(alvo.nome),paraNome:alvo.nome,status:'pendente',criadoEm:new Date().toISOString()});salvar(r);status.textContent=`Convite enviado para ${alvo.nome}.`;render()}function aceitar(de){const r=rede();r.convites=r.convites.map(c=>c.de===de&&c.para===id(personagem.nome)?{...c,status:'aceito'}:c);const amizade=par(de,personagem.nome);if(!r.amizades.includes(amizade))r.amizades.push(amizade);salvar(r);render()}formConvite.onsubmit=e=>{e.preventDefault();enviar(nomeConvite.value)};formGrupo.onsubmit=async e=>{e.preventDefault();const o=RpgSistemas.normalizar(org());if(!o.includes('pirata')&&!o.includes('cacadores'))return;personagem.grupoSocial={nome:inputGrupo.value.trim(),tipo:tituloGrupo.textContent,atualizadoEm:new Date().toISOString()};await BancoPersonagens.salvarPersonagem(personagem);renderGrupo()};carregar();</script></body></html>
