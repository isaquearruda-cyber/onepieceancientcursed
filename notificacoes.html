<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game5">
    <style>
        html, body { margin: 0; min-height: 100%; background: #030708; color: #fff7df; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.32) saturate(1.16); z-index: 0; }
        .app { position: relative; z-index: 1; min-height: 100vh; padding: clamp(14px,2.4vw,28px); background: radial-gradient(circle at 20% 18%, rgba(255,68,68,.12), transparent 30%), radial-gradient(circle at 80% 36%, rgba(255,226,138,.13), transparent 30%); }
        .painel { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(5,12,14,.92), rgba(1,4,6,.96)); box-shadow: 0 20px 48px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,247,223,.06); backdrop-filter: blur(8px); }
        .topo { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 14px; }
        small, .meta { color: #ffe28a; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
        h1 { margin: 3px 0 6px; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; font-size: clamp(2rem,5vw,4rem); line-height: .92; text-transform: uppercase; text-shadow: 0 5px 0 #210b08,0 16px 30px rgba(0,0,0,.72); }
        .voltar, button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #fff7df; background: rgba(4,12,13,.72); font-weight: 900; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        .lista { display: grid; gap: 10px; padding: 16px; }
        .notificacao { position: relative; overflow: hidden; border: 1px solid rgba(255,247,223,.12); border-radius: 8px; padding: 13px; background: rgba(0,0,0,.38); }
        .notificacao::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--cor, #ffe28a); box-shadow: 0 0 18px var(--cor, #ffe28a); }
        .notificacao header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
        .notificacao p { margin: 0; color: #d9e8d4; line-height: 1.45; }
        .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        @media(max-width:760px){.video-fundo{display:none}.topo{grid-template-columns:1fr}.painel{backdrop-filter:none}}
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="app">
        <header class="topo painel">
            <div><small>Registro de Sistema</small><h1>Notificações</h1><p>Avisos do jogo, recompensas, desbloqueios e alertas de viagem.</p></div>
            <a class="voltar" href="lobby.html">Voltar ao Lobby</a>
        </header>
        <div class="acoes">
            <button id="gerar">Gerar aviso teste</button>
            <button id="limpar">Limpar notificações</button>
        </div>
        <section class="lista painel" id="lista"></section>
    </main>
    <script src="musica-fundo.js?v=20260619-game5"></script>
    <script>
        const chave = "rpg_notificacoes";
        const padrao = [
            { titulo: "Sistema de aventura liberado", texto: "Os quatro Blues estão desbloqueados para seleção inicial.", data: "Sistema", cor: "#36e0ff" },
            { titulo: "Biblioteca atualizada", texto: "Meito cadastradas com raridade, categoria e imagem/fallback visual.", data: "Sistema", cor: "#ffe28a" },
            { titulo: "Correio ativo", texto: "Mensagens agora ficam em página própria no lobby.", data: "Sistema", cor: "#64d6a4" }
        ];
        const ler = () => { try { return JSON.parse(localStorage.getItem(chave) || "null") || padrao; } catch (e) { return padrao; } };
        const salvar = (lista) => localStorage.setItem(chave, JSON.stringify(lista));
        function renderizar() {
            const lista = ler();
            document.getElementById("lista").innerHTML = lista.length ? lista.map((n) => `
                <article class="notificacao" style="--cor:${n.cor || "#ffe28a"}">
                    <header><strong>${n.titulo}</strong><span class="meta">${n.data}</span></header>
                    <p>${n.texto}</p>
                </article>`).join("") : "<article class='notificacao'><p>Nenhuma notificação.</p></article>";
        }
        gerar.onclick = () => {
            const aviso = { titulo: "Evento de jogo", texto: "Nova atividade registrada no diário do personagem.", data: new Date().toLocaleString("pt-BR"), cor: "#ff7b7b" };
            salvar([aviso, ...ler()].slice(0, 80));
            renderizar();
            window.RpgFeedback?.aviso?.(aviso.titulo, [aviso.texto]);
        };
        limpar.onclick = () => { salvar([]); renderizar(); };
        renderizar();
    </script>
</body>
</html>
