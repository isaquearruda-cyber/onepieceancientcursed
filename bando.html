<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bando / Organização - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game26">
    <style>
        html, body { margin: 0; min-height: 100%; background: #030708; color: #fff7df; overflow-y: auto; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.3) saturate(1.18); z-index: 0; }
        .app { position: relative; z-index: 1; width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: clamp(16px,4vw,42px) 0; display: grid; gap: 16px; }
        .painel, .missao, .membro { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(7,20,22,.92), rgba(3,8,10,.96)); box-shadow: 0 22px 54px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,247,223,.06); }
        .topo { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: clamp(16px,3vw,26px); }
        small, .meta { color: #ffe28a; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 4px 0 8px; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; font-size: clamp(2.2rem,6vw,4.2rem); line-height: .92; text-transform: uppercase; text-shadow: 0 5px 0 #210b08,0 16px 30px rgba(0,0,0,.72); }
        .voltar, button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #fff7df; background: rgba(4,12,13,.72); font-weight: 900; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        input { width: 100%; box-sizing: border-box; min-height: 42px; border: 1px solid rgba(54,224,255,.32); border-radius: 8px; padding: 10px 12px; color: #fff7df; background: rgba(3,8,10,.78); font: inherit; }
        .grid { display: grid; grid-template-columns: minmax(280px,.82fr) minmax(0,1.18fr); gap: 14px; align-items: start; }
        .painel { padding: 16px; display: grid; gap: 12px; }
        .banner { min-height: 220px; padding: 18px; border-radius: 8px; background: radial-gradient(circle at 20% 20%, rgba(144,255,0,.22), transparent 34%), linear-gradient(135deg, rgba(247,200,75,.16), rgba(3,8,10,.76)), url("assets/img/sistemas/sistema-3.webp") right center / contain no-repeat; }
        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .stats div { padding: 12px; border: 1px solid rgba(255,226,138,.18); border-radius: 8px; background: rgba(0,0,0,.28); }
        .missao, .membro { box-shadow: none; padding: 12px; display: grid; gap: 8px; }
        .membro { grid-template-columns: 48px 1fr; align-items: center; }
        .avatar { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #061011; }
        @media(max-width:860px){.grid,.topo,.stats{grid-template-columns:1fr}.video-fundo{display:none}}
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="app">
        <header class="topo painel">
            <div><small>Tripulação</small><h1>Bando / Organização</h1><p id="status">Monte sua base social e evolua o grupo.</p></div>
            <a class="voltar" href="lobby.html">Voltar ao Lobby</a>
        </header>
        <section class="grid">
            <article class="painel">
                <div class="banner"><small id="tipo">Bando</small><h2 id="nome">Sem nome</h2><p id="descricao">Crie um bando ou organização para liberar missões coletivas.</p></div>
                <input id="nome-input" placeholder="Nome do bando / organização">
                <button id="salvar">Salvar grupo</button>
                <div class="stats">
                    <div><small>Nível</small><h2 id="nivel">1</h2></div>
                    <div><small>Fama</small><h2 id="fama">0</h2></div>
                    <div><small>Baú</small><h2 id="bau">0</h2></div>
                </div>
            </article>
            <section class="painel">
                <h2>Missões do grupo</h2>
                <div id="missoes"></div>
                <h2>Membros no cache</h2>
                <div id="membros"></div>
            </section>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="banco-personagens.js?v=20260619-db2"></script>
    <script src="musica-fundo.js?v=20260619-game26"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg10"></script>
    <script>
        let personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const missoesGrupo = [
            { titulo: "Patrulha de Rota", texto: "Registrar presença do grupo em uma ilha.", fama: 12, bau: 600 },
            { titulo: "Defesa do Estandarte", texto: "Proteger aliados durante uma sessão narrativa.", fama: 20, bau: 1200 },
            { titulo: "Operação de Suprimentos", texto: "Enviar recursos para o baú coletivo.", fama: 16, bau: 900 }
        ];
        function grupo() { return personagem.grupoSocial || { nome: "", tipo: "Bando", nivel: 1, fama: 0, bau: 0, concluidas: [] }; }
        async function salvarPersonagem() {
            localStorage.setItem("ultimoPersonagem", JSON.stringify(personagem));
            if (window.BancoPersonagens?.salvarPersonagem) await BancoPersonagens.salvarPersonagem(personagem);
        }
        async function salvarGrupo() {
            personagem.grupoSocial = { ...grupo(), nome: document.getElementById("nome-input").value.trim() || "Bando Sem Nome", tipo: document.getElementById("tipo").textContent, atualizadoEm: new Date().toISOString() };
            await salvarPersonagem();
            RpgFeedback?.aviso?.("Grupo atualizado", [personagem.grupoSocial.nome]);
            renderizar();
        }
        async function concluir(i) {
            const g = grupo();
            const m = missoesGrupo[i];
            g.fama = Number(g.fama || 0) + m.fama;
            g.bau = Number(g.bau || 0) + m.bau;
            g.nivel = 1 + Math.floor(g.fama / 60);
            g.concluidas = [...(g.concluidas || []), { titulo: m.titulo, quando: new Date().toLocaleString("pt-BR") }].slice(-40);
            personagem.grupoSocial = g;
            await salvarPersonagem();
            RpgFeedback?.aviso?.("Missão de grupo", [`+${m.fama} fama`, `+${m.bau} berris no baú`]);
            renderizar();
        }
        async function renderizarMembros() {
            const todos = await BancoPersonagens.obterTodos().catch(() => []);
            const g = grupo();
            document.getElementById("membros").innerHTML = todos.filter((p) => p.grupoSocial?.nome === g.nome || p.nome === personagem.nome).slice(0, 8).map((p) => `
                <article class="membro"><img class="avatar" src="${p.imagemPersonagem || p.imagem || "assets/img/sistemas/sistema-1.webp"}" alt=""><span><strong>${p.nome}</strong><br><span class="meta">${p.organizacao || "Tripulante"}</span></span></article>
            `).join("") || "<p>Nenhum membro encontrado ainda.</p>";
        }
        function renderizar() {
            if (!personagem?.nome) { location.href = "index.html"; return; }
            const g = grupo();
            const org = String(personagem.organizacao || personagem.organização || "Piratas");
            document.getElementById("tipo").textContent = org.toLowerCase().includes("cacador") ? "Organização" : "Bando";
            document.getElementById("nome").textContent = g.nome || "Sem grupo criado";
            document.getElementById("nome-input").value = g.nome || "";
            document.getElementById("nivel").textContent = g.nivel || 1;
            document.getElementById("fama").textContent = g.fama || 0;
            document.getElementById("bau").textContent = Number(g.bau || 0).toLocaleString("pt-BR");
            document.getElementById("status").textContent = `${personagem.nome} / ${org}`;
            document.getElementById("missoes").innerHTML = missoesGrupo.map((m, i) => `<article class="missao"><small>Coletiva</small><h3>${m.titulo}</h3><p>${m.texto}</p><span class="meta">+${m.fama} fama / +${m.bau} baú</span><button data-m="${i}">Concluir</button></article>`).join("");
            document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => concluir(Number(b.dataset.m)));
            renderizarMembros();
        }
        document.getElementById("salvar").onclick = salvarGrupo;
        renderizar();
    </script>
</body>
</html>
