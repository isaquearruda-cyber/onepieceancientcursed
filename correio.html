<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correio - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        html, body { margin: 0; min-height: 100%; background: #030708; color: #fff7df; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.32) saturate(1.16); z-index: 0; }
        .app { position: relative; z-index: 1; min-height: 100vh; padding: clamp(14px,2.4vw,28px); background: radial-gradient(circle at 20% 18%, rgba(255,226,138,.14), transparent 30%), radial-gradient(circle at 80% 36%, rgba(54,224,255,.11), transparent 30%); }
        .painel { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(5,12,14,.92), rgba(1,4,6,.96)); box-shadow: 0 20px 48px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,247,223,.06); backdrop-filter: blur(8px); }
        .topo { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 14px; }
        small, .meta { color: #ffe28a; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
        h1 { margin: 3px 0 6px; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; font-size: clamp(2rem,5vw,4rem); line-height: .92; text-transform: uppercase; text-shadow: 0 5px 0 #210b08,0 16px 30px rgba(0,0,0,.72); }
        .voltar, button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #fff7df; background: rgba(4,12,13,.72); font-weight: 900; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        .grid { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 14px; }
        form { padding: 16px; display: grid; gap: 10px; }
        input, textarea, select { width: 100%; box-sizing: border-box; min-height: 42px; border: 1px solid rgba(54,224,255,.32); border-radius: 8px; padding: 10px 12px; color: #fff7df; background: rgba(3,8,10,.78); font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .lista { padding: 16px; display: grid; gap: 10px; align-content: start; }
        .mensagem { border: 1px solid rgba(255,247,223,.12); border-radius: 8px; padding: 12px; background: rgba(0,0,0,.38); box-shadow: inset 0 0 18px rgba(0,0,0,.24); }
        .mensagem header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
        .mensagem strong { color: #fff7df; }
        .mensagem p { margin: 0; color: #d9e8d4; line-height: 1.45; }
        .vazio { padding: 22px; border: 1px dashed rgba(247,200,75,.3); border-radius: 8px; color: #d9e8d4; text-align: center; }
        @media(max-width:800px){.video-fundo{display:none}.topo,.grid{grid-template-columns:1fr}.painel{backdrop-filter:none}}
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="app">
        <header class="topo painel">
            <div><small>Den Den Mushi / Cartas</small><h1>Correio</h1><p>Mensagens do personagem, avisos de bando e bilhetes de aventura.</p></div>
            <a class="voltar" href="lobby.html">Voltar ao Lobby</a>
        </header>
        <section class="grid">
            <form class="painel" id="form-correio">
                <span class="meta">Nova mensagem</span>
                <input id="para" placeholder="Para / origem">
                <select id="tipo"><option>Mensagem</option><option>Bando</option><option>Marinha</option><option>Mercador</option><option>Missão</option></select>
                <textarea id="texto" placeholder="Escreva a mensagem"></textarea>
                <button type="submit">Enviar para o correio</button>
            </form>
            <section class="lista painel" id="lista-correio"></section>
        </section>
    </main>
    <script src="musica-fundo.js?v=20260605-rpg4"></script>
    <script>
        const chave = "rpg_correio";
        const padrao = [
            { para: "Quartel local", tipo: "Marinha", texto: "Relatos de atividade pirata aumentaram. Recompensas podem surgir ao entrar na aventura.", data: "Sistema" },
            { para: "Mercador ambulante", tipo: "Mercador", texto: "Novas armas raras devem aparecer na biblioteca e no inventário em futuras atualizações.", data: "Sistema" }
        ];
        function ler() {
            try { return JSON.parse(localStorage.getItem(chave) || "null") || padrao; } catch (e) { return padrao; }
        }
        function salvar(lista) { localStorage.setItem(chave, JSON.stringify(lista)); }
        function renderizar() {
            const lista = ler();
            document.getElementById("lista-correio").innerHTML = lista.length ? lista.map((m, i) => `
                <article class="mensagem">
                    <header><strong>${m.tipo} - ${m.para}</strong><span class="meta">${m.data}</span></header>
                    <p>${m.texto}</p>
                    <button type="button" data-remover="${i}">Arquivar</button>
                </article>`).join("") : "<div class='vazio'>Correio vazio.</div>";
            document.querySelectorAll("[data-remover]").forEach((b) => b.onclick = () => {
                const atual = ler();
                atual.splice(Number(b.dataset.remover), 1);
                salvar(atual);
                renderizar();
            });
        }
        document.getElementById("form-correio").addEventListener("submit", (evento) => {
            evento.preventDefault();
            const msg = { para: para.value || "Sem destino", tipo: tipo.value, texto: texto.value || "Mensagem vazia.", data: new Date().toLocaleString("pt-BR") };
            salvar([msg, ...ler()].slice(0, 60));
            texto.value = "";
            renderizar();
            window.RpgFeedback?.aviso?.("Mensagem enviada", [msg.tipo, msg.para]);
        });
        renderizar();
    </script>
</body>
</html>
