<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinos - One Piece RPG</title><link rel="stylesheet" href="estilo.css">
<style>
body.pagina-formulario{position:relative;min-height:100vh;padding:0;overflow-x:hidden;background:#040c0d;color:#fff7df}.app{position:relative;z-index:2;width:min(1180px,calc(100% - 28px));margin:0 auto;padding:clamp(18px,4vw,42px) 0;display:grid;gap:18px}.topo,.painel,.card,.modal-conteudo{border:1px solid rgba(247,200,75,.28);border-radius:8px;background:linear-gradient(180deg,rgba(7,20,22,.9),rgba(3,8,10,.92));box-shadow:0 22px 54px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,247,223,.06)}.topo{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:clamp(16px,3vw,26px)}small,.meta{color:#ffe28a;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0 8px;color:#fff7df;font-family:"Segoe UI Black","Arial Black",Impact,sans-serif;font-size:clamp(2.2rem,6vw,4.4rem);line-height:.94;text-transform:uppercase;text-shadow:0 5px 0 #2a0d08,0 14px 28px rgba(0,0,0,.68)}.voltar,button{min-height:42px;padding:0 14px;border:1px solid rgba(255,226,138,.52);border-radius:8px;color:#1e211c;background:#f7c84b;font-weight:900;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}.voltar{color:#fff7df;background:rgba(4,12,13,.72)}.painel{padding:clamp(14px,3vw,22px);display:grid;gap:14px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.status span{padding:12px;border:1px solid rgba(247,200,75,.25);border-radius:8px;background:rgba(4,12,13,.58);color:#d9e8d4}.status b{display:block;color:#ffe28a;font-size:1.3rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:grid;gap:12px;min-height:280px;padding:16px}.card img{width:72px;height:72px;border-radius:8px;object-fit:cover;box-shadow:0 0 18px rgba(247,200,75,.3)}.card p{color:#d9e8d4;line-height:1.45}.modal{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.68)}.modal.ativo{display:flex}.modal-conteudo{width:min(620px,100%);padding:22px;display:grid;gap:14px}.form{display:grid;gap:12px}.form input,.form select{min-height:42px;border:1px solid rgba(247,200,75,.3);border-radius:8px;background:rgba(4,12,13,.58);color:#fff7df;padding:0 12px}.preview{display:none;max-height:220px;width:100%;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.45)}.preview.visivel{display:block}.rpg-exp-barra{height:10px;border-radius:999px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,247,223,.14)}.rpg-exp-barra i{display:block;height:100%;background:linear-gradient(90deg,#36e0ff,#ffe28a);box-shadow:0 0 16px rgba(54,224,255,.55)}@media(max-width:860px){.grid,.status,.topo{grid-template-columns:1fr}}
</style>
</head>
<body class="pagina-formulario"><audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio><video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
<main class="app"><header class="topo"><div><small>Progressão</small><h1>Treinos</h1><p id="texto">Carregando personagem...</p></div><a class="voltar" href="lobby.html">Voltar</a></header><section class="painel"><div class="status" id="status"></div><div class="grid" id="grid"></div></section></main>
<div class="modal" id="modal"><div class="modal-conteudo"><div><small class="meta" id="modal-meta">Treino</small><h2 id="modal-titulo">Concluir treino</h2></div><form class="form" id="form"><input id="gmail" type="email" placeholder="Gmail cadastrado" required><input id="senha" type="password" placeholder="Senha do jogador" required><select id="rank"><option value="E">Rank E</option><option value="D">Rank D</option><option value="C">Rank C</option><option value="B">Rank B</option><option value="A">Rank A</option></select><input id="print" type="file" accept="image/*" required><img class="preview" id="preview" alt=""><p id="msg">Preencha tudo para receber EXP, berris e pontos.</p><button type="submit">Confirmar treino</button><button type="button" id="cancelar">Cancelar</button></form></div></div>
<script src="supabase-config.js"></script><script src="banco-personagens.js"></script><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script>
<script>
const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null');const treinos=[["Condicionamento","E","Folego, base fisica e resistencia."],["Tecnica do Estilo","D","Repeticao guiada do estilo de luta atual."],["Haki e Vontade","C","Controle mental, presenca e foco."],["Duelo Controlado","B","Combate assistido contra rival."],["Simulacao Extrema","A","Treino pesado com recompensa alta."]];let selecionado=null,printBase64='';function fmt(v){return Number(v||0).toLocaleString('pt-BR')}function render(){if(!personagem?.nome){location.href='index.html';return}const p=RpgSistemas.obterProgresso(personagem),e=RpgSistemas.estadoNivel(p);texto.textContent=`${personagem.nome} / ${personagem.estiloLuta||'Estilo nao definido'}`;status.innerHTML=`<span><b>Nv. ${e.nivel}</b>Nivel</span><span><b>${fmt(p.expDisponivel)}</b>EXP livre</span><span><b>${fmt(p.pontosAtributo)}</b>Pontos</span><span><b>${fmt(p.berris)}</b>Berris</span><span style="grid-column:1/-1"><div class="rpg-exp-barra"><i style="width:${e.percentual}%"></i></div>${fmt(e.expAtual)} / ${fmt(e.proximo)} EXP</span>`;grid.innerHTML=treinos.map((t,i)=>{const r=RpgSistemas.recompensasAtividade('treino',t[1],'treino');return `<article class="card"><img src="assets/img/sistemas/sistema-0.webp" alt=""><span class="meta">Rank ${t[1]}</span><h2>${t[0]}</h2><p>${t[2]}</p><p>+${r.exp} EXP / +${r.berris} berris / +${r.pontosAtributo} ponto(s)</p><button data-treino="${i}" type="button">Concluir treino</button></article>`}).join('');document.querySelectorAll('[data-treino]').forEach(b=>b.onclick=()=>abrir(+b.dataset.treino))}function abrir(i){selecionado=treinos[i];printBase64='';document.getElementById('modal-meta').textContent=`Treino / Rank ${selecionado[1]}`;document.getElementById('modal-titulo').textContent=selecionado[0];rank.value=selecionado[1];gmail.value=personagem.gmail||'';senha.value='';print.value='';preview.classList.remove('visivel');modal.classList.add('ativo')}function ler(arq){return new Promise((res,rej)=>{if(!arq?.type.startsWith('image/')){rej(new Error('Anexe uma imagem valida.'));return}const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(new Error('Nao foi possivel ler o print.'));f.readAsDataURL(arq)})}print.onchange=async()=>{try{printBase64=await ler(print.files?.[0]);preview.src=printBase64;preview.classList.add('visivel')}catch(e){msg.textContent=e.message}};form.onsubmit=async ev=>{ev.preventDefault();if(RpgSistemas.normalizar(gmail.value)!==RpgSistemas.normalizar(personagem.gmail)){msg.textContent='Gmail diferente do personagem logado.';return}if(String(personagem.senha||'')!==senha.value){msg.textContent='Senha invalida.';return}if(!printBase64){msg.textContent='Anexe o print do treino.';return}personagem.treinosConcluidos=[...(personagem.treinosConcluidos||[]),{titulo:selecionado[0],rank:rank.value,print:printBase64,concluidoEm:new Date().toISOString(),concluidoEmTexto:new Date().toLocaleString('pt-BR')}];const out=await RpgSistemas.concluirAtividade(personagem,{tipo:'treino',titulo:selecionado[0],rank:rank.value,periodo:'treino'});msg.textContent=`Treino concluido: +${out.recompensas.exp} EXP`;modal.classList.remove('ativo');render()};cancelar.onclick=()=>modal.classList.remove('ativo');render();
</script></body></html>
