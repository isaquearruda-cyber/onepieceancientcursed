<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game6">
    <style>
        body.pagina-formulario { position: relative; min-height: 100vh; padding: 0; overflow-x: hidden; background: #040c0d; color: #fff7df; }
        .treinos-app { position: relative; z-index: 2; width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: clamp(18px, 4vw, 42px) 0; display: grid; gap: 18px; }
        .treinos-topo, .treinos-painel, .treino-card, .modal-conteudo {
            border: 1px solid rgba(247, 200, 75, 0.28); border-radius: 8px;
            background: linear-gradient(180deg, rgba(7, 20, 22, 0.9), rgba(3, 8, 10, 0.92)), radial-gradient(circle at 50% 0%, rgba(247, 200, 75, 0.1), transparent 34%);
            box-shadow: 0 22px 54px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 247, 223, 0.06);
        }
        .treinos-topo { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: clamp(16px, 3vw, 26px); }
        .treinos-topo small, .treino-meta { color: #ffe28a; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }
        .treinos-topo h1 { margin: 4px 0 8px; color: #fff7df; font-family: "Segoe UI Black", "Arial Black", Impact, sans-serif; font-size: clamp(2.2rem, 6vw, 4.4rem); line-height: 0.94; text-transform: uppercase; text-shadow: 0 5px 0 #2a0d08, 0 14px 28px rgba(0,0,0,.68); }
        .botao-voltar, .treino-card button, .modal-acoes button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255, 226, 138, .52); border-radius: 8px; color: #1e211c; background: #f7c84b; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; }
        .botao-voltar { color: #fff7df; background: rgba(4,12,13,.72); }
        .treinos-painel { padding: clamp(14px, 3vw, 22px); display: grid; gap: 14px; }
        .treinos-status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .treinos-status span { padding: 12px; border: 1px solid rgba(247,200,75,.25); border-radius: 8px; background: rgba(4,12,13,.58); color: #d9e8d4; }
        .treinos-status b { display: block; color: #ffe28a; font-size: 1.3rem; }
        .treinos-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .treino-card { display: grid; gap: 12px; min-height: 280px; padding: 16px; }
        .treino-card img { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; box-shadow: 0 0 18px rgba(247,200,75,.3); }
        .treino-card h2 { margin: 0; color: #fff7df; }
        .treino-card p { color: #d9e8d4; line-height: 1.45; }
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.68); }
        .modal-overlay.ativo { display: flex; }
        .modal-conteudo { width: min(620px, 100%); padding: 22px; display: grid; gap: 14px; }
        .form-treino { display: grid; gap: 12px; }
        .form-treino input, .form-treino select { min-height: 42px; border: 1px solid rgba(247,200,75,.3); border-radius: 8px; background: rgba(4,12,13,.58); color: #fff7df; padding: 0 12px; }
        .preview-print { display: none; max-height: 220px; width: 100%; object-fit: contain; border-radius: 8px; background: rgba(0,0,0,.45); }
        .preview-print.visivel { display: block; }
        .rpg-exp-barra { height: 10px; border-radius: 999px; background: rgba(0,0,0,.55); overflow: hidden; border: 1px solid rgba(255,247,223,.14); }
        .rpg-exp-barra i { display: block; height: 100%; background: linear-gradient(90deg, #36e0ff, #ffe28a); box-shadow: 0 0 16px rgba(54,224,255,.55); }
        @media (max-width: 860px) { .treinos-grid, .treinos-status, .treinos-topo { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="pagina-formulario">
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>

    <main class="treinos-app">
        <header class="treinos-topo">
            <div>
                <small>Progressão</small>
                <h1>Treinos</h1>
                <p id="texto-personagem">Carregando personagem...</p>
            </div>
            <a class="botao-voltar" href="lobby.html">Voltar</a>
        </header>

        <section class="treinos-painel">
            <div class="treinos-status" id="treinos-status"></div>
            <div class="treinos-grid" id="treinos-grid"></div>
        </section>
    </main>

    <div class="modal-overlay" id="modal-treino">
        <div class="modal-conteudo">
            <div>
                <small class="treino-meta" id="modal-meta">Treino</small>
                <h2 id="modal-titulo">Concluir treino</h2>
            </div>
            <form class="form-treino" id="form-treino">
                <input id="treino-gmail" type="email" placeholder="Gmail cadastrado" required>
                <input id="treino-senha" type="password" placeholder="Senha do jogador" required>
                <select id="treino-rank">
                    <option value="E">Rank E</option><option value="D">Rank D</option><option value="C">Rank C</option><option value="B">Rank B</option><option value="A">Rank A</option>
                </select>
                <input id="treino-print" type="file" accept="image/*" required>
                <img class="preview-print" id="preview-print" alt="">
                <p id="status-envio">Preencha tudo para receber EXP, berris e pontos automaticamente.</p>
                <div class="modal-acoes">
                    <button type="submit" id="botao-enviar">Confirmar treino</button>
                    <button type="button" id="botao-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="banco-personagens.js?v=20260619-db2"></script>
    <script src="musica-fundo.js?v=20260619-game6"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg9"></script>
    <script>
        const personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const treinos = [
            ["Condicionamento", "E", "Folego, base fisica e resistencia para sustentar combates longos."],
            ["Tecnica do Estilo", "D", "Repeticao guiada do estilo de luta atual para abrir caminho na arvore."],
            ["Haki e Vontade", "C", "Controle mental, presenca e foco para narrativas de alto risco."],
            ["Duelo Controlado", "B", "Combate assistido contra rival para testar leitura e resposta."],
            ["Simulacao Extrema", "A", "Treino pesado com risco narrativo e recompensa alta."]
        ];
        let treinoSelecionado = null;
        let printBase64 = "";

        function formatar(valor) { return Number(valor || 0).toLocaleString("pt-BR"); }

        function renderizar() {
            if (!personagem?.nome) { window.location.href = "index.html"; return; }
            const progresso = RpgSistemas.obterProgresso(personagem);
            const estado = RpgSistemas.estadoNivel(progresso);
            document.getElementById("texto-personagem").textContent = `${personagem.nome} / ${personagem.estiloLuta || "Estilo nao definido"}`;
            document.getElementById("treinos-status").innerHTML = `
                <span><b>Nv. ${estado.nivel}</b> Nivel atual</span>
                <span><b>${formatar(progresso.expDisponivel)}</b> EXP livre</span>
                <span><b>${formatar(progresso.pontosAtributo)}</b> Pontos de atributo</span>
                <span><b>${formatar(progresso.berris)}</b> Berris</span>
                <span style="grid-column: 1 / -1"><div class="rpg-exp-barra"><i style="width:${estado.percentual}%"></i></div>${formatar(estado.expAtual)} / ${formatar(estado.proximo)} EXP para o proximo nivel</span>
            `;
            document.getElementById("treinos-grid").innerHTML = treinos.map(([nome, rank, texto], indice) => {
                const recompensa = RpgSistemas.recompensasAtividade("treino", rank, "treino");
                return `
                    <article class="treino-card">
                        <img src="assets/img/sistemas/sistema-0.webp" alt="">
                        <span class="treino-meta">Rank ${rank}</span>
                        <h2>${nome}</h2>
                        <p>${texto}</p>
                        <p>+${recompensa.exp} EXP / +${recompensa.berris} berris / +${recompensa.pontosAtributo} ponto(s)</p>
                        <button type="button" data-treino="${indice}">Concluir treino</button>
                    </article>
                `;
            }).join("");
            document.querySelectorAll("[data-treino]").forEach((botao) => botao.addEventListener("click", () => abrirTreino(Number(botao.dataset.treino))));
        }

        function abrirTreino(indice) {
            treinoSelecionado = treinos[indice];
            printBase64 = "";
            document.getElementById("modal-meta").textContent = `Treino / Rank ${treinoSelecionado[1]}`;
            document.getElementById("modal-titulo").textContent = treinoSelecionado[0];
            document.getElementById("treino-rank").value = treinoSelecionado[1];
            document.getElementById("treino-gmail").value = personagem.gmail || "";
            document.getElementById("treino-senha").value = "";
            document.getElementById("treino-print").value = "";
            document.getElementById("preview-print").classList.remove("visivel");
            document.getElementById("modal-treino").classList.add("ativo");
        }

        function fecharTreino() { document.getElementById("modal-treino").classList.remove("ativo"); }

        function lerImagem(arquivo) {
            return new Promise((resolve, reject) => {
                if (!arquivo?.type.startsWith("image/")) { reject(new Error("Anexe uma imagem valida.")); return; }
                const leitor = new FileReader();
                leitor.onload = () => resolve(leitor.result);
                leitor.onerror = () => reject(new Error("Nao foi possivel ler o print."));
                leitor.readAsDataURL(arquivo);
            });
        }

        document.getElementById("treino-print").addEventListener("change", async (evento) => {
            try {
                printBase64 = await lerImagem(evento.target.files?.[0]);
                const preview = document.getElementById("preview-print");
                preview.src = printBase64;
                preview.classList.add("visivel");
            } catch (erro) {
                document.getElementById("status-envio").textContent = erro.message;
            }
        });

        document.getElementById("form-treino").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            if (!treinoSelecionado) return;
            if (RpgSistemas.normalizar(document.getElementById("treino-gmail").value) !== RpgSistemas.normalizar(personagem.gmail)) {
                document.getElementById("status-envio").textContent = "Gmail diferente do personagem logado.";
                return;
            }
            if (String(personagem.senha || "") !== document.getElementById("treino-senha").value) {
                document.getElementById("status-envio").textContent = "Senha invalida.";
                return;
            }
            if (!printBase64) {
                document.getElementById("status-envio").textContent = "Anexe o print do treino.";
                return;
            }
            const rank = document.getElementById("treino-rank").value;
            personagem.treinosConcluidos = [...(personagem.treinosConcluidos || []), { titulo: treinoSelecionado[0], rank, print: printBase64, concluidoEm: new Date().toISOString(), concluidoEmTexto: new Date().toLocaleString("pt-BR") }];
            const resultado = await RpgSistemas.concluirAtividade(personagem, { tipo: "treino", titulo: treinoSelecionado[0], rank, periodo: "treino" });
            document.getElementById("status-envio").textContent = `Treino concluido: +${resultado.recompensas.exp} EXP, +${resultado.recompensas.berris} berris.`;
            fecharTreino();
            renderizar();
        });

        document.getElementById("botao-cancelar").addEventListener("click", fecharTreino);
        renderizar();
    </script>
</body>
</html>
