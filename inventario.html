            { chave: "diversos", nome: "Diversos", sprite: [0, 0], cor: "#f7c84b" }
        ];

        const statusPersonagem = document.getElementById("inventario-personagem-status");
        const inspecaoInventario = document.getElementById("inspecao-inventario");

	        const inputQuantidade = document.getElementById("input-item-quantidade");
        const inputDescricao = document.getElementById("input-item-descricao");

        const categoriaAtualTexto = document.getElementById("categoria-atual-texto");

        function escaparHtml(texto) {
            return String(texto || "").replace(/[&<>"']/g, (caractere) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[caractere]);
        }

        function chaveInventario() {
            return personagem?.nome ? `inventario_${personagem.nome}` : "";
        }

        function obterInventario() {
            if (!personagem) return [];
            return JSON.parse(localStorage.getItem(chaveInventario()) || "[]");
        }

        function salvarInventario(itens) {
            if (!personagem) return;
            localStorage.setItem(chaveInventario(), JSON.stringify(itens));
        }

	        function obterCategoria(chave) {
	            return categoriasInventario.find((categoria) => categoria.chave === chave) || categoriasInventario[0];
	        }

	        function raridadeDe(item) {
	            return raridadesInventario[item?.raridade] ? item.raridade : "Comum";
	        }

	        function corRaridade(item) {
	            return raridadesInventario[raridadeDe(item)].cor;
	        }

	        function pesoRaridade(item) {
	            return raridadesInventario[raridadeDe(item)].peso;
	        }

        function obterSprite(itemOuCategoria) {
            const sprite = itemOuCategoria?.sprite || obterCategoria(itemOuCategoria?.tipo || itemOuCategoria?.chave).sprite || [0, 0];
            return Array.isArray(sprite) ? sprite : [0, 0];
        }

        function simboloCategoria(itemOuCategoria) {
            const chave = itemOuCategoria?.tipo || itemOuCategoria?.chave || "todos";
            const simbolos = {
                todos: "◆",
                alimentacao: "✦",
                armamentos: "⚔",
                equipamentos: "◈",
                vestimentas: "◐",
                medicinais: "+",
                ferramentas: "⚙",
                navegacao: "⌖",
                recursos: "▣",
                nauticos: "◒",
                tesouros: "◇",
                documentos: "≡",
                especiais: "✹",
                consumiveis: "●",
                tecnologicos: "✧",
                materiais: "▰",
                berris: "$",
                cacaepesca: "◌",
                diversos: "◆"
            };
            return simbolos[chave] || "◆";
        }

        function estiloSprite(itemOuCategoria, tamanho = "") {
            const [coluna, linha] = obterSprite(itemOuCategoria);
            const x = coluna <= 0 ? 0 : coluna >= 5 ? 100 : coluna * 20;
            const y = linha <= 0 ? 0 : linha >= 2 ? 100 : linha * 50;
            const chave = itemOuCategoria?.tipo || itemOuCategoria?.chave || "todos";
            const cor = itemOuCategoria?.cor || obterCategoria(chave).cor || "#ffe28a";
            const imagem = `assets/img/inventario/${chave === "diversos" ? "todos" : chave}.webp`;
            return `--sprite-x:${x}%;--sprite-y:${y}%;--cor-icone:${cor};--icone-url:url("${imagem}");--icone-simbolo:"${simboloCategoria(itemOuCategoria)}";${tamanho ? `--icone-tamanho:${tamanho};` : ""}`;
        }

        function iconeSprite(itemOuCategoria, tamanho = "") {
            return `<span class="icone-sprite" style="${estiloSprite(itemOuCategoria, tamanho)}"></span>`;
        }

        function renderizarSlotsVazios(quantidade) {
            return Array.from({ length: Math.max(0, quantidade) }, (_, indice) => `
                <div class="slot-vazio-quadrado" aria-hidden="true" style="--slot-indice:${indice}"></div>
            `).join("");
        }

        function obterBackupPersonagem() {
            if (!personagem) return { historico: [] };
            const backup = JSON.parse(localStorage.getItem(`personagem_backup_${personagem.nome}`) || "{}");
            return {
                historico: Array.isArray(backup.historico) ? backup.historico : []
            };
        }

        function registrarHistorico(de, para) {
            if (!personagem) return;
            try {
                const chaveBackup = `personagem_backup_${personagem.nome}`;
                const backup = JSON.parse(localStorage.getItem(chaveBackup) || "{}");
                const historico = Array.isArray(backup.historico) ? backup.historico : [];
                historico.push({
                    quando: new Date().toLocaleString("pt-BR"),
                    quem: personagem.nome,
                    autor: personagem.nome,
                    tipo: "inventario",
                    de,
                    para
                });
                localStorage.setItem(chaveBackup, JSON.stringify({ ...backup, personagem, historico }));
            } catch (erro) {
                console.warn("Não foi possível registrar histórico do inventário.", erro);
            }
        }

        function slotEquipamentoDoItem(item) {
            const tipo = String(item?.tipo || "");
            const nome = String(item?.nome || "").toLowerCase();
            if (tipo === "armamentos" || /espada|arma|pistola|rifle|katana|meito|canhao/.test(nome)) return "arma";
            if (tipo === "vestimentas" || /capa|roupa|armadura|casaco|uniforme/.test(nome)) return "roupa";
            if (tipo === "equipamentos" || tipo === "tecnologicos" || /anel|colar|den den|luva|bota|oculos/.test(nome)) return "acessorio";
            if (tipo === "tesouros" || tipo === "especiais" || /trofeu|troféu|reliquia|relíquia|nucleo|núcleo/.test(nome)) return "reliquia";
            if (tipo === "navegacao" || tipo === "nauticos" || /mapa|log pose|bussola|bússola|navio/.test(nome)) return "naval";
            return "";
        }

        function alternarEquipamento(id) {
            if (!personagem) return;
            const inventario = obterInventario();
            const item = inventario.find((entrada) => Number(entrada.id) === Number(id));
            if (!item) return;
            const slot = slotEquipamentoDoItem(item);
            if (!slot) {
                RpgFeedback?.aviso?.("Item não equipável", [item.nome]);
                return;
            }
            const antes = JSON.parse(JSON.stringify(inventario));
            if (item.equipado === slot) {
                delete item.equipado;
            } else {
                inventario.forEach((entrada) => {
                    if (entrada.equipado === slot) delete entrada.equipado;
                });
                item.equipado = slot;
                item.equipadoEm = new Date().toLocaleString("pt-BR");
            }
            salvarInventario(inventario);
            registrarHistorico(antes, inventario);
            renderizarInventario();
            renderizarHistorico();
            mostrarDetalhe(item);
            RpgFeedback?.aviso?.(item.equipado ? "Equipado" : "Retirado", [item.nome]);
        }

        function contarPorCategoria(inventario) {
            return categoriasInventario.reduce((contadores, categoria) => {
                contadores[categoria.chave] = categoria.chave === "todos"
                    ? inventario.length
                    : inventario.filter((item) => item.tipo === categoria.chave).length;
                return contadores;
            }, {});
        }

        function selecionarCategoria(chave) {
            categoriaAtiva = obterCategoria(chave).chave;
            renderizarInventario();
        }

	        function mostrarDetalhe(item) {
            if (!item) {
                inspecaoInventario.style.setProperty("--detalhe-cor", "#ffe28a");
                nomeItemDetalhe.textContent = "Nenhum item";
                rankItemDetalhe.textContent = "--";
                itemArte.innerHTML = iconeSprite({ chave: "todos", cor: "#ffe28a" }, "150px");
                itemStats.innerHTML = `
                    <div class="item-stat"><span>Categoria</span><b>--</b></div>
                    <div class="item-stat"><span>Quantidade</span><b>--</b></div>
                    <div class="item-stat"><span>Estado</span><b>Selecione</b></div>
                    <div class="item-stat"><span>Uso</span><b>--</b></div>
                `;
                detalheItem.innerHTML = `
                    <strong>Selecione um item</strong>
                    <p>Clique em um slot para abrir a ficha do item neste painel.</p>
                `;
                return;
            }

	            const categoria = obterCategoria(item.tipo);
	            const raridade = raridadeDe(item);
                const equipavel = slotEquipamentoDoItem(item);
                inspecaoInventario.style.setProperty("--detalhe-cor", corRaridade(item));
                nomeItemDetalhe.textContent = item.nome || "Item";
                rankItemDetalhe.textContent = raridade;
                itemArte.innerHTML = iconeSprite(item, "150px");
                itemStats.innerHTML = `
                    <div class="item-stat"><span>Categoria</span><b>${escaparHtml(categoria.nome)}</b></div>
                    <div class="item-stat"><span>Quantidade</span><b>x${escaparHtml(item.quantidade)}</b></div>
                    <div class="item-stat"><span>Estado</span><b>${item.equipado ? "Equipado" : "Guardado"}</b></div>
                    <div class="item-stat"><span>Uso</span><b>${equipavel ? "Equipável" : "Carga"}</b></div>
                `;
	            detalheItem.innerHTML = `
	                <div class="detalhe-item-cabecalho">
	                    ${iconeSprite(item, "52px")}
	                    <div>
	                        <strong>${escaparHtml(item.nome)}</strong>
	                        <span>${escaparHtml(categoria.nome)} / x${escaparHtml(item.quantidade)}</span>
	                    </div>
	                </div>
	                <div class="detalhe-meta">
	                    <span style="color:${corRaridade(item)}">${escaparHtml(raridade)}</span>
	                    <span>${escaparHtml(categoria.nome)}</span>
	                    <span>${escaparHtml(item.adicionadoEm || "Sem data")}</span>
	                </div>
	                <p>${escaparHtml(item.descricao || "Sem descrição registrada.")}</p>
                    <div class="detalhe-acoes">
                        ${equipavel ? `<button type="button" data-detalhe-equipar="${Number(item.id)}">${item.equipado ? "Retirar" : "Equipar"}</button>` : `<button type="button" disabled>Não equipável</button>`}
                        <button type="button" data-detalhe-remover="${Number(item.id)}">Descartar</button>
                    </div>
	            `;
                detalheItem.querySelector("[data-detalhe-equipar]")?.addEventListener("click", () => alternarEquipamento(Number(item.id)));
                detalheItem.querySelector("[data-detalhe-remover]")?.addEventListener("click", () => removerItem(Number(item.id)));
	        }

	        function filtrarOrdenar(inventario) {
	            const termo = termoBusca.trim().toLowerCase();
	            return inventario
	                .filter((item) => categoriaAtiva === "todos" || item.tipo === categoriaAtiva)
	                .filter((item) => raridadeAtiva === "todas" || raridadeDe(item) === raridadeAtiva)
	                .filter((item) => {
	                    if (!termo) return true;
	                    const categoria = obterCategoria(item.tipo).nome;
	                    return [item.nome, item.descricao, categoria, raridadeDe(item)].join(" ").toLowerCase().includes(termo);
	                })
	                .sort((a, b) => {
	                    if (ordemInventario === "nome") return String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR");
	                    if (ordemInventario === "quantidade") return Number(b.quantidade || 0) - Number(a.quantidade || 0);
	                    if (ordemInventario === "recente") return Number(b.id || 0) - Number(a.id || 0);
	                    return pesoRaridade(b) - pesoRaridade(a) || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR");
	                });
	        }

	        function renderizarMetricas(inventario) {
	            const totalItens = inventario.reduce((soma, item) => soma + Math.max(1, Number(item.quantidade || 1)), 0);
	            const lendarios = inventario.filter((item) => raridadeDe(item) === "Lendário").length;
	            const epicos = inventario.filter((item) => raridadeDe(item) === "Épico").length;
	            const categoriasUsadas = new Set(inventario.map((item) => item.tipo)).size;
                const equipados = inventario.filter((item) => item.equipado).length;
	            const capacidade = Math.min(100, Math.round((inventario.length / capacidadeMaxima) * 100));
	            metricasInventario.style.setProperty("--capacidade", `${capacidade}%`);
	            metricasInventario.innerHTML = `
	                <div class="inventario-metrica"><span>Slots</span><b>${inventario.length}/${capacidadeMaxima}</b></div>
	                <div class="inventario-metrica"><span>Qtd. total</span><b>${totalItens.toLocaleString("pt-BR")}</b></div>
	                <div class="inventario-metrica"><span>Épicos+</span><b>${(epicos + lendarios).toLocaleString("pt-BR")}</b></div>
	                <div class="inventario-metrica"><span>Equipados</span><b>${equipados}/${slotsEquipamento.length}</b></div>
	                <div class="inventario-capacidade"><i></i></div>
	            `;
	        }

        function renderizarEquipamentos(inventario) {
            equipamentoSlotsEl.innerHTML = slotsEquipamento.map((slot) => {
                const item = inventario.find((entrada) => entrada.equipado === slot.chave);
                return `
                    <article class="equipamento-slot ${item ? "equipado" : ""}">
                        <strong>${escaparHtml(slot.nome)}</strong>
                        ${item ? `${iconeSprite(item, "34px")}<span>${escaparHtml(item.nome)}</span>` : `<span>Vazio</span>`}
                    </article>
                `;
            }).join("");
        }

        function renderizarCategorias(inventario) {
            const contadores = contarPorCategoria(inventario);
            categoriasEl.innerHTML = categoriasInventario.map((categoria) => `
                <button class="categoria-jogo ${categoriaAtiva === categoria.chave ? "ativa" : ""}" type="button" data-categoria="${categoria.chave}" style="--cor-categoria:${categoria.cor}">
                    ${iconeSprite(categoria)}
                    <strong>${categoria.nome}</strong>
                    <small>${contadores[categoria.chave] || 0}</small>
                </button>
            `).join("");

            categoriasEl.querySelectorAll("[data-categoria]").forEach((botao) => {
                botao.addEventListener("click", () => selecionarCategoria(botao.dataset.categoria));
            });

            document.querySelectorAll(".inventario-abas [data-categoria]").forEach((botao) => {
                botao.classList.toggle("ativa", categoriaAtiva === botao.dataset.categoria);
            });

            const categoria = obterCategoria(categoriaAtiva);
            categoriaAtualImagem.setAttribute("style", estiloSprite(categoria));
            categoriaAtualTexto.textContent = categoriaAtiva === "todos" ? "Categorias" : categoria.nome;
        }

        function renderizarInventario() {
            const inventario = obterInventario();
            const categoria = obterCategoria(categoriaAtiva);
	            const filtrados = filtrarOrdenar(inventario);

	            renderizarCategorias(inventario);
	            renderizarMetricas(inventario);
                renderizarEquipamentos(inventario);
	            tituloEl.textContent = categoriaAtiva === "todos" ? "Todos os itens" : categoria.nome;
	            resumoEl.textContent = `${filtrados.length} ${filtrados.length === 1 ? "item encontrado" : "itens encontrados"} / ${inventario.length} no inventário`;
	            rodapeResumo.textContent = `Sort: ${categoria.nome} / ${ordemSelect.options[ordemSelect.selectedIndex]?.text || "Raridade"}`;

            if (!personagem) {
                gridEl.innerHTML = renderizarSlotsVazios(slotsMinimos);
                mostrarDetalhe(null);
                return;
            }

            if (inventario.length === 0) {
                gridEl.innerHTML = renderizarSlotsVazios(slotsMinimos);
                mostrarDetalhe(null);
                return;
            }

            if (filtrados.length === 0) {
                gridEl.innerHTML = renderizarSlotsVazios(slotsMinimos);
                mostrarDetalhe(null);
                return;
            }

	            const slotsOcupados = filtrados.map((item) => {
	                const itemCategoria = obterCategoria(item.tipo);
	                const raridade = raridadeDe(item);
                    const slotEquipavel = slotEquipamentoDoItem(item);
	                return `
	                    <article class="slot-jogo ${item.equipado ? "equipado" : ""}" data-id="${Number(item.id)}" tabindex="0" data-raridade="${escaparHtml(raridade)}" data-tippy-content="${escaparHtml(item.nome)} / ${escaparHtml(raridade)}" style="--cor-item:${itemCategoria.cor};--cor-raridade:${corRaridade(item)}">
	                        <button class="slot-remover" type="button" data-remover="${Number(item.id)}" title="Remover">x</button>
	                        <span class="slot-raridade">${escaparHtml(raridade)}</span>
	                        <div class="slot-icone">${iconeSprite(item, "58px")}</div>
	                        <strong class="slot-nome">${escaparHtml(item.nome)}</strong>
                        <span class="slot-qtd">x${escaparHtml(item.quantidade)}</span>
                        ${slotEquipavel ? `<button class="slot-equipar" type="button" data-equipar="${Number(item.id)}">${item.equipado ? "Retirar" : "Equipar"}</button>` : ""}
                    </article>
                `;
            }).join("");
            gridEl.innerHTML = slotsOcupados + renderizarSlotsVazios(slotsMinimos - filtrados.length);

            gridEl.querySelectorAll(".slot-jogo").forEach((slot) => {
                const item = filtrados.find((entrada) => Number(entrada.id) === Number(slot.dataset.id));
                slot.addEventListener("focus", () => mostrarDetalhe(item));
                slot.addEventListener("click", (evento) => {
                    if (!evento.target.closest("[data-remover],[data-equipar]")) mostrarDetalhe(item);
                });
            });

	            gridEl.querySelectorAll("[data-remover]").forEach((botao) => {
                botao.addEventListener("click", (evento) => {
                    evento.stopPropagation();
                    removerItem(Number(botao.dataset.remover));
                });
	            });
            gridEl.querySelectorAll("[data-equipar]").forEach((botao) => {
                botao.addEventListener("click", (evento) => {
                    evento.stopPropagation();
                    alternarEquipamento(Number(botao.dataset.equipar));
                });
            });
	            if (window.VanillaTilt) {
	                window.VanillaTilt.init(Array.from(gridEl.querySelectorAll(".slot-jogo")), { max: 7, speed: 320, glare: true, "max-glare": 0.18 });
	            }
	            if (window.tippy) {
	                window.tippy(gridEl.querySelectorAll(".slot-jogo"), { theme: "rpg", placement: "top", delay: [120, 0] });
	            }
	        }

        function renderizarHistorico() {
            const historico = obterBackupPersonagem().historico.filter((item) => item.tipo === "inventario").reverse();

            if (historico.length === 0) {
                historicoInventario.innerHTML = `<div class="historico-card">Nenhuma alteração de inventário registrada.</div>`;
                return;
            }

            historicoInventario.innerHTML = historico.slice(0, 8).map((item) => `
                <div class="historico-card">
                    <strong>${escaparHtml(item.quando)}</strong>
                    <span>Autor: ${escaparHtml(item.autor || item.quem || "sistema")}</span>
                    <span>Antes: ${resumoInventario(item.de)}</span>
                    <span>Depois: ${resumoInventario(item.para)}</span>
                </div>
            `).join("");
        }

        function resumoInventario(inventario) {
            if (!Array.isArray(inventario) || inventario.length === 0) return "Vazio";
            return inventario.map((item) => `${escaparHtml(item.nome)} x${escaparHtml(item.quantidade)}`).slice(0, 4).join(", ");
        }

        function adicionarItem(evento) {
            evento.preventDefault();
            if (!personagem) return;

            const nome = inputNome.value.trim();
            if (!nome) {
                inputNome.focus();
                return;
            }

            const inventario = obterInventario();
            const antes = JSON.parse(JSON.stringify(inventario));
            const categoria = obterCategoria(inputTipo.value);
            const novoItem = {
                id: Date.now(),
                nome,
	                tipo: inputTipo.value,
	                sprite: categoria.sprite,
	                raridade: inputRaridade.value,
	                quantidade: Math.max(1, Number.parseInt(inputQuantidade.value, 10) || 1),
                descricao: inputDescricao.value.trim(),
                adicionadoEm: new Date().toLocaleString("pt-BR")
            };

            inventario.push(novoItem);
            salvarInventario(inventario);
            registrarHistorico(antes, inventario);
            formAdicionar.reset();
	            inputQuantidade.value = "1";
	            inputTipo.value = "alimentacao";
	            inputRaridade.value = "Comum";
	            renderizarInventario();
            renderizarHistorico();
            mostrarDetalhe(novoItem);
        }

        function removerItem(id) {
            if (!personagem || !confirm("Remover este item do inventário?")) return;

            const inventario = obterInventario();
            const antes = JSON.parse(JSON.stringify(inventario));
            const atualizado = inventario.filter((item) => Number(item.id) !== Number(id));
            salvarInventario(atualizado);
            registrarHistorico(antes, atualizado);
            renderizarInventario();
            renderizarHistorico();
        }

        function inicializarPersonagem() {
            inputTipo.innerHTML = categoriasInventario
                .filter((categoria) => categoria.chave !== "todos")
                .map((categoria) => `<option value="${categoria.chave}">${categoria.nome}</option>`)
                .join("");

            if (!personagem) {
                statusPersonagem.textContent = "Nenhum personagem ativo";
                return;
            }

            statusPersonagem.textContent = `${personagem.classe || "Classe"} / ${personagem.profissao || "Especialidade"}`;
        }

        document.getElementById("alternar-adicionar").addEventListener("click", () => {
            painelAdicionar.classList.toggle("ativo");
            if (painelAdicionar.classList.contains("ativo")) inputNome.focus();
        });

        document.getElementById("alternar-historico").addEventListener("click", () => {
            historicoInventario.classList.toggle("ativo");
            renderizarHistorico();
        });

        alternarCategorias.addEventListener("click", () => {
            categoriasRecolhidas = !categoriasRecolhidas;
            categoriasRecolhiveis.classList.toggle("recolhido", categoriasRecolhidas);
            alternarCategorias.setAttribute("aria-expanded", categoriasRecolhidas ? "false" : "true");
        });

        document.getElementById("limpar-formulario").addEventListener("click", () => {
            formAdicionar.reset();
	            inputQuantidade.value = "1";
	            inputTipo.value = "alimentacao";
	            inputRaridade.value = "Comum";
	            inputNome.focus();
	        });

	        buscaInventario.addEventListener("input", () => {
	            termoBusca = buscaInventario.value;
	            renderizarInventario();
	        });

	        filtroRaridade.addEventListener("change", () => {
	            raridadeAtiva = filtroRaridade.value;
	            renderizarInventario();
	        });

	        ordemSelect.addEventListener("change", () => {
	            ordemInventario = ordemSelect.value;
	            renderizarInventario();
	        });

        document.querySelectorAll(".inventario-abas [data-categoria]").forEach((botao) => {
            botao.addEventListener("click", () => selecionarCategoria(botao.dataset.categoria));
        });

        formAdicionar.addEventListener("submit", adicionarItem);
	        window.addEventListener("storage", (evento) => {
	            if (evento.key === chaveInventario() || evento.key === "ultimoPersonagem") {
	                window.location.reload();
	            }
	        });
	        window.addEventListener("rpg:cdn-ready", renderizarInventario);

	        inicializarPersonagem();
        renderizarInventario();
        renderizarHistorico();
    </script>
</body>
</html>
