<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventário - One Piece RPG</title><link rel="stylesheet" href="estilo.css"><style>html,body{margin:0;min-height:100%;background:#06100d;color:#fff7df}.video-fundo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.42) saturate(1.15)}.app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:12px;padding:clamp(14px,2.6vw,34px);background:radial-gradient(circle at 78% 24%,rgba(247,200,75,.18),transparent 30%),radial-gradient(circle at 18% 14%,rgba(36,99,74,.26),transparent 32%)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1180px,100%);margin:0 auto;text-shadow:0 2px 10px #000}h1{margin:0;font-size:clamp(1.7rem,4vw,3rem);line-height:1}p{margin:0;color:#d9e8d4}.back{min-width:112px;padding:10px 14px;border:1px solid rgba(255,247,223,.34);border-radius:8px;color:#fff7df;background:rgba(3,8,10,.56);text-align:center;text-decoration:none;font-weight:900}.back:hover{border-color:#ffe28a;background:rgba(247,200,75,.16)}.add,.history{display:none;width:min(1180px,100%);margin:0 auto;padding:14px;border:1px solid rgba(247,200,75,.22);background:rgba(3,8,10,.72);backdrop-filter:blur(8px)}.add.on,.history.on{display:grid}.form{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,.9fr) 100px minmax(220px,1.4fr) auto auto;gap:10px;align-items:end}.form label{display:grid;gap:6px;color:#ffe28a;font-size:.78rem;font-weight:900;text-transform:uppercase}.form input,.form select{min-height:42px;border:1px solid rgba(255,247,223,.14);border-radius:8px;padding:9px 11px;color:#fff7df;background:rgba(2,5,5,.72)}.form button,.acao{min-height:42px;padding:9px 12px;border:1px solid rgba(247,200,75,.34);border-radius:8px;color:#fff7df;background:rgba(247,200,75,.14);cursor:pointer;font-weight:900}.shell{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:clamp(16px,2.4vw,28px);min-height:0;border:1px solid rgba(255,247,223,.14);background:linear-gradient(90deg,rgba(2,7,8,.88),rgba(14,26,20,.66)),repeating-linear-gradient(0deg,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 5px);box-shadow:0 26px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,247,223,.08);backdrop-filter:blur(8px)}.main{display:grid;grid-template-rows:auto auto 1fr;gap:14px;min-width:0;padding:clamp(16px,2.3vw,26px)}.tabs{display:flex;align-items:center;gap:18px;padding-bottom:10px;border-bottom:1px solid rgba(255,247,223,.12);overflow:auto}.tabs button{display:grid;place-items:center;width:46px;height:42px;border:1px solid transparent;border-radius:8px;background:transparent;color:#ffe28a;cursor:pointer}.tabs button.on,.tabs button:hover{border-color:rgba(255,226,138,.52);background:rgba(255,247,223,.08)}.icon{display:block;width:var(--sz,34px);height:var(--sz,34px);border-radius:7px;background-image:url('assets/img/inventario/categorias-sprite.webp');background-size:600% 300%;background-position:var(--x,0%) var(--y,0%);box-shadow:0 0 12px rgba(247,200,75,.24)}.status{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.status strong{font-size:clamp(1.05rem,2vw,1.35rem)}.actions{display:flex;gap:8px}.body{display:grid;grid-template-columns:minmax(165px,210px) 1fr;gap:14px;min-height:0}.fold{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0}.fold.closed{grid-template-rows:auto}.fold.closed nav{display:none}.foldBtn{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;min-height:46px;padding:7px 9px;border:1px solid rgba(247,200,75,.32);border-radius:8px;color:#fff7df;background:linear-gradient(90deg,rgba(247,200,75,.18),rgba(3,8,10,.72));cursor:pointer;font-weight:900;text-align:left}.cats{display:grid;align-content:start;gap:8px;max-height:clamp(280px,calc(100vh - 450px),420px);overflow:auto;padding-right:4px}.cat{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;min-height:50px;padding:7px 9px;border:1px solid rgba(255,247,223,.12);border-radius:8px;background:rgba(3,8,10,.54);color:#d9e8d4;cursor:pointer;text-align:left}.cat.on,.cat:hover{border-color:color-mix(in srgb,var(--c,#ffe28a) 68%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c,#f7c84b) 24%,transparent),rgba(3,8,10,.62));color:#fff7df}.cat small{min-width:28px;padding:4px 7px;border-radius:999px;color:#172018;background:#f7c84b;font-size:.76rem;font-weight:900;text-align:center}.gridWrap{min-width:0;border:1px solid rgba(255,247,223,.08);background:rgba(2,5,5,.46);box-shadow:inset 0 0 32px rgba(0,0,0,.42)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;align-content:start;max-height:clamp(280px,calc(100vh - 450px),420px);overflow:auto;padding:12px}.slot,.empty{position:relative;aspect-ratio:1;border:1px solid rgba(255,247,223,.12);border-radius:4px;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--c,#f7c84b) 20%,transparent),transparent 46%),linear-gradient(180deg,rgba(31,38,27,.86),rgba(6,10,8,.9));box-shadow:inset 0 1px 0 rgba(255,247,223,.06),0 12px 20px rgba(0,0,0,.24);overflow:hidden;color:#fff7df}.slot{display:grid;grid-template-rows:auto 1fr auto;gap:5px;padding:8px}.slot:hover{border-color:var(--c,#ffe28a);box-shadow:0 0 0 2px color-mix(in srgb,var(--c,#f7c84b) 26%,transparent)}.slotIcon{display:grid;place-items:center;align-self:center}.slotIcon .icon{--sz:58px}.slotName{align-self:end;font-size:.78rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}.qtd{position:absolute;left:7px;bottom:6px;font-size:.74rem;font-weight:900;text-shadow:0 2px 6px #000}.remove{justify-self:end;width:26px;height:26px;border:1px solid rgba(255,148,122,.34);border-radius:50%;color:#ffd6cc;background:rgba(80,12,9,.68);cursor:pointer;font-weight:900}.empty{background:linear-gradient(135deg,rgba(255,247,223,.035),transparent 42%),rgba(0,0,0,.26)}.empty:after{content:"";position:absolute;inset:38%;border:1px solid rgba(255,247,223,.08);transform:rotate(45deg)}.side{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(16px,2.2vw,24px);border-left:1px solid rgba(255,247,223,.1);background:linear-gradient(180deg,rgba(255,247,223,.05),rgba(3,8,10,.32));overflow:hidden}.sideTop{text-align:center}.sideTop span{color:#ffe28a;font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.sideTop strong{font-size:clamp(1.25rem,2.2vw,1.8rem);overflow-wrap:anywhere}.figure{display:grid;place-items:end center;min-height:clamp(230px,calc(100vh - 500px),430px)}.figure img{display:none;max-width:min(100%,280px);max-height:clamp(280px,calc(100vh - 330px),500px);object-fit:contain;filter:drop-shadow(0 22px 22px rgba(0,0,0,.6))}.figure.has img{display:block}.placeholder{display:grid;place-items:center;width:min(90%,250px);aspect-ratio:3/4;border:1px solid rgba(255,226,138,.28);border-radius:8px;color:rgba(255,247,223,.7);background:rgba(255,247,223,.06);text-align:center;padding:16px}.figure.has .placeholder{display:none}.detail{min-height:110px;padding:14px;border:1px solid rgba(255,247,223,.16);background:rgba(3,8,10,.46)}.detail strong{display:block;color:#ffe28a;margin-bottom:7px}.hist{display:grid;gap:6px;padding:10px;border:1px solid rgba(255,247,223,.1);color:#d9e8d4;background:rgba(0,0,0,.26)}@media(max-width:960px){.shell{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid rgba(255,247,223,.1)}.body,.form{grid-template-columns:1fr}.status{grid-template-columns:1fr}}@media(max-width:560px){header,footer{align-items:stretch;flex-direction:column}.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><video class="video-fundo" autoplay muted loop playsinline><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header><div><p id="pstatus">Carregando personagem...</p><h1>Inventário</h1></div><a class="back" href="lobby.html">Voltar ao Lobby</a></header><section class="add" id="add"><form class="form" id="form"><label>Item<input id="iname" placeholder="Espada, fruta, mapa..."></label><label>Categoria<select id="itype"></select></label><label>Qtd.<input id="iqtd" type="number" min="1" value="1"></label><label>Descrição<input id="idesc" placeholder="Efeito, origem ou observação"></label><button type="submit">Adicionar</button><button type="button" id="clear">Limpar</button></form></section><section class="history" id="history"></section><section class="shell"><div class="main"><nav class="tabs" id="tabs"></nav><div class="status"><div><strong id="title">Todos os itens</strong><p id="summary">0 itens no inventário</p></div><div class="actions"><button class="acao" id="toggleAdd">Adicionar</button><button class="acao" id="toggleHist">Histórico</button></div></div><div class="body"><div class="fold" id="fold"><button class="foldBtn" id="foldBtn" type="button"><span class="icon" id="curIcon"></span><span id="curText">Categorias</span><b>▾</b></button><nav class="cats" id="cats"></nav></div><div class="gridWrap"><div class="grid" id="grid"></div></div></div></div><aside class="side"><div class="sideTop"><span>Personagem</span><strong id="pname">Sem personagem</strong></div><div class="figure" id="fig"><img id="pimg" alt=""><div class="placeholder">Imagem do personagem não enviada</div></div><div class="detail" id="detail"><strong>Selecione um item</strong><p>Passe o mouse ou toque em um slot para ver a descrição aqui.</p></div></aside></section><footer><span id="foot">Sort: categoria</span><span>Back: lobby</span></footer></main><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null');let active=new URLSearchParams(location.search).get('categoria')||'todos',closed=false;const minSlots=36,catsData=[['todos','Todos',[0,0],'#f7c84b'],['alimentacao','Alimentação',[1,0],'#ff8a3d'],['armamentos','Armamentos',[2,0],'#ff4f3a'],['equipamentos','Equipamentos',[3,0],'#78c7ff'],['vestimentas','Vestimentas',[4,0],'#8f7bff'],['medicinais','Medicinais',[5,0],'#ff6d6d'],['ferramentas','Ferramentas',[0,1],'#c4a46b'],['navegacao','Navegação',[1,1],'#49d2ff'],['recursos','Recursos',[2,1],'#b78953'],['nauticos','Náuticos',[3,1],'#3aa7ff'],['tesouros','Tesouros',[4,1],'#ffd44d'],['documentos','Documentos',[5,1],'#d7b277'],['especiais','Especiais',[0,2],'#b64cff'],['consumiveis','Consumíveis',[1,2],'#ffa536'],['tecnologicos','Tecnológicos',[2,2],'#36e0ff'],['materiais','Materiais',[3,2],'#d79a5a'],['berris','Berris',[4,2],'#ffcf3e'],['cacaepesca','Caça e Pesca',[5,2],'#64d6a4'],['diversos','Diversos',[0,0],'#f7c84b']];function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function cat(k){return catsData.find(c=>c[0]==k)||catsData[0]}function key(){return personagem?.nome?`inventario_${personagem.nome}`:''}function inv(){return personagem?JSON.parse(localStorage.getItem(key())||'[]'):[]}function save(a){if(personagem)localStorage.setItem(key(),JSON.stringify(a))}function sprite(o,sz=''){let s=Array.isArray(o)?o:(o?.sprite||cat(o?.tipo||o?.chave)[2]),x=s[0]<=0?0:s[0]>=5?100:s[0]*20,y=s[1]<=0?0:s[1]>=2?100:s[1]*50;return`--x:${x}%;--y:${y}%;${sz?`--sz:${sz};`:''}`}function icon(o,sz=''){return`<span class="icon" style="${sprite(o,sz)}"></span>`}function counts(a){return catsData.reduce((m,c)=>(m[c[0]]=c[0]=='todos'?a.length:a.filter(i=>i.tipo==c[0]).length,m),{})}function empties(n){return Array.from({length:Math.max(0,n)},()=>'<div class="empty"></div>').join('')}function detailItem(i){if(!i){detail.innerHTML='<strong>Selecione um item</strong><p>Passe o mouse ou toque em um slot para ver a descrição aqui.</p>';return}let c=cat(i.tipo);detail.innerHTML=`<div style="display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin-bottom:8px">${icon(i,'52px')}<div><strong>${esc(i.nome)}</strong><p>${esc(c[1])} / x${esc(i.quantidade)}</p></div></div><p>${esc(i.descricao||'Sem descrição registrada.')}</p>`}function hist(de,para){if(!personagem)return;try{let k=`personagem_backup_${personagem.nome}`,b=JSON.parse(localStorage.getItem(k)||'{}'),h=Array.isArray(b.historico)?b.historico:[];h.push({quando:new Date().toLocaleString('pt-BR'),autor:personagem.nome,tipo:'inventario',de,para});localStorage.setItem(k,JSON.stringify({...b,personagem,historico:h}))}catch(e){}}function renderCats(a){let cnt=counts(a);cats.innerHTML=catsData.map(c=>`<button class="cat ${active==c[0]?'on':''}" data-cat="${c[0]}" style="--c:${c[3]}">${icon(c[2])}<strong>${c[1]}</strong><small>${cnt[c[0]]||0}</small></button>`).join('');cats.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});tabs.innerHTML=catsData.slice(0,6).map(c=>`<button class="${active==c[0]?'on':''}" data-cat="${c[0]}" title="${c[1]}">${icon(c[2],'30px')}</button>`).join('');tabs.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});let c=cat(active);curIcon.setAttribute('style',sprite(c[2]));curText.textContent=active=='todos'?'Categorias':c[1]}function render(){let a=inv(),c=cat(active),f=active=='todos'?a:a.filter(i=>i.tipo==active);renderCats(a);title.textContent=active=='todos'?'Todos os itens':c[1];summary.textContent=`${f.length} ${f.length==1?'item':'itens'} ${active=='todos'?'no inventário':'nesta categoria'}`;foot.textContent=`Sort: ${c[1]}`;if(!f.length){grid.innerHTML=empties(minSlots);detailItem(null)}else{grid.innerHTML=f.map(i=>{let cc=cat(i.tipo);return`<article class="slot" data-id="${i.id}" tabindex="0" style="--c:${cc[3]}"><button class="remove" data-rm="${i.id}" type="button">x</button><div class="slotIcon">${icon(i,'58px')}</div><strong class="slotName">${esc(i.nome)}</strong><span class="qtd">x${esc(i.quantidade)}</span></article>`}).join('')+empties(minSlots-f.length);grid.querySelectorAll('.slot').forEach(s=>{let i=f.find(x=>String(x.id)==s.dataset.id);s.onmouseenter=s.onfocus=s.onclick=e=>{if(!e.target.closest('[data-rm]'))detailItem(i)}});grid.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(Number(b.dataset.rm))})}}function renderHist(){let b=personagem?JSON.parse(localStorage.getItem(`personagem_backup_${personagem.nome}`)||'{}'):{};let h=(b.historico||[]).filter(x=>x.tipo=='inventario').reverse();history.innerHTML=h.length?h.slice(0,8).map(x=>`<div class="hist"><strong>${esc(x.quando)}</strong><span>Autor: ${esc(x.autor||'sistema')}</span></div>`).join(''):'<div class="hist">Nenhuma alteração de inventário registrada.</div>'}function addItem(e){e.preventDefault();if(!personagem)return;let nome=iname.value.trim();if(!nome){iname.focus();return}let a=inv(),before=JSON.parse(JSON.stringify(a)),c=cat(itype.value),item={id:Date.now(),nome,tipo:itype.value,sprite:c[2],quantidade:Math.max(1,parseInt(iqtd.value,10)||1),descricao:idesc.value.trim(),adicionadoEm:new Date().toLocaleString('pt-BR')};a.push(item);save(a);hist(before,a);form.reset();iqtd.value='1';itype.value='alimentacao';render();renderHist();detailItem(item)}function remove(id){if(!personagem||!confirm('Remover este item do inventário?'))return;let a=inv(),before=JSON.parse(JSON.stringify(a)),n=a.filter(i=>Number(i.id)!=Number(id));save(n);hist(before,n);render();renderHist()}function init(){itype.innerHTML=catsData.filter(c=>c[0]!='todos').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');if(!personagem){pstatus.textContent='Nenhum personagem ativo';pname.textContent='Sem personagem'}else{pstatus.textContent=`${personagem.classe||'Classe'} / ${personagem.profissao||'Especialidade'}`;pname.textContent=personagem.nome||'Personagem';if(personagem.imagemPersonagem){pimg.src=personagem.imagemPersonagem;fig.classList.add('has')}}}toggleAdd.onclick=()=>{add.classList.toggle('on');if(add.classList.contains('on'))iname.focus()};toggleHist.onclick=()=>{history.classList.toggle('on');renderHist()};foldBtn.onclick=()=>{closed=!closed;fold.classList.toggle('closed',closed);foldBtn.setAttribute('aria-expanded',closed?'false':'true')};clear.onclick=()=>{form.reset();iqtd.value='1';itype.value='alimentacao';iname.focus()};form.onsubmit=addItem;init();render();renderHist()</script></body></html>
