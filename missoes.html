        html,

            background: #040c0d;
        }

        body.pagina-formulario {

            overflow-x: hidden;
            overflow-y: auto;

        .missoes-app {
            position: relative;
            z-index: 2;
            display: grid;
            gap: 18px;
            width: min(1180px, calc(100% - 28px));
            margin: 0 auto;
            padding: clamp(18px, 4vw, 42px) 0;
        }

        .missoes-topo,
        .missoes-painel,
        .missao-card,
        .modal-conteudo {
            border: 1px solid rgba(247, 200, 75, 0.28);
            border-radius: 8px;
            background:

            box-shadow: 0 22px 54px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 247, 223, 0.05);
        }

        .missoes-topo {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;
            align-items: center;
            padding: clamp(16px, 3vw, 26px);
        }

            color: #ffe28a;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            font-size: clamp(2.2rem, 6vw, 4.4rem);

            text-transform: uppercase;
            text-shadow: 0 5px 0 #2a0d08, 0 14px 28px rgba(0, 0, 0, 0.68);
        }

        .missoes-topo p {
            max-width: 760px;
            color: #d9e8d4;
            line-height: 1.5;
        }

        .missoes-status {
            display: grid;
            gap: 8px;
            min-width: min(100%, 260px);
            padding: 14px;
            border: 1px solid rgba(247, 200, 75, 0.24);
            border-radius: 8px;
            background: rgba(4, 12, 13, 0.58);

            justify-content: space-between;
            gap: 14px;
            color: #fff7df;
        }

        .missoes-status b {
            color: #ffe28a;
        }

        .missoes-painel {
            display: grid;
            gap: 14px;
            padding: clamp(14px, 3vw, 22px);
        }

        .abas-missoes,
        .ranks-missoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .rank-missao {
            min-height: 42px;
            padding: 0 14px;
            border: 1px solid rgba(247, 200, 75, 0.34);
            border-radius: 8px;
            background: rgba(255, 247, 223, 0.05);
            color: #fff7df;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .rank-missao.ativa,

        .rank-missao:hover {
            border-color: #ffe28a;
            background: rgba(247, 200, 75, 0.18);
            box-shadow: 0 0 18px rgba(247, 200, 75, 0.18);
        }

            display: grid;
            gap: 6px;
            padding: 12px 14px;
            border-left: 3px solid #f7c84b;
            background: rgba(4, 12, 13, 0.5);
            color: #d9e8d4;
        }

        .missoes-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .missao-card {
            display: grid;
            gap: 12px;
            padding: 16px;
            min-height: 290px;
        }

        .missao-card.concluida {
            border-color: rgba(120, 255, 160, 0.38);
            box-shadow: 0 0 22px rgba(70, 255, 125, 0.12), inset 0 1px 0 rgba(255, 247, 223, 0.05);
        }

        .missao-card.aceita {
            border-color: rgba(54, 224, 255, 0.42);
            box-shadow: 0 0 24px rgba(54, 224, 255, 0.13), inset 0 1px 0 rgba(255, 247, 223, 0.05);
        }

        .missao-card h2 {
            color: #fff7df;
            font-size: 1.25rem;
            line-height: 1.15;
        }

        .missao-card p {
            color: #d9e8d4;
            line-height: 1.45;
        }

        .missao-detalhes {
            display: grid;
            gap: 7px;
            margin-top: auto;
            color: #fff7df;
            font-size: 0.92rem;
        }

        .missao-detalhes strong {
            color: #ffe28a;
        }

        .missao-recompensas,
        .missao-acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .missao-recompensas span {
            padding: 6px 9px;
            border: 1px solid rgba(255, 226, 138, 0.22);
            border-radius: 999px;
            color: #d9e8d4;
            background: rgba(0, 0, 0, 0.28);
            font-size: 0.72rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .missao-recompensas b {
            color: #90ff00;
        }

        .missao-acoes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .missao-card button,
        .botao-voltar,
        .modal-acoes button {
            min-height: 42px;
            padding: 0 14px;
            border: 1px solid rgba(255, 226, 138, 0.52);
            border-radius: 8px;
            color: #1e211c;
            background: #f7c84b;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .missao-card button:hover,
        .botao-voltar:hover,
        .modal-acoes button:hover {
            background: #ffe28a;
        }

        .missao-card button:disabled {
            opacity: 0.56;
            cursor: not-allowed;
        }

        .missao-card button.secundario {
            color: #fff7df;
            background: rgba(4, 12, 13, 0.72);
        }

        .missao-card button.batalha {
            color: #fff7df;
            border-color: rgba(255, 92, 58, 0.55);
            background: linear-gradient(90deg, rgba(255, 65, 40, 0.78), rgba(247, 200, 75, 0.3));
        }

        .botao-voltar {
            display: inline-grid;
            place-items: center;
            color: #fff7df;
            text-decoration: none;
            background: rgba(4, 12, 13, 0.72);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.68);
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal-conteudo {
            display: grid;
            gap: 14px;
            width: min(620px, 100%);
            max-height: 88vh;
            overflow-y: auto;
            padding: 22px;
        }

        .modal-cabecalho {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
        }

        .modal-cabecalho h2 {
            color: #fff7df;
            font-size: 1.55rem;
        }

        .fechar-modal {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(247, 200, 75, 0.38);
            border-radius: 8px;
            color: #fff7df;
            background: rgba(4, 12, 13, 0.72);
            cursor: pointer;
        }

        .form-missao {
            display: grid;
            gap: 12px;
        }

        .campo-missao {
            display: grid;
            gap: 8px;
        }

        .campo-missao input {
            margin: 0;
        }

        .preview-print {
            display: none;
            max-height: 220px;
            width: 100%;
            object-fit: contain;
            border: 1px solid rgba(247, 200, 75, 0.24);
            border-radius: 8px;
            background: rgba(4, 12, 13, 0.58);
        }

        .preview-print.visivel {
            display: block;
        }

        .mensagem-status {
            min-height: 22px;
        }

        @media (max-width: 920px) {
            .missoes-topo {
                grid-template-columns: 1fr;
            }

            .missoes-grid {
                grid-template-columns: 1fr;
            }

            .missao-acoes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="pagina-formulario">
    <audio id="musica-fundo" loop preload="auto">
        <source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg">

    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true">

    <main class="missoes-app">
        <header class="missoes-topo">
            <div>

                <p id="texto-org">Carregando missões da organização...</p>
            </div>

            <aside class="missoes-status">
                <span>Personagem <b id="status-nome">---</b></span>
                <span>Organização <b id="status-org">---</b></span>
                <span>Aceitas <b id="status-aceitas">0</b></span>
                <span>Concluídas <b id="status-total">0</b></span>
            </aside>
        </header>

        <section class="missoes-painel">
            <div class="abas-missoes" id="abas-periodo"></div>
            <div class="ranks-missoes" id="abas-rank"></div>
            <div class="missoes-resumo">
                <strong id="resumo-titulo">Rank E</strong>
                <span id="resumo-prazo">As missões diárias mudam a cada 24 horas.</span>
            </div>
            <div class="missoes-grid" id="grade-missoes"></div>
        </section>

        <a class="botao-voltar" href="lobby.html">Voltar ao Lobby</a>
    </main>

    <div class="modal-overlay" id="modal-concluir">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <div>
                    <small class="missao-meta" id="modal-meta">Missão</small>
                    <h2 id="modal-titulo">Concluir missão</h2>
                </div>
                <button class="fechar-modal" id="fechar-modal" type="button">X</button>
            </div>

            <form class="form-missao" id="form-concluir">
                <div class="campo-missao">
                    <label for="missao-gmail">Gmail cadastrado</label>
                    <input id="missao-gmail" type="email" autocomplete="email" required>
                </div>

                <div class="campo-missao">
                    <label for="missao-senha">Senha do jogador</label>
                    <input id="missao-senha" type="password" autocomplete="current-password" required>
                </div>

                <div class="campo-missao">
                    <label for="missao-print">Print de comprovação</label>
                    <input id="missao-print" type="file" accept="image/*" required>
                    <img class="preview-print" id="preview-print" alt="Prévia do print">
                </div>

                <p class="mensagem-status" id="status-envio" aria-live="polite"></p>

                <div class="modal-acoes">
                    <button id="botao-enviar-conclusao" type="submit">Enviar conclusão</button>
                </div>
            </form>
        </div>
    </div>

        function montarObjetivosDePeriodo(periodo, rank) {
            if (periodo === "semanais") {
                return (campanhasSemanaisPorRank[rank] || campanhasSemanaisPorRank.E).map((nome) => ({
                    nome,
                    texto: `cumprir etapas da campanha ${nome.toLowerCase()} durante a semana`
                }));
            }

            if (periodo === "mensais") {
                return (arcosMensaisPorRank[rank] || arcosMensaisPorRank.E).map((nome) => ({
                    nome,
                    texto: `avançar o arco ${nome.toLowerCase()} até gerar resultado oficial para a organização`
                }));
            }

            return objetivosPorRank[rank] || objetivosPorRank.E;
        }

        function escaparHtml(texto) {
            return String(texto || "").replace(/[&<>"']/g, (caractere) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[caractere]));
        }

        function normalizar(texto) {
            return String(texto || "")
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function organizacaoPersonagem(personagem) {
            return personagem?.organizacao || personagem?.organização || personagem?.organization || "Piratas";
        }

        function hashTexto(texto) {
            let hash = 0;
            for (let i = 0; i < texto.length; i += 1) {
                hash = ((hash << 5) - hash) + texto.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function inicioSemana(data) {
            const base = new Date(data);
            const dia = base.getDay() || 7;
            base.setHours(0, 0, 0, 0);
            base.setDate(base.getDate() - dia + 1);
            return base;
        }

        function chavePeriodo(periodo) {
            const agora = new Date();
            if (periodo === "semanais") {
                const semana = inicioSemana(agora);
                return `${semana.getFullYear()}-${String(semana.getMonth() + 1).padStart(2, "0")}-${String(semana.getDate()).padStart(2, "0")}`;
            }
            if (periodo === "mensais") {
                return `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, "0")}`;
            }
            return `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, "0")}-${String(agora.getDate()).padStart(2, "0")}`;
        }

        function proximaVirada(periodo) {
            const agora = new Date();
            const proxima = new Date(agora);
            if (periodo === "semanais") {
                const semana = inicioSemana(agora);
                proxima.setTime(semana.getTime());
                proxima.setDate(proxima.getDate() + 7);
            } else if (periodo === "mensais") {
                proxima.setFullYear(agora.getFullYear(), agora.getMonth() + 1, 1);
                proxima.setHours(0, 0, 0, 0);
            } else {
                proxima.setDate(agora.getDate() + 1);
                proxima.setHours(0, 0, 0, 0);
            }
            return proxima;
        }

        function textoPrazo(periodo) {
            const proxima = proximaVirada(periodo);
            const horas = Math.max(1, Math.ceil((proxima.getTime() - Date.now()) / 3600000));
            if (periodo === "semanais") return `Missões semanais renovam em aproximadamente ${horas} hora(s).`;
            if (periodo === "mensais") return `Missões mensais renovam em aproximadamente ${horas} hora(s).`;
            return `Missões diárias renovam em aproximadamente ${horas} hora(s).`;
        }

        function gerarMissoes(periodo, rank, org) {
            const temas = temasPorOrg[org] || temasPorOrg.Piratas;
            const acoes = acoesPorRank[rank] || acoesPorRank.E;
            const codinomes = codinomesPorRank[rank] || codinomesPorRank.E;
            const focos = focoPorPeriodo[periodo] || focoPorPeriodo.diarias;
            const objetivos = montarObjetivosDePeriodo(periodo, rank);
            const quantidade = periodo === "diarias" ? 8 : periodo === "semanais" ? 6 : 5;
            const chave = chavePeriodo(periodo);
            const rotuloPeriodo = periodos.find((item) => item.chave === periodo)?.nome || "Missões";

            return Array.from({ length: quantidade }, (_, indice) => {
                const semente = hashTexto(`${org}-${periodo}-${rank}-${chave}-${indice}`);
                const tema = temas[(semente + ranks.indexOf(rank) + indice) % temas.length];
                const acao = acoes[indice % acoes.length];
                const codinome = codinomes[(indice + ranks.indexOf(rank)) % codinomes.length];
                const foco = focos[(semente + ranks.indexOf(rank)) % focos.length];
                const objetivo = objetivos[indice % objetivos.length];
                const local = ["East Blue", "Grand Line", "Novo Mundo", "Red Line", "ilha aliada", "rota desconhecida"][semente % 6];
                const intensidade = ["baixa", "moderada", "alta", "crítica", "extrema"][Math.min(ranks.indexOf(rank), 4)];
                return {
                    id: `${periodo}:${chave}:${normalizar(org)}:${rank}:${indice}`,
                    titulo: `${acao}: ${objetivo.nome}`,
                    periodo,
                    rank,
                    org,
                    local,
                    intensidade,
                    descricao: `${foco} ${codinome}. ${briefingPorRank[rank]} Objetivo: ${objetivo.texto} durante uma operação de ${tema} em ${local}.`,
                    recompensa: recompensaPorRank[rank],
                    prazoTexto: proximaVirada(periodo).toLocaleString("pt-BR")
                };
            });
        }

        function conclusoes() {
            return Array.isArray(personagemAtual?.missoesConcluidas) ? personagemAtual.missoesConcluidas : [];
        }

        function missaoConcluida(id) {
            return conclusoes().some((item) => item.id === id);
        }

        function chaveAceitas() {
            const nome = window.RpgSistemas?.normalizar ? RpgSistemas.normalizar(personagemAtual?.nome || "") : normalizar(personagemAtual?.nome || "");
            return `rpg_missoes_aceitas_${nome}`;
        }

        function missoesAceitas() {
            try {
                const lista = JSON.parse(localStorage.getItem(chaveAceitas()) || "[]");
                return Array.isArray(lista) ? lista : [];
            } catch {
                return [];
            }
        }

        function salvarAceitas(lista) {
            localStorage.setItem(chaveAceitas(), JSON.stringify(lista));
        }

        function missaoAceita(id) {
            return missoesAceitas().some((item) => item.id === id);
        }

        function aceitarMissao(missao) {
            if (!missao || missaoConcluida(missao.id)) return;
            const aceitas = missoesAceitas();
            if (!aceitas.some((item) => item.id === missao.id)) {
                aceitas.unshift({
                    id: missao.id,
                    titulo: missao.titulo,
                    rank: missao.rank,
                    periodo: missao.periodo,
                    organizacao: missao.org,
                    aceitaEm: new Date().toLocaleString("pt-BR")
                });
                salvarAceitas(aceitas.slice(0, 60));
            }
            RpgFeedback?.aviso?.("Missão aceita", [missao.titulo, "Batalha liberada no quadro."]);
            renderizar();
        }

        function abrirBatalha(missao) {
            if (!missao) return;
            localStorage.setItem("rpg_missao_batalha_atual", JSON.stringify(missao));
            window.location.href = `batalha.html?rank=${encodeURIComponent(missao.rank)}&missao=${encodeURIComponent(missao.id)}`;
        }

        function renderizarAbas() {
            abasPeriodo.innerHTML = periodos.map((periodo) => `
                <button class="aba-missao ${periodoAtual === periodo.chave ? "ativa" : ""}" type="button" data-periodo="${periodo.chave}" aria-pressed="${periodoAtual === periodo.chave ? "true" : "false"}">
                    ${periodo.nome}
                </button>
            `).join("");

            abasRank.innerHTML = ranks.map((rank) => `
                <button class="rank-missao ${rankAtual === rank ? "ativa" : ""}" type="button" data-rank="${rank}" aria-pressed="${rankAtual === rank ? "true" : "false"}">
                    Rank ${rank}
                </button>
            `).join("");

            abasPeriodo.querySelectorAll("[data-periodo]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    if (periodoAtual === botao.dataset.periodo) return;
                    missaoSelecionada = null;
                    fecharConclusao();
                    periodoAtual = botao.dataset.periodo;
                    renderizar();
                });
            });

            abasRank.querySelectorAll("[data-rank]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    if (rankAtual === botao.dataset.rank) return;
                    missaoSelecionada = null;
                    fecharConclusao();
                    rankAtual = botao.dataset.rank;
                    renderizar();
                });
            });
        }

        function renderizar() {
            const org = organizacaoPersonagem(personagemAtual);
            const missoes = gerarMissoes(periodoAtual, rankAtual, org);
            const concluidas = conclusoes();
            const aceitas = missoesAceitas();

            statusNome.textContent = personagemAtual?.nome || "---";
            statusOrg.textContent = org;
            statusAceitas.textContent = aceitas.length;
            statusTotal.textContent = concluidas.length;
            textoOrg.textContent = `Operações disponíveis para ${org}. As listas mudam conforme o prazo de cada aba.`;
            resumoTitulo.textContent = `${periodos.find((item) => item.chave === periodoAtual).nome} - Rank ${rankAtual}`;
            resumoPrazo.textContent = textoPrazo(periodoAtual);
            renderizarAbas();

            gradeMissoes.innerHTML = missoes.map((missao) => {
                const feita = missaoConcluida(missao.id);
                const aceita = missaoAceita(missao.id);
                const recompensa = RpgSistemas.recompensasAtividade("missao", missao.rank, missao.periodo);
                return `
                    <article class="missao-card ${feita ? "concluida" : aceita ? "aceita" : ""}">
                        <span class="missao-meta">${escaparHtml(missao.org)} / Rank ${escaparHtml(missao.rank)}</span>
                        <h2>${escaparHtml(missao.titulo)}</h2>
                        <p>${escaparHtml(missao.descricao)}</p>
                        <div class="missao-detalhes">
                            <span><strong>Intensidade:</strong> ${escaparHtml(missao.intensidade)}</span>
                            <span><strong>Recompensa:</strong> ${escaparHtml(missao.recompensa)}</span>
                            <span><strong>Renova em:</strong> ${escaparHtml(missao.prazoTexto)}</span>
                        </div>
                        <div class="missao-recompensas">
                            <span><b>+${recompensa.exp}</b> EXP</span>
                            <span><b>+${recompensa.berris}</b> Berris</span>
                            <span><b>+${recompensa.pontosAtributo}</b> Ponto</span>
                        </div>
                        <div class="missao-acoes">
                            ${feita ? `<button type="button" disabled>Concluída</button>` : aceita ? `
                                <button class="batalha" type="button" data-batalha="${escaparHtml(missao.id)}">Batalhar</button>
                                <button type="button" data-missao="${escaparHtml(missao.id)}">Concluir</button>
                            ` : `
                                <button class="secundario" type="button" data-aceitar="${escaparHtml(missao.id)}">Aceitar</button>
                                <button type="button" data-missao="${escaparHtml(missao.id)}">Concluir direto</button>
                            `}
                        </div>
                    </article>
                `;
            }).join("");

            gradeMissoes.querySelectorAll("[data-aceitar]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    const missao = missoes.find((item) => item.id === botao.dataset.aceitar);
                    aceitarMissao(missao);
                });
            });

            gradeMissoes.querySelectorAll("[data-batalha]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    const missao = missoes.find((item) => item.id === botao.dataset.batalha);
                    abrirBatalha(missao);
                });
            });

            gradeMissoes.querySelectorAll("[data-missao]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    const missao = missoes.find((item) => item.id === botao.dataset.missao);
                    abrirConclusao(missao);
                });
            });
        }

        function abrirConclusao(missao) {
            missaoSelecionada = missao;
            printBase64 = "";
            document.getElementById("modal-meta").textContent = `${missao.org} / Rank ${missao.rank}`;
            document.getElementById("modal-titulo").textContent = missao.titulo;
            inputGmail.value = personagemAtual.gmail || "";
            inputSenha.value = "";
            inputPrint.value = "";
            previewPrint.removeAttribute("src");
            previewPrint.classList.remove("visivel");
            statusEnvio.textContent = "Anexe o print e confirme com Gmail e senha do personagem.";
            modal.classList.add("ativo");
        }

        function fecharConclusao() {
            modal.classList.remove("ativo");
        }

        function lerPrint(arquivo) {
            return new Promise((resolve, reject) => {
                if (!arquivo || !arquivo.type.startsWith("image/")) {
                    reject(new Error("Anexe uma imagem válida."));
                    return;
                }

                const leitor = new FileReader();
                leitor.onerror = () => reject(new Error("Não foi possível ler o print."));
                leitor.onload = () => {
                    const imagem = new Image();
                    imagem.onerror = () => reject(new Error("Não foi possível carregar o print."));
                    imagem.onload = () => {
                        const limite = 1100;
                        const escala = Math.min(1, limite / Math.max(imagem.width, imagem.height));
                        const largura = Math.max(1, Math.round(imagem.width * escala));
                        const altura = Math.max(1, Math.round(imagem.height * escala));
                        const canvas = document.createElement("canvas");
                        canvas.width = largura;
                        canvas.height = altura;
                        canvas.getContext("2d").drawImage(imagem, 0, 0, largura, altura);
                        resolve(canvas.toDataURL("image/jpeg", 0.82));
                    };
                    imagem.src = leitor.result;
                };
                leitor.readAsDataURL(arquivo);
            });
        }

        async function enviarConclusao(evento) {
            evento.preventDefault();

            if (!missaoSelecionada) return;
            if (missaoConcluida(missaoSelecionada.id)) {
                statusEnvio.textContent = "Esta missão já foi contabilizada.";
                return;
            }

            const gmail = normalizar(inputGmail.value);
            const senha = inputSenha.value;

            if (gmail !== normalizar(personagemAtual.gmail)) {
                statusEnvio.textContent = "Gmail diferente do personagem logado.";
                inputGmail.focus();
                return;
            }

            if (String(personagemAtual.senha || "") !== senha) {
                statusEnvio.textContent = "Senha inválida.";
                inputSenha.focus();
                return;
            }

            if (!printBase64) {
                statusEnvio.textContent = "Anexe o print da conclusão.";
                inputPrint.focus();
                return;
            }

            botaoEnviar.disabled = true;
            statusEnvio.textContent = "Salvando conclusão no personagem...";

            personagemAtual.missoesConcluidas = [
                ...conclusoes(),
                {
                    id: missaoSelecionada.id,
                    titulo: missaoSelecionada.titulo,
                    organizacao: missaoSelecionada.org,
                    rank: missaoSelecionada.rank,
                    periodo: missaoSelecionada.periodo,
                    print: printBase64,
                    gmail: personagemAtual.gmail,
                    concluidaEm: new Date().toISOString(),
                    concluidaEmTexto: new Date().toLocaleString("pt-BR")
                }
            ];

            try {
                const resultado = await RpgSistemas.concluirAtividade(personagemAtual, {
                    tipo: "missao",
                    titulo: missaoSelecionada.titulo,
                    rank: missaoSelecionada.rank,
                    periodo: missaoSelecionada.periodo
                });
                await BancoPersonagens.salvarPersonagem(personagemAtual);
                localStorage.setItem("ultimoPersonagem", JSON.stringify(personagemAtual));
                statusEnvio.textContent = `Missão concluída: +${resultado.recompensas.exp} EXP, +${resultado.recompensas.berris} berris e +${resultado.recompensas.pontosAtributo} ponto(s).`;
                fecharConclusao();
                renderizar();
            } catch (erro) {
                statusEnvio.textContent = "Não foi possível salvar no banco. Tente novamente.";
                console.warn("Erro ao salvar missão:", erro);
            } finally {
                botaoEnviar.disabled = false;
            }
        }

        async function carregarPersonagem() {
            const local = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
            if (!local?.nome) {
                window.location.href = "index.html";
                return;
            }

            personagemAtual = local;

            try {
                const remoto = await BancoPersonagens.buscarPorNome(local.nome);
                if (remoto) {
                    personagemAtual = remoto;
                    localStorage.setItem("ultimoPersonagem", JSON.stringify(remoto));
                }
            } catch (erro) {
                console.warn("Usando personagem local para missões:", erro);
            }

            const orgUrl = new URLSearchParams(window.location.search).get("org");
            if (orgUrl && normalizar(orgUrl) !== normalizar(organizacaoPersonagem(personagemAtual))) {
                history.replaceState(null, "", `missoes.html?org=${encodeURIComponent(organizacaoPersonagem(personagemAtual))}`);
            }

            renderizar();
        }

        inputPrint.addEventListener("change", async () => {
            const arquivo = inputPrint.files?.[0];
            if (!arquivo) return;
            try {
                statusEnvio.textContent = "Preparando print...";
                printBase64 = await lerPrint(arquivo);
                previewPrint.src = printBase64;
                previewPrint.classList.add("visivel");
                statusEnvio.textContent = "Print anexado. Agora confirme a conclusão.";
            } catch (erro) {
                printBase64 = "";
                previewPrint.removeAttribute("src");
                previewPrint.classList.remove("visivel");
                statusEnvio.textContent = erro.message || "Print inválido.";
            }
        });

        document.getElementById("fechar-modal").addEventListener("click", fecharConclusao);
        modal.addEventListener("click", (evento) => {
            if (evento.target === modal) fecharConclusao();
        });
        formConcluir.addEventListener("submit", enviarConclusao);

        carregarPersonagem();
    </script>
</body>
