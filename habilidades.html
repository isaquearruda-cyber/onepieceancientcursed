<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Árvore de Habilidades</title><link rel="stylesheet" href="estilo.css"><style>html,body{margin:0;min-height:100%;background:#030708;color:#fff7df}body{overflow:hidden}.video-fundo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.42) saturate(1.2)}.app{position:relative;z-index:1;min-height:100vh;padding:clamp(14px,2vw,26px);display:grid;grid-template-rows:auto 1fr;gap:14px;background:radial-gradient(circle at 50% 45%,rgba(54,224,255,.16),transparent 28%),radial-gradient(circle at 80% 50%,rgba(255,69,60,.12),transparent 28%)}header,.board,.panel,.branch{border:1px solid rgba(247,200,75,.24);border-radius:8px;background:linear-gradient(180deg,rgba(5,12,14,.88),rgba(1,4,6,.94));box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,247,223,.06);backdrop-filter:blur(8px)}header{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 18px}small,.meta{color:#ffe28a;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{margin:2px 0 5px;font:900 clamp(1.8rem,4vw,3.35rem)/.94 Arial Black,Impact,sans-serif;text-transform:uppercase;text-shadow:0 5px 0 #210b08,0 14px 28px #000}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:end}.chip,.back,.panel button{min-height:42px;padding:0 14px;border:1px solid rgba(255,226,138,.52);border-radius:8px;color:#fff7df;background:rgba(4,12,13,.72);font-weight:900;text-transform:uppercase;text-decoration:none;display:grid;place-items:center}.chip{color:#ffe28a}.layout{display:grid;grid-template-columns:minmax(0,1fr)350px;gap:14px;min-height:0}.board{position:relative;min-height:calc(100vh - 154px);overflow:hidden}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.line{fill:none;stroke:rgba(255,247,223,.12);stroke-width:4;stroke-linecap:round}.line.open{stroke:var(--c);filter:drop-shadow(0 0 8px var(--c))}.line.ready{stroke:var(--c);stroke-dasharray:12 10;animation:dash 1.1s linear infinite;filter:drop-shadow(0 0 12px var(--c))}@keyframes dash{to{stroke-dashoffset:-44}}.core{position:absolute;left:50%;top:50%;z-index:3;width:136px;height:136px;border:2px solid var(--c);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 34%,transparent),rgba(3,8,10,.9) 64%);transform:translate(-50%,-50%);box-shadow:0 0 42px color-mix(in srgb,var(--c) 42%,transparent);cursor:pointer}.core img{width:92px;height:92px;border-radius:50%}.branch{--c:#36e0ff;position:absolute;z-index:2;width:min(31.5%,355px);min-width:255px;padding:10px;border-color:color-mix(in srgb,var(--c) 38%,transparent)}.b0{left:2.2%;top:5%}.b1{left:34%;top:2.8%}.b2{right:2.2%;top:5%}.b3{right:2.2%;bottom:5%}.b4{left:34%;bottom:2.8%}.b5{left:2.2%;bottom:5%}.bh{display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;margin-bottom:10px}.bh img{width:46px;height:46px;border-radius:8px;box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}.bh h2{margin:0;font-size:1rem}.bh p{margin:3px 0 0;color:#d9e8d4;font-size:.72rem}.count{color:var(--c);font-weight:900}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.node{--n:#36e0ff;position:relative;aspect-ratio:1;border:1px solid rgba(255,247,223,.16);border-radius:8px;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(2,5,6,.94) 65%);display:grid;place-items:center;padding:5px;cursor:pointer}.node img{width:100%;height:100%;border-radius:7px;filter:grayscale(1);opacity:.46}.node:after{content:attr(data-lv);position:absolute;right:3px;bottom:2px;font-size:.58rem;font-weight:900}.node.open{border-color:var(--n);box-shadow:0 0 20px color-mix(in srgb,var(--n) 45%,transparent)}.node.open img{filter:none;opacity:1}.node.ready{border-color:#ffe28a;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,226,138,.55)}}.panel{display:grid;gap:14px;align-content:start;padding:18px;overflow:auto;max-height:calc(100vh - 154px)}.panel img{width:132px;height:132px;border-radius:8px;box-shadow:0 0 28px var(--dc,#36e0ff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats span{padding:10px;border:1px solid rgba(247,200,75,.22);border-radius:8px;background:rgba(4,12,13,.58);color:#d9e8d4}.stats b{display:block;color:#ffe28a}.panel button{color:#1e211c;background:#f7c84b;cursor:pointer}.panel button:disabled{opacity:.48;cursor:not-allowed}@media(max-width:1180px){body{overflow:auto}.layout{grid-template-columns:1fr}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;min-height:auto}.lines,.core{display:none}.branch{position:relative;inset:auto;width:auto;min-width:0}.panel{max-height:none}}@media(max-width:720px){header{grid-template-columns:1fr}.actions{justify-content:stretch}.chip,.back{width:100%}.board{grid-template-columns:1fr}}</style></head><body><video class="video-fundo" autoplay muted loop playsinline><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header><div><small id="style">Estilo de luta</small><h1>Árvore de Habilidades</h1><p id="who">Carregando...</p></div><div class="actions"><span class="chip" id="xp">0 EXP livre</span><a class="back" href="lobby.html">Voltar ao Lobby</a></div></header><section class="layout"><section class="board" id="board"></section><aside class="panel" id="panel"></aside></section></main><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null'),board=document.getElementById('board'),panel=document.getElementById('panel');let active=null;const branches=[['vitalidade','Vitalidade','#31e860','Força Vital','vida máxima e recuperação'],['impacto','Impacto','#ff453c','Força','dano direto e dano de arma'],['agilidade','Agilidade','#49d8ff','Agilidade','velocidade, esquiva e combo'],['resistencia','Resistência','#6d8cff','Resistência','defesa, bloqueio e redução'],['mente','Controle','#9b6cff','Força Mental','precisão, técnica e custo'],['vontade','Determinação','#ff9b2f','Determinação','crítico, haki e pressão']];function profile(s){const t=RpgSistemas.normalizar(s);if(/itoryuu|nitoryuu|santoryuu|sword|fencing|espada/.test(t))return{cls:'Espadachim',arma:'lâminas',dano:'corte',f:['impacto','agilidade','vontade'],sym:'blade',cor:'#ff453c'};if(/black leg|karate|rokushiki|punho|punch|perna/.test(t))return{cls:'Corpo a corpo',arma:'punhos e chutes',dano:'impacto',f:['impacto','resistencia','agilidade'],sym:'fist',cor:'#ff9b2f'};if(/pistola|rifle|atirador|gun|sniper/.test(t))return{cls:'Atirador',arma:'armas de fogo',dano:'perfuração',f:['mente','agilidade','impacto'],sym:'target',cor:'#49d8ff'};return{cls:'Estilo livre',arma:'arma equipada',dano:'híbrido',f:['mente','vontade','impacto'],sym:'aura',cor:'#ffe28a'}}function fmt(v){return Number(v||0).toLocaleString('pt-BR')}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emblem(c,type,txt){const m={blade:'<path d="M55 9 43 53 24 74l-6-6 21-19L83 37l4 4-22 10-10 36-9-9 7-25-22 22-7-7 22-22-25 7-9-9 36-10Z"/>',fist:'<path d="M29 39V23a8 8 0 0 1 15 0v12h2V18a8 8 0 0 1 15 0v17h2V24a8 8 0 0 1 15 0v27c0 24-16 35-33 35-15 0-27-10-27-27V45a7 7 0 0 1 11-6Z"/>',target:'<path d="M48 9a39 39 0 1 0 0 78 39 39 0 0 0 0-78Zm0 13a26 26 0 1 1 0 52 26 26 0 0 1 0-52Zm0 14a12 12 0 1 0 0 24 12 12 0 0 0 0-24Z"/>',aura:'<path d="M48 8c15 14 22 27 22 41 0 21-14 35-22 39-8-4-22-18-22-39 0-14 7-27 22-41Zm0 22c-6 8-9 14-9 22 0 9 5 16 9 19 4-3 9-10 9-19 0-8-3-14-9-22Z"/>',shield:'<path d="M48 8 78 20v24c0 19-12 34-30 44-18-10-30-25-30-44V20L48 8Zm0 15-16 7v15c0 10 5 19 16 27 11-8 16-17 16-27V30l-16-7Z"/>',wing:'<path d="M16 55c20-32 43-39 64-33-7 9-15 15-26 19 11 1 19 0 29-5-11 22-30 36-59 34 10-5 17-10 23-18-9 5-19 7-31 3Z"/>'}[type]||'<circle cx="48" cy="48" r="30"/>';const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g"><stop stop-color="#fff7df"/><stop offset=".42" stop-color="${c}"/><stop offset="1" stop-color="#05090b"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="${c}"/></filter></defs><rect width="96" height="96" rx="12" fill="#05090b"/><circle cx="48" cy="48" r="39" fill="none" stroke="${c}" stroke-width="3" opacity=".8"/><g fill="url(#g)" filter="url(#s)">${m}</g><text x="48" y="88" text-anchor="middle" fill="#fff7df" font-size="9" font-family="Arial" font-weight="800">${txt.slice(0,3).toUpperCase()}</text></svg>`;return`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`}function bonus(r,i,p){const v=Math.min(35,Math.floor(i/5)+1+Math.floor(i/8));if(r[0]=='impacto')return`+${v}% dano de ${p.arma} e +${Math.ceil(v/2)}% dano ${p.dano}.`;if(r[0]=='agilidade')return`+${v}% velocidade e +${Math.ceil(v/2)}% esquiva.`;if(r[0]=='resistencia')return`+${v}% bloqueio e +${Math.ceil(v/2)}% redução de dano.`;if(r[0]=='vitalidade')return`+${v}% vida máxima e recuperação.`;if(r[0]=='mente')return`+${v}% precisão e -${Math.ceil(v/3)}% custo.`;return`+${v}% crítico e +${Math.ceil(v/2)}% pressão de haki.`}function tree(style){const p=profile(style),arr=[{id:'0',ramo:-1,nome:`${style}: Fundamento Inicial`,descricao:'Base do estilo. Já vem desbloqueada e acende os caminhos.',bonus:`Libera os ramos de ${p.cls}.`,custo:0,requer:null,cor:p.cor,img:emblem(p.cor,p.sym,'Core'),atr:p.cls}];branches.forEach((r,b)=>{for(let i=0;i<50;i++){let id=String(1+b*50+i),f=p.f.includes(r[0]);arr.push({id,ramo:b,idx:i,nome:i?`${r[1]} ${i+1}`:`${r[1]}: Entrada`,descricao:`Fortalece ${r[3]} no estilo ${style}.`,bonus:i?bonus(r,i,p):`Abre a trilha ${r[1]}.`,custo:i?140+i*42+(Math.floor(i/5)+1)*90+(f?45:0):0,requer:i?String(Number(id)-1):'0',cor:r[2],img:emblem(r[2],i%3==0?p.sym:i%3==1?'shield':'wing',r[1]),atr:r[3]})}});return arr}function state(h,open){return open.includes(String(h.id))?'open':(!h.requer||open.includes(String(h.requer)))?'ready':'locked'}function render(){if(!personagem?.nome){location.href='index.html';return}let styleName=personagem.estiloLuta||'Estilo livre',p=profile(styleName),prog=RpgSistemas.obterProgresso(personagem),open=(prog.habilidades||['0']).map(String);if(!open.includes('0'))open.push('0');let skills=tree(styleName);active=active||skills[0];style.textContent=`${p.cls} / ${styleName}`;who.textContent=`${personagem.nome} / Nv. ${prog.nivel} / arma base: ${p.arma}`;xp.textContent=`${fmt(prog.expDisponivel)} EXP livre`;let pts=[['18','24'],['43','17'],['78','24'],['78','76'],['43','83'],['18','76']];let lines=branches.map((r,i)=>{let h=skills.find(x=>x.ramo==i&&x.idx==0),s=state(h,open),pt=pts[i];return`<path class="line ${s=='open'?'open':s=='ready'?'ready':''}" style="--c:${r[2]}" d="M50 50 C50 50 ${pt[0]} ${pt[1]} ${pt[0]} ${pt[1]}"></path>`}).join('');let html=`<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg><button class="core" data-id="0" style="--c:${p.cor}"><img src="${emblem(p.cor,p.sym,'Core')}" alt=""></button>`;html+=branches.map((r,b)=>{let list=skills.filter(h=>h.ramo==b),done=list.filter(h=>open.includes(h.id)).length;return`<article class="branch b${b}" style="--c:${r[2]}"><header class="bh"><img src="${emblem(r[2],b%2?'shield':p.sym,r[1])}" alt=""><div><h2>${r[1]}</h2><p>${r[3]} / ${r[4]}</p></div><span class="count">${done}/50</span></header><div class="grid">${list.map(h=>{let s=state(h,open);return`<button class="node ${s}" data-id="${h.id}" data-lv="${h.idx+1}" style="--n:${h.cor}"><img src="${h.img}" alt=""></button>`}).join('')}</div></article>`}).join('');board.innerHTML=html;board.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=skills.find(h=>h.id==b.dataset.id)||active;render()});detail(active,prog,open)}function detail(h,prog,open){let s=state(h,open),can=s=='ready'&&prog.expDisponivel>=h.custo;panel.style.setProperty('--dc',h.cor);panel.innerHTML=`<span class="meta">${esc(h.atr)}</span><img src="${h.img}" alt=""><h2>${esc(h.nome)}</h2><p>${esc(h.descricao)}</p><div class="stats"><span><b>${s=='open'?'Aberta':s=='ready'?'Disponível':'Bloqueada'}</b>Estado</span><span><b>${fmt(h.custo)}</b>Custo EXP</span><span><b>${fmt(prog.expDisponivel)}</b>EXP livre</span><span><b>${h.ramo<0?'Core':h.ramo+1}</b>Ramo</span></div><p><b style="color:${h.cor}">Bônus:</b> ${esc(h.bonus)}</p><button id="unlock" ${can?'':'disabled'}>${s=='open'?'Habilidade dominada':'Desbloquear'}</button><p id="msg"></p>`;unlock.onclick=()=>{let r=RpgSistemas.salvarHabilidade(personagem,h);msg.textContent=r.mensagem||'Habilidade desbloqueada.';if(r.ok)render()}}render()</script></body></html>
