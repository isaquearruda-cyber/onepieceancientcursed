<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Árvore de Habilidades - One Piece RPG</title><link rel="stylesheet" href="estilo.css"><style>body.pagina-formulario{position:relative;min-height:100vh;padding:0;overflow:hidden;background:#040c0d;color:#fff7df}.app{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:clamp(14px,2.6vw,30px)}.topo,.shell,.detalhe{border:1px solid rgba(247,200,75,.28);border-radius:8px;background:linear-gradient(180deg,rgba(7,20,22,.9),rgba(3,8,10,.92));box-shadow:0 22px 54px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,247,223,.06)}.topo{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:16px 20px}small{color:#ffe28a;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:2px 0 6px;color:#fff7df;font-family:"Segoe UI Black","Arial Black",Impact,sans-serif;font-size:clamp(1.9rem,5vw,3.7rem);line-height:.95;text-transform:uppercase;text-shadow:0 5px 0 #2a0d08,0 14px 28px rgba(0,0,0,.68)}.voltar,.detalhe button{min-height:42px;padding:0 14px;border:1px solid rgba(255,226,138,.52);border-radius:8px;color:#fff7df;background:rgba(4,12,13,.72);font-weight:900;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}.shell{min-height:0;display:grid;grid-template-columns:1fr 330px;overflow:hidden}.wrap{position:relative;overflow:auto;background:radial-gradient(circle at 50% 50%,rgba(54,224,255,.08),transparent 38%),rgba(0,0,0,.22)}.arvore{position:relative;width:2350px;height:6800px}.linhas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.linha{stroke:rgba(255,247,223,.12);stroke-width:3}.linha.ativa{stroke:#36e0ff;filter:drop-shadow(0 0 8px #36e0ff)}.linha.disponivel{stroke:#ffe28a;stroke-dasharray:10 8;animation:brilho 1.2s linear infinite}@keyframes brilho{to{stroke-dashoffset:-36}}.node{position:absolute;width:104px;height:104px;transform:translate(-50%,-50%);border:1px solid rgba(255,247,223,.16);border-radius:8px;background:linear-gradient(180deg,rgba(9,20,22,.92),rgba(0,0,0,.86));color:#d9e8d4;cursor:pointer;display:grid;place-items:center;text-align:center;padding:8px;box-shadow:0 16px 28px rgba(0,0,0,.36)}.node img{width:46px;height:46px;border-radius:8px;object-fit:cover;filter:grayscale(1);opacity:.58}.node span{font-size:.68rem;font-weight:900}.node.desbloqueada{border-color:rgba(54,224,255,.72);color:#fff7df;box-shadow:0 0 22px rgba(54,224,255,.28),0 16px 28px rgba(0,0,0,.36)}.node.desbloqueada img{filter:none;opacity:1}.node.disponivel{border-color:#ffe28a;box-shadow:0 0 24px rgba(255,226,138,.34),0 16px 28px rgba(0,0,0,.36)}.detalhe{display:grid;align-content:start;gap:14px;padding:18px;overflow-y:auto}.detalhe img{width:116px;height:116px;border-radius:8px;object-fit:cover;box-shadow:0 0 22px rgba(54,224,255,.32)}.detalhe p{color:#d9e8d4;line-height:1.45}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status span{padding:10px;border:1px solid rgba(247,200,75,.24);border-radius:8px;background:rgba(4,12,13,.58);color:#d9e8d4}.status b{display:block;color:#ffe28a;font-size:1.15rem}.detalhe button{color:#1e211c;background:#f7c84b}.detalhe button:disabled{opacity:.48;cursor:not-allowed}@media(max-width:900px){body.pagina-formulario{overflow:auto}.app{height:auto}.shell{grid-template-columns:1fr}.detalhe{min-height:360px}}</style></head><body class="pagina-formulario"><audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio><video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header class="topo"><div><small id="estilo">Estilo de luta</small><h1>Árvore de Habilidades</h1><p id="personagemTxt">Carregando personagem...</p></div><a class="voltar" href="lobby.html">Voltar</a></header><section class="shell"><div class="wrap"><div class="arvore" id="arvore"></div></div><aside class="detalhe" id="detalhe"></aside></section></main><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null'),arvore=document.getElementById('arvore'),detalhe=document.getElementById('detalhe');let ativa=null;function fmt(v){return Number(v||0).toLocaleString('pt-BR')}function pos(h){return{x:160+h.coluna*360+(h.linha%2)*70,y:120+h.linha*132}}function render(){if(!personagem?.nome){location.href='index.html';return}const estiloNome=personagem.estiloLuta||'Estilo livre',prog=RpgSistemas.obterProgresso(personagem),hab=RpgSistemas.gerarHabilidades(estiloNome),des=prog.habilidades.map(String);ativa=ativa||hab[0];estilo.textContent=estiloNome;personagemTxt.textContent=`${personagem.nome} / Nv. ${prog.nivel} / ${fmt(prog.expDisponivel)} EXP livre`;const linhas=hab.slice(1).map(h=>{const a=pos(hab[Number(h.requer)]),b=pos(h),ok=des.includes(h.id),disp=!ok&&RpgSistemas.habilidadeDisponivel(h,des);return `<line class="linha ${ok?'ativa':disp?'disponivel':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`}).join('');arvore.innerHTML=`<svg class="linhas" viewBox="0 0 2350 6800" preserveAspectRatio="none">${linhas}</svg>${hab.map(h=>{const p=pos(h),ok=des.includes(h.id),disp=!ok&&RpgSistemas.habilidadeDisponivel(h,des);return `<button class="node ${ok?'desbloqueada':disp?'disponivel':''}" style="left:${p.x}px;top:${p.y}px" data-skill="${h.id}" type="button"><img src="assets/img/sistemas/sistema-4.webp" alt=""><span>${h.id==='0'?'Inicial':h.id}</span></button>`}).join('')}`;arvore.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{ativa=hab[Number(b.dataset.skill)];detalhar(hab,prog)});detalhar(hab,prog)}function detalhar(hab,prog){const h=ativa||hab[0],des=prog.habilidades.map(String),ok=des.includes(h.id),disp=!ok&&RpgSistemas.habilidadeDisponivel(h,des),pode=disp&&prog.expDisponivel>=h.custo;detalhe.innerHTML=`<img src="assets/img/sistemas/sistema-4.webp" alt=""><h2>${h.nome}</h2><p>${h.descricao}</p><div class="status"><span><b>${des.length}/300</b>abertas</span><span><b>${fmt(prog.expDisponivel)}</b>EXP livre</span><span><b>${fmt(h.custo)}</b>custo</span><span><b>${ok?'Aberta':disp?'Disponivel':'Bloqueada'}</b>estado</span></div><p><strong>Buff:</strong> ${h.buff}</p><button id="abrir" ${pode?'':'disabled'}>${ok?'Desbloqueada':'Desbloquear'}</button><p id="msg"></p>`;abrir.onclick=()=>{const r=RpgSistemas.salvarHabilidade(personagem,h);msg.textContent=r.mensagem||'Habilidade desbloqueada.';if(r.ok)render()}}render();</script></body></html>
