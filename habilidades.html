<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árvore de Habilidades - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game18">
    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #030708;
            color: #fff7df;
        }

        body {
            overflow: hidden;
        }

        .video-fundo {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.38) saturate(1.2);
        }

        .skill-app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            padding: clamp(14px, 2.2vw, 26px);
            background:
                radial-gradient(circle at 36% 46%, rgba(54, 224, 255, 0.16), transparent 28%),
                radial-gradient(circle at 63% 55%, rgba(255, 69, 60, 0.12), transparent 28%);
        }

        .skill-topo,
        .ramo-lista,
        .skill-stage,
        .skill-detalhe {
            border: 1px solid rgba(247, 200, 75, 0.24);
            border-radius: 8px;
            background:
                linear-gradient(180deg, rgba(5, 12, 14, 0.9), rgba(1, 4, 6, 0.95)),
                repeating-linear-gradient(0deg, rgba(255,255,255,.022), rgba(255,255,255,.022) 1px, transparent 1px, transparent 8px);
            box-shadow: 0 24px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,247,223,.06);
            backdrop-filter: blur(8px);
        }

        .skill-topo {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 14px 18px;
        }

        .skill-topo small,
        .detalhe-meta,
        .ramo-botao small {
            color: #ffe28a;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .skill-topo h1 {
            margin: 2px 0 5px;
            color: #fff7df;
            font-family: "Segoe UI Black", "Arial Black", Impact, sans-serif;
            font-size: clamp(1.8rem, 4.2vw, 3.35rem);
            line-height: .94;
            text-transform: uppercase;
            text-shadow: 0 5px 0 #210b08, 0 14px 28px rgba(0,0,0,.68);
        }

        .skill-topo p {
            margin: 0;
            color: #d9e8d4;
        }

        .skill-acoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: end;
            gap: 10px;
        }

        .skill-chip,
        .voltar-lobby,
        .skill-detalhe button {
            min-height: 42px;
            padding: 0 14px;
            border: 1px solid rgba(255,226,138,.52);
            border-radius: 8px;
            color: #fff7df;
            background: rgba(4,12,13,.72);
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-grid;
            place-items: center;
        }

        .skill-chip {
            color: #ffe28a;
            border-color: rgba(54, 224, 255, .44);
        }

        .skill-layout {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            grid-template-areas:
                "ramos ramos"
                "stage detalhe";
            gap: 14px;
        }

        .ramo-lista {
            grid-area: ramos;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-content: start;
            gap: 10px;
            padding: 14px;
            overflow: hidden;
        }

        .ramo-botao {
            --c: #36e0ff;
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 68px;
            padding: 9px;
            border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
            border-radius: 8px;
            color: #fff7df;
            background: linear-gradient(90deg, color-mix(in srgb, var(--c) 16%, transparent), rgba(3,8,10,.62));
            text-align: left;
            cursor: pointer;
        }

        .ramo-botao.ativo,
        .ramo-botao:hover {
            border-color: var(--c);
            box-shadow: 0 0 20px color-mix(in srgb, var(--c) 35%, transparent);
        }

        .ramo-botao img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent);
        }

        .ramo-botao strong,
        .ramo-botao span {
            display: block;
        }

        .ramo-botao span {
            margin-top: 3px;
            color: #d9e8d4;
            font-size: .76rem;
        }

        .ramo-botao b {
            color: var(--c);
        }

        .skill-stage {
            grid-area: stage;
            position: relative;
            min-height: 0;
            overflow: hidden;
            isolation: isolate;
        }

        .stage-bg {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(255,247,223,.055) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,247,223,.04) 1px, transparent 1px),
                radial-gradient(circle at 8% 50%, color-mix(in srgb, var(--ramo-cor, #36e0ff) 22%, transparent), transparent 20%),
                radial-gradient(circle at 74% 48%, rgba(255,247,223,.06), transparent 30%);
            background-size: 8.2% 100%, 100% 15%, auto, auto;
            pointer-events: none;
        }

        .stage-bg::before,
        .stage-bg::after {
            content: "";
            position: absolute;
            inset: 12% 4%;
            border: 1px solid color-mix(in srgb, var(--ramo-cor, #36e0ff) 30%, transparent);
            border-radius: 18px;
            box-shadow: inset 0 0 34px rgba(0,0,0,.36);
        }

        .stage-bg::after {
            inset: 19% 10% 18% 16%;
            border-style: dashed;
            opacity: .42;
        }

        .tree-tier {
            position: absolute;
            z-index: 1;
            top: 8px;
            transform: translateX(-50%);
            color: rgba(255,247,223,.46);
            font-size: .66rem;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .branch-band {
            position: absolute;
            z-index: 0;
            left: 14%;
            right: 4%;
            height: 13%;
            transform: translateY(-50%);
            border: 1px solid color-mix(in srgb, var(--ramo-cor, #36e0ff) 14%, transparent);
            border-radius: 999px;
            background:
                linear-gradient(90deg, color-mix(in srgb, var(--ramo-cor, #36e0ff) 9%, transparent), transparent 56%),
                radial-gradient(circle at 18% 50%, color-mix(in srgb, var(--ramo-cor, #36e0ff) 12%, transparent), transparent 60%);
            opacity: .46;
            pointer-events: none;
        }

        .branch-label {
            position: absolute;
            z-index: 2;
            left: 16%;
            transform: translateY(-50%);
            padding: 4px 10px;
            border: 1px solid color-mix(in srgb, var(--ramo-cor, #36e0ff) 36%, transparent);
            border-radius: 999px;
            background: rgba(3, 8, 10, .82);
            color: #fff7df;
            font-size: .67rem;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
            pointer-events: none;
        }

        .tree-lane {
            position: absolute;
            z-index: 1;
            left: 20%;
            right: 5%;
            height: 1px;
            border-top: 1px solid color-mix(in srgb, var(--ramo-cor, #36e0ff) 14%, transparent);
            opacity: .52;
            pointer-events: none;
        }

        .tree-svg {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .tree-line {
            fill: none;
            stroke: rgba(255,247,223,.09);
            stroke-width: 3.2;
            stroke-linecap: round;
        }

        .tree-line.aberta {
            stroke: var(--line-cor);
            filter: drop-shadow(0 0 4px var(--line-cor));
        }

        .tree-line.disponivel {
            stroke: #ffe28a;
            stroke-dasharray: 14 10;
            animation: trilha 1.15s linear infinite;
            filter: drop-shadow(0 0 7px #ffe28a);
        }

        .tree-line.realce {
            stroke: #fff7df;
            stroke-width: 4.6;
            filter: drop-shadow(0 0 12px var(--line-cor, #ffe28a));
        }

        @keyframes trilha {
            to { stroke-dashoffset: -48; }
        }

        .skill-node,
        .skill-core {
            --c: #36e0ff;
            position: absolute;
            z-index: 2;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,247,223,.18);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.08), rgba(2,5,6,.94) 65%);
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            padding: 5px;
            cursor: pointer;
            box-shadow: 0 14px 24px rgba(0,0,0,.38), inset 0 0 12px rgba(255,247,223,.04);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .skill-core {
            left: 8%;
            top: 50%;
            width: 78px;
            height: 78px;
            border-width: 2px;
            border-color: var(--c);
            box-shadow: 0 0 24px color-mix(in srgb, var(--c) 36%, transparent), inset 0 0 18px color-mix(in srgb, var(--c) 18%, transparent);
        }

        .skill-node img,
        .skill-core img {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            object-fit: cover;
            filter: grayscale(1);
            opacity: .56;
            transition: filter .18s ease, opacity .18s ease, transform .18s ease;
        }

        .skill-core img {
            filter: none;
            opacity: 1;
        }

        .skill-node.aberta {
            border-color: var(--c);
            box-shadow: 0 0 14px color-mix(in srgb, var(--c) 40%, transparent), 0 14px 24px rgba(0,0,0,.38);
        }

        .skill-node.aberta img {
            filter: none;
            opacity: 1;
        }

        .skill-node.disponivel {
            border-color: #ffe28a;
            animation: pulso 1.55s ease-in-out infinite;
        }

        .skill-node:hover,
        .skill-node.realce,
        .skill-core:hover,
        .skill-core.realce {
            z-index: 4;
            border-color: #fff7df;
            transform: translate(-50%, -50%) scale(1.14);
            filter: saturate(1.18);
            box-shadow:
                0 0 0 5px color-mix(in srgb, var(--c) 16%, transparent),
                0 0 24px color-mix(in srgb, var(--c) 58%, transparent),
                0 18px 28px rgba(0,0,0,.44),
                inset 0 0 18px color-mix(in srgb, var(--c) 18%, transparent);
        }

        .skill-node:hover img,
        .skill-node.realce img,
        .skill-core:hover img,
        .skill-core.realce img {
            filter: none;
            opacity: 1;
            transform: scale(1.04);
        }

        @keyframes pulso {
            50% { box-shadow: 0 0 18px rgba(255,226,138,.46), 0 14px 24px rgba(0,0,0,.38); }
        }

        .skill-node::after {
            content: attr(data-nivel);
            position: absolute;
            right: -2px;
            bottom: -2px;
            min-width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #120f08;
            background: #ffe28a;
            font-size: .62rem;
            font-weight: 900;
        }

        .skill-node::before {
            content: attr(data-linha);
            position: absolute;
            left: -6px;
            top: -6px;
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff7df;
            background: color-mix(in srgb, var(--c) 58%, #05090b);
            font-size: .56rem;
            font-weight: 900;
            box-shadow: 0 0 10px color-mix(in srgb, var(--c) 34%, transparent);
        }

        .skill-detalhe {
            grid-area: detalhe;
            display: grid;
            gap: 14px;
            align-content: start;
            padding: 18px;
            overflow-y: auto;
        }

        .skill-detalhe img {
            width: 132px;
            height: 132px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 28px var(--dc, rgba(54,224,255,.32));
        }

        .skill-detalhe h2,
        .skill-detalhe p {
            margin: 0;
        }

        .skill-detalhe p {
            color: #d9e8d4;
            line-height: 1.45;
        }

        .detalhe-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detalhe-status span {
            padding: 10px;
            border: 1px solid rgba(247,200,75,.22);
            border-radius: 8px;
            background: rgba(4,12,13,.58);
            color: #d9e8d4;
            font-size: .82rem;
        }

        .detalhe-status b {
            display: block;
            color: #ffe28a;
            font-size: 1.06rem;
        }

        .skill-detalhe button {
            color: #1e211c;
            background: #f7c84b;
            cursor: pointer;
        }

        .skill-detalhe button:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        @media (max-width: 1050px) {
            body { overflow: auto; }
            .skill-layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "ramos"
                    "stage"
                    "detalhe";
            }
            .ramo-lista { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .skill-stage { min-height: 640px; }
        }

        @media (max-width: 680px) {
            .skill-topo { grid-template-columns: 1fr; }
            .skill-acoes { justify-content: stretch; }
            .skill-chip,
            .voltar-lobby { width: 100%; }
            .ramo-lista { grid-template-columns: 1fr; }
            .skill-stage {
                min-height: 560px;
                overflow-x: auto;
                overflow-y: hidden;
                touch-action: pan-x pan-y;
            }
            .skill-stage > * {
                min-width: 720px;
            }
            .skill-node { width: 50px; height: 50px; }
            .skill-core { width: 68px; height: 68px; }
            .branch-band { left: 11%; right: 3%; }
            .branch-label {
                left: 13%;
                font-size: .58rem;
                padding: 3px 8px;
            }
        }

        @media (hover: none), (pointer: coarse), (max-width: 680px) {
            body {
                overflow: auto;
            }

            .video-fundo {
                display: none;
            }

            .skill-app {
                background:
                    radial-gradient(circle at 30% 34%, rgba(54, 224, 255, 0.12), transparent 26%),
                    linear-gradient(135deg, #041010, #050708);
            }

            .skill-topo,
            .ramo-lista,
            .skill-stage,
            .skill-detalhe {
                backdrop-filter: none;
                box-shadow: 0 12px 28px rgba(0,0,0,.34);
            }

            .stage-bg::before,
            .stage-bg::after,
            .branch-band {
                display: none;
            }

            .tree-line,
            .tree-line.aberta,
            .tree-line.disponivel,
            .tree-line.realce {
                filter: none !important;
                animation: none !important;
            }

            .skill-node,
            .skill-core,
            .skill-node.aberta,
            .skill-node.disponivel {
                animation: none !important;
                filter: none !important;
                box-shadow: 0 8px 16px rgba(0,0,0,.36), inset 0 0 8px rgba(255,247,223,.05);
                transition: border-color .12s ease, transform .12s ease;
            }

            .skill-node:hover,
            .skill-node.realce,
            .skill-core:hover,
            .skill-core.realce {
                transform: translate(-50%, -50%) scale(1.06);
                box-shadow: 0 10px 18px rgba(0,0,0,.38);
            }
        }
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>

    <main class="skill-app">
        <header class="skill-topo">
            <div>
                <small id="skill-estilo">Estilo de luta</small>
                <h1>Árvore de Habilidades</h1>
                <p id="skill-personagem">Carregando personagem...</p>
            </div>
            <div class="skill-acoes">
                <span class="skill-chip" id="skill-exp">0 EXP livre</span>
                <a class="voltar-lobby" href="lobby.html">Voltar ao Lobby</a>
            </div>
        </header>

        <section class="skill-layout">
            <aside class="ramo-lista" id="ramo-lista"></aside>
            <section class="skill-stage" id="skill-stage" aria-label="Árvore de habilidades">
                <div class="stage-bg"></div>
            </section>
            <aside class="skill-detalhe" id="skill-detalhe"></aside>
        </section>
    </main>

    <script src="musica-fundo.js?v=20260619-game18"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg10"></script>
    <script>
        const personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const listaRamos = document.getElementById("ramo-lista");
        const stage = document.getElementById("skill-stage");
        const detalhe = document.getElementById("skill-detalhe");
        let ramoAtivo = 0;
        let habilidadeAtiva = null;

        const ramos = [
            { chave: "vitalidade", nome: "Vitalidade", cor: "#31e860", atributo: "Força Vital", bonus: "vida máxima e recuperação" },
            { chave: "impacto", nome: "Impacto", cor: "#ff453c", atributo: "Força", bonus: "dano de arma e dano direto" },
            { chave: "agilidade", nome: "Agilidade", cor: "#49d8ff", atributo: "Agilidade", bonus: "velocidade, esquiva e combo" },
            { chave: "resistencia", nome: "Resistência", cor: "#6d8cff", atributo: "Resistência", bonus: "defesa, bloqueio e redução" },
            { chave: "mente", nome: "Controle", cor: "#9b6cff", atributo: "Força Mental", bonus: "precisão, técnica e custo" },
            { chave: "vontade", nome: "Determinação", cor: "#ff9b2f", atributo: "Determinação", bonus: "crítico, haki e pressão" }
        ];

        function perfilEstilo(estilo) {
            const texto = RpgSistemas.normalizar(estilo);
            if (/(itoryuu|nitoryuu|santoryuu|youtoryuu|kyuutoryuu|rokutoryuu|hachitoryuu|sword|fencing|mutoryuu|espada)/.test(texto)) {
                return { classe: "Espadachim", arma: "lâminas", dano: "corte", foco: ["impacto", "agilidade", "vontade"], simbolo: "blade", cor: "#ff453c" };
            }
            if (/(black leg|okama|karate|hasshouken|ryusoken|rokushiki|punho|punch|sumo|freestyle|jao|kobushi|perna)/.test(texto)) {
                return { classe: "Corpo a corpo", arma: "punhos e chutes", dano: "impacto", foco: ["impacto", "resistencia", "agilidade"], simbolo: "fist", cor: "#ff9b2f" };
            }
            if (/(arma|pistola|rifle|atirador|gun|sniper)/.test(texto)) {
                return { classe: "Atirador", arma: "armas de fogo", dano: "perfuração", foco: ["mente", "agilidade", "impacto"], simbolo: "target", cor: "#49d8ff" };
            }
            return { classe: "Estilo livre", arma: "arma equipada", dano: "híbrido", foco: ["mente", "vontade", "impacto"], simbolo: "aura", cor: "#ffe28a" };
        }

        function formatar(valor) {
            return Number(valor || 0).toLocaleString("pt-BR");
        }

        function escaparHtml(texto) {
            return String(texto ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function emblemaSvg(cor, tipo, texto) {
            const formas = {
                blade: '<path d="M61 9 48 44 76 36 80 42 57 56 50 87 40 78 45 58 19 75 14 67 39 48 30 20 38 16 49 39Z"/>',
                fist: '<path d="M25 44V27a8 8 0 0 1 15 0v12h3V21a8 8 0 0 1 15 0v18h3V28a8 8 0 0 1 15 0v25c0 23-15 34-32 34-16 0-27-10-27-28V49a7 7 0 0 1 8-5Z"/>',
                target: '<path d="M48 8a40 40 0 1 0 0 80 40 40 0 0 0 0-80Zm0 10a30 30 0 1 1 0 60 30 30 0 0 1 0-60Zm0 13a17 17 0 1 0 0 34 17 17 0 0 0 0-34Z"/>',
                aura: '<path d="M48 7c17 16 25 30 25 44 0 20-13 32-25 38-12-6-25-18-25-38 0-14 8-28 25-44Zm0 23c-7 8-11 15-11 23 0 9 5 16 11 20 6-4 11-11 11-20 0-8-4-15-11-23Z"/>',
                shield: '<path d="M48 7 80 20v24c0 19-13 35-32 45-19-10-32-26-32-45V20L48 7Zm0 14-17 7v16c0 10 6 19 17 27 11-8 17-17 17-27V28l-17-7Z"/>',
                wing: '<path d="M13 55c20-32 45-40 69-33-8 10-17 16-29 20 12 1 21-1 31-6-12 24-32 38-63 35 11-5 19-11 25-19-10 5-20 7-33 3Z"/>',
                heart: '<path d="M48 82C25 66 15 53 15 37c0-13 9-22 21-22 6 0 10 3 12 8 2-5 7-8 13-8 12 0 20 9 20 22 0 16-10 29-33 45Z"/><path d="M25 49h12l5-13 9 25 6-15h14" fill="none" stroke="#05090b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>',
                impact: '<path d="M18 61 43 13h21L51 40h27L42 84l9-29Z"/><path d="M26 26 38 38M62 58l12 12" fill="none" stroke="#05090b" stroke-width="5" stroke-linecap="round"/>',
                speed: '<path d="M18 58c18-28 42-39 67-35-9 8-18 13-31 15 12 2 21 1 30-2-12 23-33 36-64 34 11-5 20-10 27-17-9 5-19 7-29 5Z"/><path d="M17 33h25M11 47h25M17 71h20" fill="none" stroke="#05090b" stroke-width="6" stroke-linecap="round"/>',
                mind: '<path d="M48 13c17 0 31 12 37 35-6 23-20 35-37 35S17 71 11 48c6-23 20-35 37-35Zm0 17a18 18 0 1 0 0 36 18 18 0 0 0 0-36Z"/><circle cx="48" cy="48" r="8" fill="#05090b"/>',
                crown: '<path d="M20 76 16 28l19 18 13-28 13 28 19-18-4 48Z"/><path d="M26 64h44" fill="none" stroke="#05090b" stroke-width="6" stroke-linecap="round"/>'
            };
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="bg" cx="44%" cy="30%" r="76%"><stop offset="0" stop-color="#253036"/><stop offset=".58" stop-color="#071011"/><stop offset="1" stop-color="#010303"/></radialGradient><linearGradient id="g" x1="22%" y1="14%" x2="82%" y2="84%"><stop offset="0" stop-color="#fff7df"/><stop offset=".34" stop-color="${cor}"/><stop offset=".72" stop-color="#fff1a8"/><stop offset="1" stop-color="${cor}"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${cor}"/></filter></defs><rect width="96" height="96" rx="16" fill="url(#bg)"/><circle cx="48" cy="48" r="40" fill="none" stroke="${cor}" stroke-width="2.5" opacity=".85"/><circle cx="48" cy="48" r="31" fill="${cor}" opacity=".08"/><g fill="url(#g)" filter="url(#s)">${formas[tipo] || formas.aura}</g><text x="48" y="88" text-anchor="middle" fill="#fff7df" font-size="8" font-family="Arial" font-weight="900">${texto.slice(0, 3).toUpperCase()}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function tipoEmblema(ramo, perfil, indice) {
            if (ramo.chave === "vitalidade") return indice % 3 === 1 ? "shield" : "heart";
            if (ramo.chave === "impacto") return indice % 3 === 1 ? perfil.simbolo : "impact";
            if (ramo.chave === "agilidade") return indice % 3 === 1 ? "wing" : "speed";
            if (ramo.chave === "resistencia") return indice % 3 === 1 ? "aura" : "shield";
            if (ramo.chave === "mente") return indice % 3 === 1 ? "target" : "mind";
            if (ramo.chave === "vontade") return indice % 3 === 1 ? "aura" : "crown";
            return perfil.simbolo;
        }

        function bonusRamo(ramo, indice, perfil) {
            const escala = Math.floor(indice / 5) + 1;
            const valor = Math.min(35, escala + Math.floor(indice / 8));
            if (ramo.chave === "impacto") return `+${valor}% dano de ${perfil.arma} e +${Math.ceil(valor / 2)}% dano ${perfil.dano}.`;
            if (ramo.chave === "agilidade") return `+${valor}% velocidade de ação e +${Math.ceil(valor / 2)}% esquiva em combos.`;
            if (ramo.chave === "resistencia") return `+${valor}% bloqueio e +${Math.ceil(valor / 2)}% redução de dano recebido.`;
            if (ramo.chave === "vitalidade") return `+${valor}% vida máxima e +${Math.ceil(valor / 2)}% recuperação após missão.`;
            if (ramo.chave === "mente") return `+${valor}% precisão técnica e -${Math.ceil(valor / 3)}% custo de habilidade.`;
            return `+${valor}% crítico narrativo e +${Math.ceil(valor / 2)}% pressão de haki.`;
        }

        function gerarArvore(estilo) {
            const perfil = perfilEstilo(estilo);
            const habilidades = [{
                id: "0",
                ramo: -1,
                indice: 0,
                nome: `${estilo}: Fundamento Inicial`,
                descricao: "A base do estilo. Já vem desbloqueada e acende o começo de todos os ramos.",
                bonus: `Libera as primeiras técnicas de ${perfil.classe}.`,
                custo: 0,
                requer: null,
                cor: perfil.cor,
                imagem: emblemaSvg(perfil.cor, perfil.simbolo, "Core"),
                atributo: perfil.classe
            }];

            ramos.forEach((ramo, indiceRamo) => {
                const focado = perfil.foco.includes(ramo.chave);
                for (let indice = 0; indice < 50; indice += 1) {
                    const id = String(1 + indiceRamo * 50 + indice);
                    const linha = indice % 5;
                    const coluna = Math.floor(indice / 5);
                    const escala = Math.floor(indice / 5) + 1;
                    habilidades.push({
                        id,
                        ramo: indiceRamo,
                        indice,
                        linha,
                        coluna,
                        nome: indice < 5 ? `${ramo.nome}: Trilha ${linha + 1}` : `${ramo.nome} ${indice + 1}`,
                        descricao: `Fortalece ${ramo.atributo} para ${estilo} com foco em ${ramo.bonus}.`,
                        bonus: indice < 5 ? `Abre uma linha de progressão em ${ramo.nome}.` : bonusRamo(ramo, indice, perfil),
                        custo: indice < 5 ? 0 : 140 + indice * 42 + escala * 90 + (focado ? 45 : 0),
                        requer: indice < 5 ? "0" : String(Number(id) - 5),
                        cor: ramo.cor,
                        imagem: emblemaSvg(ramo.cor, tipoEmblema(ramo, perfil, indice), ramo.nome),
                        atributo: ramo.atributo
                    });
                }
            });
            return habilidades;
        }

        const eixoLinhas = [12, 31, 50, 69, 88];
        const eixoColunas = [21, 29, 37, 45, 53, 61, 69, 77, 85, 93];

        function posicao(indice) {
            const coluna = Math.floor(indice / 5);
            const linha = indice % 5;
            const x = eixoColunas[Math.min(coluna, eixoColunas.length - 1)];
            return {
                x,
                y: eixoLinhas[linha]
            };
        }

        function estado(habilidade, abertas) {
            if (abertas.includes(String(habilidade.id))) return "aberta";
            if (!habilidade.requer || abertas.includes(String(habilidade.requer))) return "disponivel";
            return "bloqueada";
        }

        function renderizar() {
            if (!personagem?.nome) {
                window.location.href = "index.html";
                return;
            }
            const estilo = personagem.estiloLuta || "Estilo livre";
            const perfil = perfilEstilo(estilo);
            const progresso = RpgSistemas.obterProgresso(personagem);
            const abertas = Array.from(new Set([...(progresso.habilidades || []), "0"].map(String)));
            const habilidades = gerarArvore(estilo);
            const ramoAtual = ramos[ramoAtivo];
            const visiveis = habilidades.filter((h) => h.ramo === ramoAtivo);
            habilidadeAtiva = habilidadeAtiva || habilidades[0];

            document.getElementById("skill-estilo").textContent = `${perfil.classe} / ${estilo}`;
            document.getElementById("skill-personagem").textContent = `${personagem.nome} / Nv. ${progresso.nivel} / arma base: ${perfil.arma}`;
            document.getElementById("skill-exp").textContent = `${formatar(progresso.expDisponivel)} EXP livre`;

            renderizarRamos(habilidades, abertas);
            renderizarStage(visiveis, habilidades[0], abertas, ramoAtual);
            renderizarDetalhe(habilidadeAtiva, progresso, abertas);
        }

        function renderizarRamos(habilidades, abertas) {
            listaRamos.innerHTML = ramos.map((ramo, indice) => {
                const lista = habilidades.filter((h) => h.ramo === indice);
                const feitos = lista.filter((h) => abertas.includes(h.id)).length;
                return `
                    <button class="ramo-botao ${ramoAtivo === indice ? "ativo" : ""}" type="button" data-ramo="${indice}" style="--c:${ramo.cor}">
                        <img src="${emblemaSvg(ramo.cor, indice % 2 ? "shield" : "aura", ramo.nome)}" alt="">
                        <span><strong>${escaparHtml(ramo.nome)}</strong><span>${escaparHtml(ramo.atributo)}</span></span>
                        <b>${feitos}/50</b>
                    </button>
                `;
            }).join("");
            listaRamos.querySelectorAll("[data-ramo]").forEach((botao) => {
                botao.addEventListener("click", () => {
                    ramoAtivo = Number(botao.dataset.ramo);
                    const estilo = personagem.estiloLuta || "Estilo livre";
                    const progresso = RpgSistemas.obterProgresso(personagem);
                    const abertas = Array.from(new Set([...(progresso.habilidades || []), "0"].map(String)));
                    const primeiraDisponivel = gerarArvore(estilo).find((h) => h.ramo === ramoAtivo && estado(h, abertas) !== "bloqueada");
                    habilidadeAtiva = primeiraDisponivel || habilidadeAtiva;
                    renderizar();
                });
            });
        }

        function renderizarStage(visiveis, core, abertas, ramoAtual) {
            const usaHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
            const linhas = visiveis.map((h) => {
                const atual = posicao(h.indice);
                const anterior = h.indice < 5 ? { x: 8, y: 50 } : posicao(h.indice - 5);
                const e = estado(h, abertas);
                const classe = e === "aberta" ? "aberta" : e === "disponivel" ? "disponivel" : "";
                const meio = h.indice < 5 ? 14 : (anterior.x + atual.x) / 2;
                return `<path class="tree-line ${classe}" data-line-skill="${h.id}" style="--line-cor:${h.cor}" d="M${anterior.x} ${anterior.y} C${meio} ${anterior.y}, ${meio} ${atual.y}, ${atual.x} ${atual.y}"></path>`;
            }).join("");
            const bandas = eixoLinhas.map((topo, indice) => (
                `<span class="branch-band" style="top:${topo}%;--ramo-cor:${ramoAtual.cor}"></span>`
            )).join("");
            const nomesLinhas = ["Trilha I", "Trilha II", "Trilha III", "Trilha IV", "Trilha V"];
            const etiquetas = eixoLinhas.map((topo, indice) => (
                `<span class="branch-label" style="top:${topo}%;--ramo-cor:${ramoAtual.cor}">${nomesLinhas[indice]}</span>`
            )).join("");
            const trilhas = eixoLinhas.map((topo) => (
                `<span class="tree-lane" style="top:${topo}%;--ramo-cor:${ramoAtual.cor}"></span>`
            )).join("");
            const tiers = Array.from({ length: 10 }, (_, indice) => {
                const p = posicao(indice * 5);
                return `<span class="tree-tier" style="left:${p.x}%">N${indice + 1}</span>`;
            }).join("");

            stage.innerHTML = `
                <div class="stage-bg" style="--ramo-cor:${ramoAtual.cor}"></div>
                ${bandas}
                ${trilhas}
                ${etiquetas}
                ${tiers}
                <svg class="tree-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${linhas}</svg>
                <button class="skill-core" type="button" data-skill="0" style="--c:${core.cor}">
                    <img src="${core.imagem}" alt="">
                </button>
                ${visiveis.map((h) => {
                    const p = posicao(h.indice);
                    const e = estado(h, abertas);
                    return `
                        <button class="skill-node ${e}" type="button" data-skill="${h.id}" data-nivel="${h.indice + 1}" data-linha="${h.linha + 1}" style="left:${p.x}%;top:${p.y}%;--c:${h.cor}">
                            <img src="${h.imagem}" alt="">
                        </button>
                    `;
                }).join("")}
            `;
            stage.querySelectorAll("[data-skill]").forEach((botao) => {
                if (usaHover) {
                    botao.addEventListener("mouseenter", () => {
                        stage.querySelectorAll(".realce").forEach((el) => el.classList.remove("realce"));
                        botao.classList.add("realce");
                        stage.querySelector(`[data-line-skill="${botao.dataset.skill}"]`)?.classList.add("realce");
                    });
                    botao.addEventListener("mouseleave", () => {
                        botao.classList.remove("realce");
                        stage.querySelector(`[data-line-skill="${botao.dataset.skill}"]`)?.classList.remove("realce");
                    });
                }
                botao.addEventListener("click", () => {
                    stage.querySelectorAll(".realce").forEach((el) => el.classList.remove("realce"));
                    botao.classList.add("realce");
                    stage.querySelector(`[data-line-skill="${botao.dataset.skill}"]`)?.classList.add("realce");
                    const habilidade = gerarArvore(personagem.estiloLuta || "Estilo livre").find((h) => h.id === botao.dataset.skill);
                    habilidadeAtiva = habilidade || habilidadeAtiva;
                    renderizar();
                });
            });
        }

        function renderizarDetalhe(habilidade, progresso, abertas) {
            const e = estado(habilidade, abertas);
            const pode = e === "disponivel" && progresso.expDisponivel >= habilidade.custo;
            detalhe.style.setProperty("--dc", habilidade.cor);
            detalhe.innerHTML = `
                <span class="detalhe-meta">${escaparHtml(habilidade.atributo)}</span>
                <img src="${habilidade.imagem}" alt="">
                <h2>${escaparHtml(habilidade.nome)}</h2>
                <p>${escaparHtml(habilidade.descricao)}</p>
                <div class="detalhe-status">
                    <span><b>${e === "aberta" ? "Aberta" : e === "disponivel" ? "Disponível" : "Bloqueada"}</b>Estado</span>
                    <span><b>${formatar(habilidade.custo)}</b>Custo EXP</span>
                    <span><b>${formatar(progresso.expDisponivel)}</b>EXP livre</span>
                    <span><b>${habilidade.ramo < 0 ? "Core" : habilidade.ramo + 1}</b>Ramo</span>
                </div>
                <p><strong style="color:${habilidade.cor}">Bônus:</strong> ${escaparHtml(habilidade.bonus)}</p>
                <button type="button" id="botao-desbloquear" ${pode ? "" : "disabled"}>${e === "aberta" ? "Habilidade dominada" : "Desbloquear"}</button>
                <p id="skill-msg"></p>
            `;
            document.getElementById("botao-desbloquear").addEventListener("click", () => {
                const resultado = RpgSistemas.salvarHabilidade(personagem, habilidade);
                document.getElementById("skill-msg").textContent = resultado.mensagem || "Habilidade desbloqueada.";
                if (resultado.ok) renderizar();
            });
        }

        renderizar();
    </script>
</body>
</html>
