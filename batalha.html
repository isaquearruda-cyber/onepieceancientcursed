<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game25">
    <style>
        html, body { min-height: 100%; margin: 0; background: #030708; color: #fff7df; overflow-x: hidden; }
        body { font-family: Georgia, "Times New Roman", serif; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.28) saturate(1.22); z-index: 0; }
        .battle-app { position: relative; z-index: 2; width: min(1280px, calc(100% - 28px)); min-height: 100vh; margin: 0 auto; padding: clamp(16px, 3vw, 38px) 0; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
        .battle-panel { border: 1px solid rgba(247, 200, 75, .28); border-radius: 8px; background: linear-gradient(180deg, rgba(7, 20, 22, .9), rgba(3, 8, 10, .94)); box-shadow: 0 22px 64px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,247,223,.06); backdrop-filter: blur(8px); }
        .battle-app::before { content: "BATTLE SYSTEM V2"; position: fixed; right: clamp(14px, 4vw, 54px); top: clamp(76px, 12vh, 128px); z-index: -1; color: rgba(255,226,138,.055); font: 1000 clamp(3.6rem, 11vw, 9rem)/.82 "Segoe UI Black","Arial Black",Impact,sans-serif; letter-spacing: .04em; text-transform: uppercase; writing-mode: vertical-rl; pointer-events: none; }
        .battle-top { position: relative; overflow: hidden; }
        .battle-top::after { content: ""; position: absolute; inset: auto 0 0; height: 3px; background: linear-gradient(90deg,#36e0ff,#90ff00,#ffe28a,#ff4128); box-shadow: 0 0 18px rgba(255,226,138,.6); }
        .battle-top { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: clamp(14px, 2.4vw, 22px); }
        .battle-top small, .battle-meta { color: #ffe28a; font-weight: 1000; letter-spacing: .12em; text-transform: uppercase; }
        .battle-top h1 { margin: 4px 0 8px; color: #fff7df; font-family: "Segoe UI Black", "Arial Black", Impact, sans-serif; font-size: clamp(2.1rem, 5vw, 4.2rem); line-height: .92; text-transform: uppercase; text-shadow: 0 5px 0 #210b08, 0 18px 30px rgba(0,0,0,.72); }
        .battle-top p { margin: 0; max-width: 760px; color: #d9e8d4; line-height: 1.45; }
        .battle-link, .battle-actions button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255, 226, 138, .52); border-radius: 8px; color: #fff7df; background: rgba(4, 12, 13, .72); font-weight: 1000; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        .battle-link:hover, .battle-actions button:hover { border-color: #ffe28a; background: rgba(247, 200, 75, .16); }
        .phaser-stage { display: grid; gap: 10px; padding: 12px; overflow: hidden; }
        .phaser-stage header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
        .phaser-stage h2 { margin: 4px 0 0; color: #fff7df; font-size: 1.1rem; text-transform: uppercase; }
        .phaser-status { padding: 6px 9px; border: 1px solid rgba(144,255,0,.28); border-radius: 999px; color: #b8ff55; background: rgba(144,255,0,.08); font: 1000 .7rem Arial,sans-serif; text-transform: uppercase; }
        .phaser-canvas { min-height: 220px; border: 1px solid rgba(255,226,138,.18); border-radius: 8px; background: radial-gradient(circle at 50% 50%, rgba(255,226,138,.12), transparent 42%), rgba(0,0,0,.28); overflow: hidden; }
        .phaser-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
        .battle-arena { position: relative; display: grid; grid-template-columns: minmax(260px, .9fr) minmax(320px, 1.2fr) minmax(260px, .9fr); gap: 14px; min-height: 560px; padding: 14px; background: radial-gradient(circle at 23% 38%, rgba(54,224,255,.16), transparent 28%), radial-gradient(circle at 78% 42%, rgba(255,65,40,.16), transparent 29%), radial-gradient(circle at 50% 28%, rgba(255, 226, 138, .14), transparent 34%), linear-gradient(180deg, rgba(1,7,9,.9), rgba(8,18,15,.78)); overflow: hidden; }
        .battle-arena::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,226,138,.08); background: linear-gradient(90deg, rgba(54,224,255,.11) 1px, transparent 1px), linear-gradient(0deg, rgba(255,226,138,.08) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(circle at 50% 50%, #000, transparent 74%); pointer-events: none; }
        .battle-arena > * { position: relative; z-index: 1; }
        .fighter { --cor: #36e0ff; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-height: 0; padding: 14px; border: 1px solid color-mix(in srgb, var(--cor) 42%, transparent); border-radius: 8px; background: radial-gradient(circle at 50% 22%, color-mix(in srgb, var(--cor) 18%, transparent), transparent 38%), rgba(0,0,0,.24); box-shadow: inset 0 0 28px rgba(0,0,0,.28), 0 0 28px color-mix(in srgb, var(--cor) 14%, transparent); }
        .fighter-head { display: grid; gap: 6px; }
        .fighter-head h2 { margin: 0; font-size: clamp(1.25rem, 2.6vw, 2rem); line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
        .fighter-head span { color: #d9e8d4; font-weight: 900; }
        .fighter-portrait { position: relative; display: grid; place-items: center; min-height: 280px; border: 1px solid rgba(255,247,223,.1); border-radius: 8px; background: radial-gradient(ellipse at 50% 78%, color-mix(in srgb, var(--cor) 28%, transparent), transparent 54%), repeating-linear-gradient(0deg, rgba(255,255,255,.025), rgba(255,255,255,.025) 1px, transparent 1px, transparent 8px); overflow: hidden; }
        .fighter-portrait img { max-width: 90%; max-height: 360px; object-fit: contain; filter: drop-shadow(0 24px 24px rgba(0,0,0,.72)); }
        .fighter-symbol { display: grid; place-items: center; width: min(190px, 55%); aspect-ratio: 1; border: 2px solid color-mix(in srgb, var(--cor) 52%, transparent); border-radius: 18px; background: radial-gradient(circle, color-mix(in srgb, var(--cor) 44%, #fff7df), rgba(3,8,10,.82) 66%); color: #06100d; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; font-size: clamp(3.6rem, 9vw, 6rem); box-shadow: 0 0 34px color-mix(in srgb, var(--cor) 32%, transparent); }
        .bar-stack { display: grid; gap: 8px; }
        .bar-row { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: center; color: #d9e8d4; font: 900 .82rem Arial, sans-serif; text-transform: uppercase; }
        .bar { height: 12px; border: 1px solid rgba(255,247,223,.14); border-radius: 999px; background: rgba(0,0,0,.48); overflow: hidden; }
        .bar i { display: block; width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff4128, #ffe28a); transition: width .28s ease; }
        .bar.ene i { background: linear-gradient(90deg, #36e0ff, #90ff00); }
        .battle-center { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-height: 0; }
        .turn-card { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 12px; }
        .turn-card span { padding: 10px; border: 1px solid rgba(255,247,223,.12); border-radius: 8px; background: rgba(0,0,0,.22); color: #d9e8d4; font-weight: 900; text-align: center; }
        .turn-card strong { display: block; margin-bottom: 4px; color: #ffe28a; font-size: 1.15rem; }
        .battle-log { min-height: 0; max-height: 390px; overflow-y: auto; padding: 12px; display: grid; align-content: start; gap: 8px; }
        .battle-log p { margin: 0; padding: 10px; border-left: 3px solid #36e0ff; background: rgba(255,247,223,.05); color: #d9e8d4; line-height: 1.34; }
        .battle-actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 12px; }
        .battle-actions::before { content: "Comandos de combate"; grid-column: 1 / -1; color: #36e0ff; font: 1000 .68rem Arial,sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        .battle-actions .primary { color: #07100d; background: linear-gradient(90deg, #ffe28a, #f7c84b); }
        .battle-actions .liberado { color: #07100d; border-color: rgba(144,255,0,.72); background: linear-gradient(90deg, #90ff00, #ffe28a); box-shadow: 0 0 24px rgba(144,255,0,.34); animation: battleWinPulse .9s ease-in-out infinite alternate; }
        .battle-actions .danger { border-color: rgba(255,92,92,.44); color: #ffd6cc; background: rgba(78,12,10,.64); }
        .battle-actions button:disabled { opacity: .5; cursor: default; }
        .battle-footer { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
        .battle-footer article { padding: 12px; }
        .battle-footer strong { display: block; margin-top: 4px; color: #fff7df; font-size: 1.1rem; }
        .battle-debug-reset { position: fixed; right: 14px; top: 82px; z-index: 5000; min-height: 36px; padding: 0 10px; border: 1px solid rgba(144,255,0,.38); border-radius: 8px; color: #eaffd8; background: rgba(3,12,8,.78); font: 1000 .66rem Arial,sans-serif; text-transform: uppercase; cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,.38); }
        @keyframes battleWinPulse { from { filter: brightness(1); } to { filter: brightness(1.18); } }
        .battle-empty { position: fixed; inset: 0; z-index: 6000; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); }
        .battle-empty-card { width: min(520px, 100%); padding: 18px; border: 1px solid rgba(255,226,138,.34); border-radius: 8px; background: linear-gradient(180deg, rgba(7,20,22,.98), rgba(3,8,10,.98)); box-shadow: 0 28px 90px rgba(0,0,0,.72); color: #fff7df; }
        .battle-empty-card h2 { margin: 4px 0 10px; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; text-transform: uppercase; }
        .battle-empty-card p { color: #d9e8d4; line-height: 1.45; }
        .battle-empty-card a { display: inline-grid; place-items: center; min-height: 42px; margin-top: 12px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #07100d; background: linear-gradient(90deg,#ffe28a,#f7c84b); font-weight: 1000; text-transform: uppercase; text-decoration: none; }
        @media (max-width: 980px) { .battle-arena { grid-template-columns: 1fr; } .battle-center { order: 3; } .fighter-portrait { min-height: 230px; } .battle-footer, .battle-top { grid-template-columns: 1fr; } }
        @media (max-width: 560px) { .battle-app { width: min(100%, calc(100% - 18px)); padding-top: 76px; } .battle-actions, .turn-card, .battle-footer { grid-template-columns: 1fr; } .video-fundo { display: none; } .phaser-canvas{min-height:180px} }
    </style>
</head>
<body>
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="battle-app">
        <header class="battle-top battle-panel">
            <div>
                <small>Modo combate</small>
                <h1>Batalha</h1>
                <p id="battle-brief">Carregando encontro...</p>
            </div>
            <a class="battle-link" href="missoes.html">Voltar às Missões</a>
        </header>
        <section class="phaser-stage battle-panel">
            <header>
                <div><small>Phaser 3</small><h2>Cena de combate animada</h2></div>
                <span class="phaser-status" id="phaser-status">Carregando motor</span>
            </header>
            <div class="phaser-canvas" id="phaser-canvas"></div>
        </section>
        <section class="battle-arena battle-panel">
            <article class="fighter" id="player-card" style="--cor:#36e0ff">
                <div class="fighter-head"><span class="battle-meta">Jogador</span><h2 id="player-name">Personagem</h2><span id="player-race">Classe</span></div>
                <div class="fighter-portrait" id="player-portrait"><div class="fighter-symbol">OP</div></div>
                <div class="bar-stack">
                    <div class="bar-row"><span>HP</span><div class="bar"><i id="player-hp-bar"></i></div><b id="player-hp-text">0/0</b></div>
                    <div class="bar-row"><span>ENE</span><div class="bar ene"><i id="player-ene-bar"></i></div><b id="player-ene-text">0/0</b></div>
                </div>
            </article>
            <section class="battle-center">
                <div class="turn-card battle-panel">
                    <span><strong id="turno">1</strong>Turno</span>

                <div class="battle-actions battle-panel">
                    <button class="primary" type="button" data-action="attack">Ataque</button>
                    <button type="button" data-action="skill">Habilidade</button>
                    <button type="button" data-action="defend">Defender</button>
                    <button type="button" data-action="item">Item</button>
                    <button class="primary" type="button" data-action="finish">Finalizar vitória</button>
                    <button class="danger" type="button" data-action="reset">Reiniciar</button>
                </div>
            </section>
            <article class="fighter" id="enemy-card" style="--cor:#ff4128">
                <div class="fighter-head"><span class="battle-meta">Inimigo</span><h2 id="enemy-name">Inimigo</h2><span id="enemy-desc">Ameaça</span></div>
                <div class="fighter-portrait"><div class="fighter-symbol" id="enemy-symbol">X</div></div>
                <div class="bar-stack">
                    <div class="bar-row"><span>HP</span><div class="bar"><i id="enemy-hp-bar"></i></div><b id="enemy-hp-text">0/0</b></div>
                    <div class="bar-row"><span>FÚRIA</span><div class="bar ene"><i id="enemy-ene-bar"></i></div><b id="enemy-ene-text">0/0</b></div>
                </div>
            </article>

        <section class="battle-footer">
            <article class="battle-panel"><small>Recompensa</small><strong id="reward-text">--</strong></article>
            <article class="battle-panel"><small>Inventário</small><strong id="item-text">--</strong></article>
            <article class="battle-panel"><small>Missão</small><strong id="mission-text">Livre</strong></article>
            <article class="battle-panel"><small>Status</small><strong id="status-text">Em combate</strong></article>
        </section>
    </main>
    <script src="banco-personagens.js?v=20260619-db2"></script>
    <script src="musica-fundo.js?v=20260619-game25"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg10"></script>
    <script>
        function ler(chave, padrao) { try { return JSON.parse(localStorage.getItem(chave) || "null") || padrao; } catch { return padrao; } }
        const personagem = ler("ultimoPersonagem", null);
        if (!personagem?.nome) {
            document.body.insertAdjacentHTML("beforeend", `<div class="battle-empty"><section class="battle-empty-card"><small class="battle-meta">Personagem não encontrado</small><h2>Batalha precisa de personagem ativo</h2><p>Entre no lobby com seu personagem cadastrado e abra a batalha pelo botão BT ou por uma missão aceita.</p><a href="index.html">Voltar ao login</a></section></div>`);
        }
        const params = new URLSearchParams(location.search);
        const rankAtual = (params.get("rank") || "E").toUpperCase();
        const missaoId = params.get("missao") || "";
        const missaoAtual = ler("rpg_missao_batalha_atual", null);
        const inimigos = {
            E: { nome: "Batedor de Porto", desc: "Ameaça baixa", hp: 160, forca: 18, furia: 80, simbolo: "E" },
            D: { nome: "Contrabandista Armado", desc: "Ameaça moderada", hp: 230, forca: 28, furia: 95, simbolo: "D" },
            C: { nome: "Capitão de Rua", desc: "Ameaça alta", hp: 320, forca: 42, furia: 110, simbolo: "C" },
            B: { nome: "Comandante Rival", desc: "Ameaça crítica", hp: 450, forca: 58, furia: 125, simbolo: "B" },
            A: { nome: "Lenda Procurada", desc: "Ameaça extrema", hp: 620, forca: 76, furia: 145, simbolo: "A" }
        };
        const rankPeso = { E: 1, D: 1.25, C: 1.55, B: 1.9, A: 2.35 };
        const inimigoBase = inimigos[rankAtual] || inimigos.E;
        const sistemas = window.RpgSistemas || {
            obterProgresso: (p) => p?.progressoRpg || { nivel: 1, berris: 0 },
            recompensasAtividade: () => ({ exp: 90, berris: 850, pontosAtributo: 1, pontosMissao: 2 }),
            concluirAtividade: async (p) => ({ personagem: p, recompensas: { exp: 90, berris: 850, pontosAtributo: 1, pontosMissao: 2 } }),
            normalizar: (texto) => String(texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        };
        const progresso = personagem ? sistemas.obterProgresso(personagem) : {};
        const atributos = personagem?.atributosDistribuidos || personagem?.atributos || {};
        const vital = Number(atributos.forcaVital || atributos.vitalidade || atributos.hp || 80);
        const mental = Number(atributos.forcaMental || atributos.mental || 60);
        const forca = Number(atributos.forca || 60);
        const agilidade = Number(atributos.agilidade || 60);
        const resistencia = Number(atributos.resistencia || 60);
        let state = {
            turno: 1,
            defendendo: false,
            venceu: false,
            playerMaxHp: Math.round(260 + vital * 2.1 + Number(progresso.nivel || 1) * 16),
            playerHp: 0,
            playerMaxEne: Math.round(110 + mental * 1.2),
            playerEne: 0,
            enemyMaxHp: inimigoBase.hp,
            enemyHp: inimigoBase.hp,
            enemyMaxEne: inimigoBase.furia,
            enemyEne: inimigoBase.furia,
            vitorias: 0
        };
        state.playerHp = state.playerMaxHp;
        state.playerEne = state.playerMaxEne;
        let avisoVitoriaMostrado = false;

        function resetarEstadoBatalha() {
            state.turno = 1;
            state.defendendo = false;
            state.venceu = false;
            state.playerMaxHp = Math.max(120, Number(state.playerMaxHp) || Math.round(260 + vital * 2.1 + Number(progresso.nivel || 1) * 16));
            state.playerMaxEne = Math.max(60, Number(state.playerMaxEne) || Math.round(110 + mental * 1.2));
            state.enemyMaxHp = Math.max(80, Number(inimigoBase.hp) || 160);
            state.enemyMaxEne = Math.max(40, Number(inimigoBase.furia) || 80);
            state.playerHp = state.playerMaxHp;
            state.playerEne = state.playerMaxEne;
            state.enemyHp = state.enemyMaxHp;
            state.enemyEne = state.enemyMaxEne;
            avisoVitoriaMostrado = false;
            document.getElementById("vitorias").textContent = state.vitorias;
        }

        function salvar(chave, valor) { localStorage.setItem(chave, JSON.stringify(valor)); }
        function normalizar(texto) { return sistemas.normalizar ? sistemas.normalizar(texto) : String(texto || "").toLowerCase(); }
        function carregarScript(src, id) {
            return new Promise((resolve, reject) => {
                if (document.getElementById(id)) { resolve(); return; }
                const script = document.createElement("script");
                script.id = id;
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error("Falha ao carregar " + src));
                document.head.appendChild(script);
            });
        }
        async function iniciarPhaser() {
            const status = document.getElementById("phaser-status");
            const alvo = document.getElementById("phaser-canvas");
            try {
                await carregarScript("https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js", "phaser-batalha");
                if (!window.Phaser) throw new Error("Phaser indisponível");
                status.textContent = "Phaser ativo";
                const config = {
                    type: Phaser.AUTO,
                    parent: alvo,
                    width: Math.max(320, alvo.clientWidth),
                    height: Math.max(180, alvo.clientHeight),
                    backgroundColor: "rgba(0,0,0,0)",
                    transparent: true,
                    scene: {
                        create: function () {
                            const w = this.scale.width;
                            const h = this.scale.height;
                            const grid = this.add.graphics();
                            grid.lineStyle(1, 0x36e0ff, 0.12);
                            for (let x = 0; x < w; x += 42) grid.lineBetween(x, 0, x, h);
                            for (let y = 0; y < h; y += 42) grid.lineBetween(0, y, w, y);
                            this.add.ellipse(w * .5, h * .72, w * .7, 42, 0xffe28a, 0.14);
                            this.playerAura = this.add.circle(w * .22, h * .56, 54, 0x36e0ff, 0.14).setStrokeStyle(2, 0x36e0ff, .55);
                            this.enemyAura = this.add.circle(w * .78, h * .56, 54, 0xff4128, 0.14).setStrokeStyle(2, 0xff4128, .55);
                            this.player = this.add.text(w * .22, h * .52, "OP", { fontFamily: "Arial Black", fontSize: "42px", color: "#fff7df", stroke: "#061011", strokeThickness: 6 }).setOrigin(.5);
                            this.enemy = this.add.text(w * .78, h * .52, inimigoBase.simbolo, { fontFamily: "Arial Black", fontSize: "48px", color: "#ffdf9a", stroke: "#210b08", strokeThickness: 6 }).setOrigin(.5);
                            this.tweens.add({ targets: [this.playerAura, this.enemyAura], scale: 1.12, alpha: .26, yoyo: true, repeat: -1, duration: 900, ease: "sine.inOut" });
                            window.battleFx = {
                                playerAttack: () => this.fxProjectile(this.player.x + 32, this.player.y, this.enemy.x - 28, this.enemy.y, 0xffe28a),
                                skill: () => this.fxProjectile(this.player.x + 32, this.player.y - 10, this.enemy.x - 22, this.enemy.y, 0x90ff00, true),
                                enemyAttack: () => this.fxProjectile(this.enemy.x - 32, this.enemy.y, this.player.x + 28, this.player.y, 0xff4128),
                                defend: () => this.fxShield(this.playerAura, 0x36e0ff),
                                item: () => this.fxShield(this.playerAura, 0x90ff00),
                                victory: () => this.fxVictory()
                            };
                        },
                        fxProjectile: function (x1, y1, x2, y2, color, heavy) {
                            const ball = this.add.circle(x1, y1, heavy ? 12 : 8, color, 1);
                            this.tweens.add({
                                targets: ball,
                                x: x2,
                                y: y2,
                                scale: heavy ? 2.4 : 1.7,
                                alpha: .18,
                                duration: heavy ? 320 : 240,
                                ease: "quad.out",
                                onComplete: () => {
                                    const hit = this.add.circle(x2, y2, heavy ? 36 : 24, color, .38);
                                    ball.destroy();
                                    this.cameras.main.shake(heavy ? 180 : 100, heavy ? .012 : .006);
                                    this.tweens.add({ targets: hit, scale: 1.8, alpha: 0, duration: 220, onComplete: () => hit.destroy() });
                                }
                            });
                        },
                        fxShield: function (target, color) {
                            const shield = this.add.circle(target.x, target.y, 64, color, .08).setStrokeStyle(3, color, .75);
                            this.tweens.add({ targets: shield, scale: 1.35, alpha: 0, duration: 460, ease: "sine.out", onComplete: () => shield.destroy() });
                        },
                        fxVictory: function () {
                            for (let i = 0; i < 28; i += 1) {
                                const star = this.add.circle(this.scale.width * .5, this.scale.height * .52, 4 + Math.random() * 5, 0xffe28a, 1);
                                this.tweens.add({ targets: star, x: star.x + (Math.random() - .5) * 360, y: star.y + (Math.random() - .5) * 180, alpha: 0, scale: 2, duration: 620 + Math.random() * 420, ease: "quad.out", onComplete: () => star.destroy() });
                            }
                        }
                    }
                };
                const game = new Phaser.Game(config);
                window.addEventListener("resize", () => game.scale.resize(Math.max(320, alvo.clientWidth), Math.max(180, alvo.clientHeight)));
            } catch (erro) {
                status.textContent = "Phaser fallback";
                console.warn("Phaser indisponível:", erro);
            }
        }
        function danoBase(mult) {
            const variacao = .86 + Math.random() * .28;
            return Math.max(12, Math.round(((forca * .55) + (agilidade * .22) + Number(progresso.nivel || 1) * 7) * (mult || 1) * variacao));
        }
        function log(texto) {
            const el = document.getElementById("battle-log");
            el.insertAdjacentHTML("afterbegin", `<p>${texto}</p>`);
        }
        function numeroSeguro(valor, padrao) {
            const numero = Number(valor);
            return Number.isFinite(numero) ? numero : padrao;
        }
        function pct(valor, max) {
            const maximo = Math.max(1, numeroSeguro(max, 1));
            return Math.max(0, Math.min(100, (numeroSeguro(valor, 0) / maximo) * 100));
        }
        function alvo(id) { return document.getElementById(id); }
        function texto(id, valor) {
            document.querySelectorAll("#" + id).forEach((el) => { el.textContent = valor; });
        }
        function largura(id, valor) {
            document.querySelectorAll("#" + id).forEach((el) => { el.style.width = valor; });
        }
        function sanitizarEstado() {
            state.playerMaxHp = Math.max(1, numeroSeguro(state.playerMaxHp, 1));
            state.playerMaxEne = Math.max(1, numeroSeguro(state.playerMaxEne, 1));
            state.enemyMaxHp = Math.max(1, numeroSeguro(state.enemyMaxHp, inimigoBase.hp || 160));
            state.enemyMaxEne = Math.max(1, numeroSeguro(state.enemyMaxEne, inimigoBase.furia || 80));
            state.playerHp = Math.max(0, Math.min(state.playerMaxHp, numeroSeguro(state.playerHp, state.playerMaxHp)));
            state.playerEne = Math.max(0, Math.min(state.playerMaxEne, numeroSeguro(state.playerEne, state.playerMaxEne)));
            state.enemyHp = Math.max(0, Math.min(state.enemyMaxHp, numeroSeguro(state.enemyHp, state.enemyMaxHp)));
            state.enemyEne = Math.max(0, Math.min(state.enemyMaxEne, numeroSeguro(state.enemyEne, state.enemyMaxEne)));
        }
        function renderizarBarras() {
            sanitizarEstado();
            largura("player-hp-bar", pct(state.playerHp, state.playerMaxHp) + "%");
            largura("player-ene-bar", pct(state.playerEne, state.playerMaxEne) + "%");
            largura("enemy-hp-bar", pct(state.enemyHp, state.enemyMaxHp) + "%");
            largura("enemy-ene-bar", pct(state.enemyEne, state.enemyMaxEne) + "%");
            texto("player-hp-text", `${Math.max(0, state.playerHp)}/${state.playerMaxHp}`);
            texto("player-ene-text", `${Math.max(0, state.playerEne)}/${state.playerMaxEne}`);
            texto("enemy-hp-text", `${Math.max(0, state.enemyHp)}/${state.enemyMaxHp}`);
            texto("enemy-ene-text", `${Math.max(0, state.enemyEne)}/${state.enemyMaxEne}`);
            document.body.dataset.enemyHp = `${Math.max(0, state.enemyHp)}/${state.enemyMaxHp}`;
        }
        function atualizar() {
            renderizarBarras();
            if (state.enemyHp <= 0) {
                state.enemyHp = 0;
                state.venceu = true;
            }
            texto("turno", state.turno);
            texto("rank", rankAtual);
            texto("status-text", state.venceu ? "Vitória pronta" : state.playerHp <= 0 ? "Derrotado" : "Em combate");
            const finalizar = document.querySelector('[data-action="finish"]');
            if (finalizar) {
                finalizar.disabled = !state.venceu;
                finalizar.classList.toggle("liberado", state.venceu);
                finalizar.textContent = state.venceu ? "Salvar vitória" : "Finalizar vitória";
            }
            document.querySelectorAll('[data-action="attack"],[data-action="skill"],[data-action="defend"],[data-action="item"]').forEach((btn) => {
                btn.disabled = state.venceu || state.playerHp <= 0;
            });
        }
        function turnoInimigo() {
            if (state.venceu || state.enemyHp <= 0) return;
            try {
                const bruto = Math.round((inimigoBase.forca + state.enemyEne * .08) * (.86 + Math.random() * .26));
                const mitigado = Math.round(bruto * (100 / (100 + resistencia)));
                const dano = state.defendendo ? Math.round(mitigado * .42) : mitigado;
                state.playerHp = Math.max(0, state.playerHp - dano);
                state.enemyEne = Math.max(0, state.enemyEne - 8);
                state.defendendo = false;
                try { window.battleFx?.enemyAttack?.(); } catch (erroFx) { console.warn("FX inimigo falhou.", erroFx); }
                log(`${inimigoBase.nome} contra-atacou causando ${dano} de dano.`);
                if (state.playerHp <= 0) log("Você caiu no combate. Reinicie, use itens ou volte mais forte.");
                state.turno += 1;
                atualizar();
            } catch (erro) {
                console.warn("Turno do inimigo falhou sem travar a batalha.", erro);
                state.defendendo = false;
                atualizar();
            }
        }
        function verificarVitoria() {
            if (state.enemyHp > 0) return false;
            if (state.venceu) {
                atualizar();
                return true;
            }
            state.venceu = true;
            state.vitorias += 1;
            try { window.battleFx?.victory?.(); } catch (erroFx) { console.warn("FX vitória falhou.", erroFx); }
            document.getElementById("vitorias").textContent = state.vitorias;
            if (!avisoVitoriaMostrado) {
                avisoVitoriaMostrado = true;
                log("Vitória alcançada. Clique em Salvar vitória para gravar recompensas e conquistas.");
            }
            atualizar();
            return true;
        }
        let acaoEmAndamento = false;
        function usarAcao(acao) {
            if (!personagem?.nome) { return; }
            if (acao === "reset") {
                resetarEstadoBatalha();
                document.getElementById("battle-log").innerHTML = "";
                log(`Combate reiniciado contra ${inimigoBase.nome}.`);
                atualizar();
                return;
            }
            if (acao === "finish") { finalizarVitoria(); return; }
            if (state.venceu || state.playerHp <= 0) return;
            if (acaoEmAndamento) {
                log("Aguarde a ação terminar.");
                return;
            }
            acaoEmAndamento = true;
            let passaTurno = true;
            const hpInimigoAntes = state.enemyHp;

            try {
                switch (acao) {
                    case "attack": {
                        const dano = danoBase(1);
                        state.enemyHp = Math.max(0, state.enemyHp - dano);
                        state.playerEne = Math.min(state.playerMaxEne, state.playerEne + 8);
                        try { window.battleFx?.playerAttack?.(); } catch (erroFx) { console.warn("FX ataque falhou.", erroFx); }
                        log(`${personagem.nome} acertou um ataque e causou ${dano} de dano.`);
                        renderizarBarras();
                        break;
                    }
                    case "skill": {
                        if (state.playerEne < 32) {
                            log("Energia insuficiente para habilidade.");
                            passaTurno = false;
                            break;
                        }
                        const dano = danoBase(1.82);
                        state.playerEne -= 32;
                        state.enemyHp = Math.max(0, state.enemyHp - dano);
                        try { window.battleFx?.skill?.(); } catch (erroFx) { console.warn("FX habilidade falhou.", erroFx); }
                        log(`${personagem.nome} liberou uma habilidade e causou ${dano} de dano.`);
                        renderizarBarras();
                        break;
                    }
                    case "defend":
                        state.defendendo = true;
                        state.playerEne = Math.min(state.playerMaxEne, state.playerEne + 18);
                        try { window.battleFx?.defend?.(); } catch (erroFx) { console.warn("FX defesa falhou.", erroFx); }
                        log(`${personagem.nome} assumiu postura defensiva e recuperou energia.`);
                        break;
                    case "item": {
                        const inv = ler(`inventario_${personagem.nome}`, []);
                        const item = inv.find((entrada) => ["alimentacao", "medicinais", "consumiveis"].includes(entrada.tipo) && Number(entrada.quantidade || 1) > 0);
                        if (!item) {
                            state.enemyHp = hpInimigoAntes;
                            passaTurno = false;
                            log("Nenhum item de cura encontrado no inventário.");
                            break;
                        }
                        const cura = Math.round(state.playerMaxHp * .28);
                        state.playerHp = Math.min(state.playerMaxHp, state.playerHp + cura);
                        state.enemyHp = hpInimigoAntes;
                        item.quantidade = Math.max(0, Number(item.quantidade || 1) - 1);
                        salvar(`inventario_${personagem.nome}`, inv.filter((entrada) => Number(entrada.quantidade || 0) > 0));
                        try { window.battleFx?.item?.(); } catch (erroFx) { console.warn("FX item falhou.", erroFx); }
                        log(`${item.nome} usado: +${cura} HP.`);
                        break;
                    }
                    default:
                        return;
                }
            } catch (erro) {
                console.warn("Ação falhou sem travar a batalha.", erro);
                log("A ação falhou, mas a batalha continua.");
            } finally {
                acaoEmAndamento = false;
            }
            atualizar();
            if (!verificarVitoria() && passaTurno) setTimeout(turnoInimigo, 360);
        }
        async function finalizarVitoria() {
            if (state.enemyHp <= 0) state.venceu = true;
            atualizar();
            if (!state.venceu || !personagem?.nome) return;
            const registroChave = "rpg_batalhas_" + normalizar(personagem.nome);
            const registros = ler(registroChave, []);
            const jaRegistrada = registros.some((item) => item.missaoId && item.missaoId === missaoId);
            if (jaRegistrada) {
                log("Esta batalha de missão já foi registrada.");
                return;
            }
            const resultado = await sistemas.concluirAtividade(personagem, {
                tipo: "batalha",
                titulo: missaoAtual?.titulo || `Vitória contra ${inimigoBase.nome}`,
                rank: rankAtual,
                periodo: missaoAtual?.periodo || "diarias"
            });
            const inv = ler(`inventario_${personagem.nome}`, []);
            const itemDrop = {
                id: Date.now(),
                nome: rankAtual === "A" ? "Troféu de Comandante" : rankAtual === "B" ? "Insígnia de Vitória" : "Fragmento de Recompensa",
                tipo: rankAtual === "A" ? "tesouros" : "recursos",
                quantidade: 1,
                raridade: ["A", "B"].includes(rankAtual) ? "Épico" : "Incomum",
                descricao: "Drop conquistado em batalha. Pode ser equipado ou guardado como prova de combate.",
                origem: "Batalha",
                adicionadoEm: new Date().toLocaleString("pt-BR"),
                sprite: rankAtual === "A" ? [4, 1] : [2, 1]
            };
            salvar(`inventario_${personagem.nome}`, [itemDrop, ...inv]);
            const novoRegistro = {
                missaoId,
                titulo: missaoAtual?.titulo || `Vitória contra ${inimigoBase.nome}`,
                rank: rankAtual,
                inimigo: inimigoBase.nome,
                quando: new Date().toLocaleString("pt-BR"),
                recompensa: resultado.recompensas
            };
            salvar(registroChave, [novoRegistro, ...registros].slice(0, 80));
            localStorage.setItem("ultimoPersonagem", JSON.stringify(personagem));
            if (window.BancoPersonagens?.salvarPersonagem) {
                try { await BancoPersonagens.salvarPersonagem(personagem); } catch (erro) { console.warn("Batalha salva localmente.", erro); }
            }
            document.getElementById("status-text").textContent = "Recompensa salva";
            log(`Recompensa salva: +${resultado.recompensas.exp} EXP, +${resultado.recompensas.berris} berris e drop no inventário.`);
            window.RpgFeedback?.aviso?.("Batalha vencida", [`+${resultado.recompensas.exp} EXP`, `Drop: ${itemDrop.nome}`]);
            document.querySelector('[data-action="finish"]').disabled = true;
        }
        window.BatalhaRpg = {
            acao: usarAcao,
            estado: () => ({ ...state }),
            atualizar,
            resetar: resetarEstadoBatalha
        };
        function iniciar() {
            if (!personagem?.nome) { return; }
            resetarEstadoBatalha();
            document.getElementById("battle-brief").textContent = missaoAtual?.titulo ? `Encontro aberto pela missão: ${missaoAtual.titulo}. Derrote o inimigo e finalize a vitória para salvar recompensa.` : "Encontro livre para treinar combate, ganhar recompensa e gerar histórico.";
            document.getElementById("player-name").textContent = personagem.nome;
            document.getElementById("player-race").textContent = `${personagem.raca || personagem.raça || "Raça"} / ${personagem.classe || "Classe"}`;
            document.getElementById("enemy-name").textContent = inimigoBase.nome;
            document.getElementById("enemy-desc").textContent = inimigoBase.desc;
            document.getElementById("enemy-symbol").textContent = inimigoBase.simbolo;
            document.getElementById("mission-text").textContent = missaoAtual?.titulo ? missaoAtual.titulo : "Batalha livre";
            const recompensa = sistemas.recompensasAtividade("batalha", rankAtual, missaoAtual?.periodo || "diarias");
            document.getElementById("reward-text").textContent = `+${recompensa.exp} EXP / +${recompensa.berris} berris`;
            const inv = ler(`inventario_${personagem.nome}`, []);
            document.getElementById("item-text").textContent = `${inv.length} item(ns)`;
            if (personagem.imagemPersonagem || personagem.imagem) {
                document.getElementById("player-portrait").innerHTML = `<img src="${personagem.imagemPersonagem || personagem.imagem}" alt="">`;
            }
            log(`Combate iniciado contra ${inimigoBase.nome}.`);
            document.querySelectorAll("[data-action]").forEach((btn) => {
                btn.onclick = () => usarAcao(btn.dataset.action);
                if (btn.dataset.battleReady === "1") return;
                btn.dataset.battleReady = "1";
            });
            if (!document.getElementById("battle-hard-reset")) {
                document.body.insertAdjacentHTML("beforeend", '<button class="battle-debug-reset" type="button" id="battle-hard-reset">Reset combate</button>');
                document.getElementById("battle-hard-reset").addEventListener("click", () => usarAcao("reset"));
            }
            iniciarPhaser();
            atualizar();
        }
        iniciar();
    </script>
</body>
