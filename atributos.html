<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atributos - One Piece RPG</title>
<link rel="stylesheet" href="estilo.css">
<style>
html,body{min-height:100%;background:#030708}body.pagina-atributos{min-height:100vh;margin:0;overflow-x:hidden;color:#fff7df;background:linear-gradient(rgba(2,7,8,.72),rgba(2,7,8,.9)),url("fundo-login.jpeg") center/cover fixed}.atributos-jogo{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(14px,2.5vw,34px);background:radial-gradient(circle at 18% 14%,rgba(251,72,72,.15),transparent 28%),radial-gradient(circle at 78% 18%,rgba(72,213,255,.16),transparent 30%),radial-gradient(circle at 50% 84%,rgba(247,200,75,.18),transparent 34%)}.atributos-topo,.atributos-rodape{width:min(1240px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;text-shadow:0 2px 12px rgba(0,0,0,.85)}.atributos-topo p,.atributos-rodape span{margin:0;color:#d9e8d4;font-size:.9rem;font-weight:800}.atributos-topo h1{margin:0;color:#fff7df;font-size:clamp(1.8rem,4.5vw,3.4rem);line-height:1}.atributos-voltar{min-width:112px;padding:10px 15px;border:1px solid rgba(255,247,223,.34);border-radius:8px;color:#fff7df;background:rgba(3,8,10,.6);text-align:center;text-decoration:none;font-weight:900}.atributos-voltar:hover,.atributos-voltar:focus-visible{border-color:#ffe28a;background:rgba(247,200,75,.16);outline:none}.atributos-shell{width:min(1240px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(300px,.95fr) minmax(360px,1.2fr) minmax(280px,.85fr);gap:clamp(14px,2vw,22px);min-height:0}.painel-atributos,.radar-card,.perfil-atributos{border:1px solid rgba(255,247,223,.13);background:linear-gradient(180deg,rgba(7,13,15,.88),rgba(1,4,5,.88)),repeating-linear-gradient(0deg,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 8px);box-shadow:0 28px 80px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,247,223,.07);backdrop-filter:blur(8px)}.painel-atributos{display:grid;gap:10px;align-content:start;padding:clamp(14px,2vw,20px);max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-color:rgba(255,226,138,.72) rgba(0,0,0,.32)}.atributo-card{--cor-atributo:#ffe28a;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;min-height:106px;padding:10px;border:1px solid color-mix(in srgb,var(--cor-atributo) 45%,transparent);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--cor-atributo) 16%,transparent),rgba(3,8,10,.58)),rgba(0,0,0,.32);cursor:pointer;color:#fff7df}.atributo-card.ativo,.atributo-card:hover,.atributo-card:focus-visible{outline:none;box-shadow:0 0 22px color-mix(in srgb,var(--cor-atributo) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(-1px)}.atributo-card img{width:72px;height:72px;border-radius:8px;object-fit:cover;box-shadow:0 0 18px color-mix(in srgb,var(--cor-atributo) 38%,transparent)}.atributo-info{display:grid;gap:7px;min-width:0}.atributo-linha{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.atributo-linha strong{color:#fff7df;font-size:.98rem;overflow-wrap:anywhere}.atributo-linha b{color:var(--cor-atributo);font-size:1.08rem}.barra-atributo{height:10px;border:1px solid rgba(255,247,223,.1);border-radius:999px;background:rgba(0,0,0,.46);overflow:hidden}.barra-atributo i{display:block;width:var(--porcentagem);height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cor-atributo),#fff7df);box-shadow:0 0 14px var(--cor-atributo)}.atributo-info small{color:#d9e8d4;font-size:.76rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.radar-card{position:relative;display:grid;grid-template-rows:auto minmax(320px,1fr) auto;gap:12px;padding:clamp(14px,2vw,22px);overflow:hidden}.radar-card:before{content:"";position:absolute;inset:8%;background:conic-gradient(from -90deg,rgba(255,46,73,.28),rgba(198,255,0,.24),rgba(74,196,255,.24),rgba(126,90,255,.24),rgba(255,124,32,.24),rgba(255,65,40,.26),rgba(255,46,73,.28));filter:blur(42px);opacity:.72;pointer-events:none}.radar-topo,.radar-wrap,.radar-aviso{position:relative;z-index:1}.radar-topo{display:flex;justify-content:space-between;gap:14px;align-items:start}.radar-topo strong{display:block;color:#ffe28a;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}.radar-topo span{display:block;margin-top:4px;color:#d9e8d4;font-size:.9rem}.pontuacao-total{min-width:132px;padding:10px 12px;border:1px solid rgba(247,200,75,.28);border-radius:8px;background:rgba(0,0,0,.38);text-align:right}.pontuacao-total b{display:block;color:#fff7df;font-size:1.35rem}.radar-wrap{display:grid;place-items:center;min-height:0}.radar-svg{width:min(100%,560px);aspect-ratio:1;overflow:visible;filter:drop-shadow(0 18px 32px rgba(0,0,0,.56))}.radar-grade{fill:rgba(255,255,255,.015);stroke:rgba(255,247,223,.18);stroke-width:1}.radar-eixo{stroke-width:2.2;opacity:.78}.radar-area{fill:rgba(255,247,223,.12);stroke:rgba(255,247,223,.54);stroke-width:2}.radar-segmento{stroke-width:4;stroke-linecap:round;opacity:.9}.radar-ponto{stroke:#fff7df;stroke-width:2}.radar-label{fill:#fff7df;font-size:14px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.76);stroke-width:4px;stroke-linejoin:round}.radar-aviso{padding:12px;border:1px solid rgba(255,247,223,.12);color:#d9e8d4;background:rgba(0,0,0,.34);font-size:.9rem;line-height:1.35}.perfil-atributos{display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(14px,2vw,20px);min-height:0}.perfil-topo{display:grid;gap:4px;text-align:center}.perfil-topo span{color:#ffe28a;font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.perfil-topo strong{color:#fff7df;font-size:clamp(1.25rem,2.4vw,1.9rem);line-height:1.05;overflow-wrap:anywhere}.atributo-destaque{display:grid;align-content:center;gap:14px;min-height:0}.atributo-destaque img{width:min(100%,260px);margin:0 auto;border-radius:8px;box-shadow:0 0 34px color-mix(in srgb,var(--cor-ativo,#ffe28a) 48%,transparent)}.atributo-destaque h2{margin:0;color:var(--cor-ativo,#ffe28a);font-size:clamp(1.35rem,3vw,2.1rem);text-align:center}.atributo-destaque p{margin:0;color:#d9e8d4;font-size:.92rem;line-height:1.45;text-align:center}.status-personagem-atributos{display:grid;gap:8px;padding:12px;border:1px solid rgba(255,247,223,.12);background:rgba(0,0,0,.32)}.status-personagem-atributos div{display:flex;justify-content:space-between;gap:12px;color:#d9e8d4;font-size:.86rem}.status-personagem-atributos b{color:#fff7df;text-align:right}@media(max-width:1100px){.atributos-shell{grid-template-columns:1fr}.painel-atributos{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}}@media(max-width:620px){.atributos-topo,.atributos-rodape,.radar-topo{align-items:stretch;flex-direction:column}.painel-atributos{grid-template-columns:1fr}.atributo-card{grid-template-columns:64px 1fr}.atributo-card img{width:64px;height:64px}}
</style>
</head>
<body class="pagina-atributos">
<audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
<main class="atributos-jogo">
<header class="atributos-topo"><div><p id="atributos-personagem-status">Carregando personagem...</p><h1>Atributos</h1></div><a class="atributos-voltar" href="lobby.html">Voltar</a></header>
<section class="atributos-shell" aria-label="Atributos do personagem">
<aside class="painel-atributos" id="lista-atributos"></aside>
<section class="radar-card" aria-label="Radar de atributos"><div class="radar-topo"><div><strong>Radar de Poder</strong><span>Leitura cromática dos atributos ativos</span></div><div class="pontuacao-total"><span>Total</span><b id="atributos-total">0</b></div></div><div class="radar-wrap" id="radar-wrap"></div><div class="radar-aviso" id="atributos-aviso">Limite máximo do RPG: 15.000 pontos totais.</div></section>
<aside class="perfil-atributos" aria-label="Detalhe do atributo"><div class="perfil-topo"><span>Personagem</span><strong id="nome-personagem">Sem personagem</strong></div><div class="atributo-destaque" id="atributo-destaque"></div><div class="status-personagem-atributos"><div><span>Classe</span><b id="classe-personagem">---</b></div><div><span>Especialidade</span><b id="profissao-personagem">---</b></div><div><span>Organização</span><b id="organizacao-personagem">---</b></div><div><span>Saldo livre</span><b id="saldo-atributos">0</b></div></div></aside>
</section>
<footer class="atributos-rodape"><span>Axis: cores individuais</span><span>Back: lobby</span></footer>
</main>
<script src="musica-fundo.js"></script>
<script>
const personagem=JSON.parse(localStorage.getItem("ultimoPersonagem")||"null");const limiteTotalAtributos=15000;let atributoAtivo="forca";const atributosConfig=[{chave:"forca",nome:"Força Vital",cor:"#ff2e49",imagem:"assets/img/atributos/forca-vital.webp",descricao:"Energia de sobrevivência, fôlego de combate e capacidade de continuar lutando quando o corpo já pediu trégua."},{chave:"velocidade",nome:"Agilidade",cor:"#c6ff00",imagem:"assets/img/atributos/agilidade.webp",descricao:"Explosão de movimento, reflexo, esquiva e velocidade para atravessar o campo antes que o inimigo entenda o golpe."},{chave:"resistencia",nome:"Resistência",cor:"#4ac4ff",imagem:"assets/img/atributos/resistencia.webp",descricao:"Defesa bruta, armadura natural, absorção de impacto e firmeza para segurar ataques pesados."},{chave:"inteligencia",nome:"Força Mental",cor:"#7e5aff",imagem:"assets/img/atributos/forca-mental.webp",descricao:"Leitura tática, concentração, estratégia e presença mental para virar uma luta no detalhe certo."},{chave:"vontade",nome:"Determinação",cor:"#ff7c20",imagem:"assets/img/atributos/determinacao.webp",descricao:"Vontade de ferro, pressão espiritual, coragem e impulso para avançar mesmo contra uma maré impossível."},{chave:"sorte",nome:"Força",cor:"#ff4128",imagem:"assets/img/atributos/forca.webp",descricao:"Potência física, impacto direto, domínio muscular e peso real por trás de cada golpe."}];
const listaAtributos=document.getElementById("lista-atributos"),radarWrap=document.getElementById("radar-wrap"),destaque=document.getElementById("atributo-destaque"),totalEl=document.getElementById("atributos-total"),avisoEl=document.getElementById("atributos-aviso"),saldoEl=document.getElementById("saldo-atributos"),statusEl=document.getElementById("atributos-personagem-status"),nomePersonagem=document.getElementById("nome-personagem"),classePersonagem=document.getElementById("classe-personagem"),profissaoPersonagem=document.getElementById("profissao-personagem"),organizacaoPersonagem=document.getElementById("organizacao-personagem");
function escaparHtml(t){return String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c])}function obterOrganizacao(){return personagem?.organizacao||personagem?.organização||personagem?.organization||"---"}function obterAtributos(){if(!personagem)return{};const chave=`atributos_${personagem.nome}`;return JSON.parse(localStorage.getItem(chave)||JSON.stringify({forca:85,velocidade:78,resistencia:82,inteligencia:70,vontade:95,sorte:60}))}function formatarNumero(v){return Number(v||0).toLocaleString("pt-BR")}function valorAtributo(attrs,chave){return Math.max(0,Number(attrs[chave]||0))}function selecionarAtributo(chave){atributoAtivo=chave;renderizar()}
function renderizarLista(attrs){listaAtributos.innerHTML=atributosConfig.map(a=>{const valor=valorAtributo(attrs,a.chave),pct=Math.min(100,valor/limiteTotalAtributos*100);return `<button class="atributo-card ${atributoAtivo===a.chave?"ativo":""}" type="button" data-atributo="${a.chave}" style="--cor-atributo:${a.cor};--porcentagem:${pct}%"><img src="${a.imagem}" alt=""><span class="atributo-info"><span class="atributo-linha"><strong>${escaparHtml(a.nome)}</strong><b>${formatarNumero(valor)}</b></span><span class="barra-atributo"><i></i></span><small>${escaparHtml(a.descricao)}</small></span></button>`}).join("");listaAtributos.querySelectorAll("[data-atributo]").forEach(b=>b.addEventListener("click",()=>selecionarAtributo(b.dataset.atributo)))}
function renderizarRadar(attrs){const centro=260,raio=166,aneis=[.25,.5,.75,1];const pontos=atributosConfig.map((a,i)=>{const ang=(-90+360/atributosConfig.length*i)*Math.PI/180,valor=valorAtributo(attrs,a.chave),dist=Math.min(valor/limiteTotalAtributos,1)*raio;return{...a,valor,x:centro+Math.cos(ang)*dist,y:centro+Math.sin(ang)*dist,eixoX:centro+Math.cos(ang)*raio,eixoY:centro+Math.sin(ang)*raio,labelX:centro+Math.cos(ang)*(raio+55),labelY:centro+Math.sin(ang)*(raio+55)}});function pontosAnel(s){return atributosConfig.map((_,i)=>{const ang=(-90+360/atributosConfig.length*i)*Math.PI/180;return`${centro+Math.cos(ang)*raio*s},${centro+Math.sin(ang)*raio*s}`}).join(" ")}const poligono=pontos.map(p=>`${p.x},${p.y}`).join(" ");const segmentos=pontos.map((p,i)=>{const n=pontos[(i+1)%pontos.length];return`<line class="radar-segmento" x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${p.cor}"></line>`}).join("");radarWrap.innerHTML=`<svg class="radar-svg" viewBox="0 0 520 520" role="img" aria-label="Radar colorido de atributos">${aneis.map(a=>`<polygon class="radar-grade" points="${pontosAnel(a)}"></polygon>`).join("")}${pontos.map(p=>`<line class="radar-eixo" x1="${centro}" y1="${centro}" x2="${p.eixoX}" y2="${p.eixoY}" stroke="${p.cor}"></line>`).join("")}<polygon class="radar-area" points="${poligono}"></polygon>${segmentos}${pontos.map(p=>`<circle class="radar-ponto" cx="${p.x}" cy="${p.y}" r="7" fill="${p.cor}"></circle>`).join("")}${pontos.map(p=>`<text class="radar-label" x="${p.labelX}" y="${p.labelY}">${escaparHtml(p.nome)}</text>`).join("")}</svg>`}
function renderizarDestaque(attrs){const a=atributosConfig.find(i=>i.chave===atributoAtivo)||atributosConfig[0],valor=valorAtributo(attrs,a.chave);destaque.style.setProperty("--cor-ativo",a.cor);destaque.innerHTML=`<img src="${a.imagem}" alt=""><h2>${escaparHtml(a.nome)}</h2><p><strong style="color:${a.cor}">${formatarNumero(valor)} pontos</strong></p><p>${escaparHtml(a.descricao)}</p>`}function renderizarPerfil(total){if(!personagem){statusEl.textContent="Nenhum personagem ativo";nomePersonagem.textContent="Sem personagem";return}statusEl.textContent=`${personagem.classe||"Classe"} / ${personagem.profissao||"Especialidade"}`;nomePersonagem.textContent=personagem.nome||"Personagem";classePersonagem.textContent=personagem.classe||"---";profissaoPersonagem.textContent=personagem.profissao||"---";organizacaoPersonagem.textContent=obterOrganizacao();saldoEl.textContent=formatarNumero(Math.max(0,limiteTotalAtributos-total))}function renderizar(){const attrs=obterAtributos(),total=atributosConfig.reduce((s,a)=>s+valorAtributo(attrs,a.chave),0),restante=Math.max(0,limiteTotalAtributos-total),extra=total>limiteTotalAtributos?" Total acima do limite.":"";totalEl.textContent=formatarNumero(total);avisoEl.textContent=`Limite máximo do RPG: ${formatarNumero(limiteTotalAtributos)} pontos totais. Restante disponível: ${formatarNumero(restante)}.${extra}`;renderizarPerfil(total);renderizarLista(attrs);renderizarRadar(attrs);renderizarDestaque(attrs)}window.addEventListener("storage",e=>{if(e.key==="ultimoPersonagem"||e.key===`atributos_${personagem?.nome}`)window.location.reload()});renderizar();
</script>
</body>
</html>
