<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atributos - One Piece RPG</title><link rel="stylesheet" href="estilo.css"><style>html,body{margin:0;min-height:100%;background:#030708;color:#fff7df}.video-fundo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.42) saturate(1.2)}.app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(14px,2.5vw,34px);background:radial-gradient(circle at 18% 14%,rgba(251,72,72,.15),transparent 28%),radial-gradient(circle at 78% 18%,rgba(72,213,255,.16),transparent 30%),radial-gradient(circle at 50% 84%,rgba(247,200,75,.18),transparent 34%)}header,footer{width:min(1240px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;text-shadow:0 2px 12px #000}h1{margin:0;font-size:clamp(1.8rem,4.5vw,3.4rem);line-height:1}p{margin:0;color:#d9e8d4}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:end}.back,.dist{min-width:112px;padding:10px 15px;border:1px solid rgba(255,247,223,.34);border-radius:8px;color:#fff7df;background:rgba(3,8,10,.6);text-align:center;text-decoration:none;font-weight:900}.dist{color:#1d1c15;border-color:rgba(255,226,138,.75);background:linear-gradient(180deg,#ffe28a,#f7c84b);cursor:pointer;text-transform:uppercase}.shell{width:min(1240px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(300px,.95fr) minmax(360px,1.2fr) minmax(280px,.85fr);gap:clamp(14px,2vw,22px);min-height:0}.panel,.radar,.profile{border:1px solid rgba(255,247,223,.13);background:linear-gradient(180deg,rgba(7,13,15,.88),rgba(1,4,5,.88)),repeating-linear-gradient(0deg,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 8px);box-shadow:0 28px 80px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,247,223,.07);backdrop-filter:blur(8px)}.panel{display:grid;gap:10px;align-content:start;padding:clamp(14px,2vw,20px);max-height:calc(100vh - 170px);overflow:auto}.card{--c:#ffe28a;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;min-height:106px;padding:10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(3,8,10,.58)),rgba(0,0,0,.32);cursor:pointer}.card.active,.card:hover{box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-1px)}.card img{width:72px;height:72px;border-radius:8px;object-fit:cover;box-shadow:0 0 18px color-mix(in srgb,var(--c) 38%,transparent)}.info{display:grid;gap:7px}.line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.line b{color:var(--c);font-size:1.08rem}.bar{height:10px;border:1px solid rgba(255,247,223,.1);border-radius:999px;background:rgba(0,0,0,.46);overflow:hidden}.bar i{display:block;width:var(--p);height:100%;background:linear-gradient(90deg,var(--c),#fff7df);box-shadow:0 0 14px var(--c)}small{color:#d9e8d4}.up{display:none;gap:8px;align-items:center;justify-content:space-between}.mode .up{display:flex}.up button{min-height:30px;padding:0 10px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:8px;color:#fff7df;background:rgba(0,0,0,.38);font-weight:900;cursor:pointer}.up button:disabled{opacity:.45;cursor:not-allowed}.radar{position:relative;display:grid;grid-template-rows:auto minmax(320px,1fr) auto;gap:12px;padding:clamp(14px,2vw,22px);overflow:hidden}.radar:before{content:"";position:absolute;inset:8%;background:conic-gradient(from -90deg,rgba(255,46,73,.28),rgba(198,255,0,.24),rgba(74,196,255,.24),rgba(126,90,255,.24),rgba(255,124,32,.24),rgba(255,65,40,.26));filter:blur(42px);opacity:.72}.rtop,.wrap,.notice{position:relative;z-index:1}.rtop{display:flex;justify-content:space-between;gap:14px}.rtop strong,.ptop span{display:block;color:#ffe28a;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.total{min-width:132px;padding:10px 12px;border:1px solid rgba(247,200,75,.28);border-radius:8px;background:rgba(0,0,0,.38);text-align:right}.total b{display:block;font-size:1.35rem}.wrap{display:grid;place-items:center}.svg{width:min(100%,560px);aspect-ratio:1;overflow:visible;filter:drop-shadow(0 18px 32px #000)}.grade{fill:rgba(255,255,255,.015);stroke:rgba(255,247,223,.18)}.axis{stroke-width:2.2;opacity:.78}.area{fill:rgba(255,247,223,.12);stroke:rgba(255,247,223,.54);stroke-width:2}.seg{stroke-width:4;stroke-linecap:round}.dot{stroke:#fff7df;stroke-width:2}.label{fill:#fff7df;font-size:14px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.76);stroke-width:4px}.notice{padding:12px;border:1px solid rgba(255,247,223,.12);background:rgba(0,0,0,.34);color:#d9e8d4}.profile{display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(14px,2vw,20px)}.ptop{text-align:center}.ptop strong{font-size:clamp(1.25rem,2.4vw,1.9rem)}.focus{display:grid;align-content:center;gap:14px}.focus img{width:min(100%,260px);margin:0 auto;border-radius:8px;box-shadow:0 0 34px color-mix(in srgb,var(--ca,#ffe28a) 48%,transparent)}.focus h2{margin:0;color:var(--ca,#ffe28a);text-align:center}.focus p{text-align:center}.stats{display:grid;gap:8px;padding:12px;border:1px solid rgba(255,247,223,.12);background:rgba(0,0,0,.32)}.stats div{display:flex;justify-content:space-between;gap:12px;color:#d9e8d4}.stats b{text-align:right}@media(max-width:1100px){.shell{grid-template-columns:1fr}.panel{grid-template-columns:repeat(2,1fr);max-height:none}}@media(max-width:620px){header,footer,.rtop{align-items:stretch;flex-direction:column}.panel{grid-template-columns:1fr}.card{grid-template-columns:64px 1fr}.card img{width:64px;height:64px}.actions{width:100%}.back,.dist{flex:1 1 180px}}</style></head><body><video class="video-fundo" autoplay muted loop playsinline><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header><div><p id="status">Carregando personagem...</p><h1>Atributos</h1></div><div class="actions"><button class="dist" id="dist" type="button">Distribuir Atributos</button><a class="back" href="lobby.html">Voltar ao Lobby</a></div></header><section class="shell"><aside class="panel" id="list"></aside><section class="radar"><div class="rtop"><div><strong>Radar de Poder</strong><p>Leitura cromática dos atributos ativos</p></div><div class="total"><span>Total</span><b id="total">0</b></div></div><div class="wrap" id="wrap"></div><div class="notice" id="notice">Limite máximo do RPG: 15.000 pontos totais.</div></section><aside class="profile"><div class="ptop"><span>Personagem</span><strong id="name">Sem personagem</strong></div><div class="focus" id="focus"></div><div class="stats"><div><span>Classe</span><b id="classe">---</b></div><div><span>Especialidade</span><b id="prof">---</b></div><div><span>Organização</span><b id="org">---</b></div><div><span>Saldo livre</span><b id="saldo">0</b></div></div></aside></section><footer><span>Axis: cores individuais</span><span>Back: lobby</span></footer></main><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null'),limit=15000;let active='forca',mode=false;const cfg=[['forca','Força Vital','#ff2e49','assets/img/atributos/forca-vital.webp','Energia de sobrevivência, fôlego de combate e capacidade de continuar lutando.'],['velocidade','Agilidade','#c6ff00','assets/img/atributos/agilidade.webp','Explosão de movimento, reflexo, esquiva e velocidade.'],['resistencia','Resistência','#4ac4ff','assets/img/atributos/resistencia.webp','Defesa bruta, absorção de impacto e firmeza.'],['inteligencia','Força Mental','#7e5aff','assets/img/atributos/forca-mental.webp','Leitura tática, concentração e estratégia.'],['vontade','Determinação','#ff7c20','assets/img/atributos/determinacao.webp','Vontade de ferro, pressão espiritual e coragem.'],['sorte','Força','#ff4128','assets/img/atributos/forca.webp','Potência física e impacto direto.']];function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(v){return Number(v||0).toLocaleString('pt-BR')}function attrs(){if(!personagem)return{};return JSON.parse(localStorage.getItem(`atributos_${personagem.nome}`)||'{"forca":85,"velocidade":78,"resistencia":82,"inteligencia":70,"vontade":95,"sorte":60}')}function save(a){if(personagem)localStorage.setItem(`atributos_${personagem.nome}`,JSON.stringify(a))}function val(a,k){return Math.max(0,Number(a[k]||0))}function renderList(a){let prog=RpgSistemas.obterProgresso(personagem);list.innerHTML=cfg.map(x=>{let v=val(a,x[0]),p=Math.min(100,v/limit*100);return`<div class="card ${active==x[0]?'active':''}" data-a="${x[0]}" style="--c:${x[2]};--p:${p}%"><img src="${x[3]}" alt=""><span class="info"><span class="line"><strong>${x[1]}</strong><b>${fmt(v)}</b></span><span class="bar"><i></i></span><small>${x[4]}</small><span class="up"><small>+10 custa 1 ponto</small><button data-up="${x[0]}" ${prog.pontosAtributo<=0?'disabled':''}>Adicionar</button></span></span></div>`}).join('');list.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{active=b.dataset.a;render()});list.querySelectorAll('[data-up]').forEach(b=>b.onclick=e=>{e.stopPropagation();add(b.dataset.up)})}function radar(a){let c=260,r=166,rings=[.25,.5,.75,1],pts=cfg.map((x,i)=>{let ang=(-90+360/cfg.length*i)*Math.PI/180,v=val(a,x[0]),d=Math.min(v/limit,1)*r;return{n:x[1],cor:x[2],x:c+Math.cos(ang)*d,y:c+Math.sin(ang)*d,ex:c+Math.cos(ang)*r,ey:c+Math.sin(ang)*r,lx:c+Math.cos(ang)*(r+55),ly:c+Math.sin(ang)*(r+55)}});let ring=s=>cfg.map((_,i)=>{let ang=(-90+360/cfg.length*i)*Math.PI/180;return`${c+Math.cos(ang)*r*s},${c+Math.sin(ang)*r*s}`}).join(' '),poly=pts.map(p=>`${p.x},${p.y}`).join(' ');wrap.innerHTML=`<svg class="svg" viewBox="0 0 520 520">${rings.map(x=>`<polygon class="grade" points="${ring(x)}"></polygon>`).join('')}${pts.map(p=>`<line class="axis" x1="${c}" y1="${c}" x2="${p.ex}" y2="${p.ey}" stroke="${p.cor}"></line>`).join('')}<polygon class="area" points="${poly}"></polygon>${pts.map((p,i)=>{let n=pts[(i+1)%pts.length];return`<line class="seg" x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${p.cor}"></line>`}).join('')}${pts.map(p=>`<circle class="dot" cx="${p.x}" cy="${p.y}" r="7" fill="${p.cor}"></circle><text class="label" x="${p.lx}" y="${p.ly}">${esc(p.n)}</text>`).join('')}</svg>`}function focusBox(a){let x=cfg.find(i=>i[0]==active)||cfg[0],v=val(a,x[0]);focus.style.setProperty('--ca',x[2]);focus.innerHTML=`<img src="${x[3]}" alt=""><h2>${x[1]}</h2><p><b style="color:${x[2]}">${fmt(v)} pontos</b></p><p>${x[4]}</p>`}function add(k){if(!personagem)return;let p=RpgSistemas.obterProgresso(personagem);if(p.pontosAtributo<=0)return;let a=attrs(),sum=cfg.reduce((s,x)=>s+val(a,x[0]),0);if(sum+10>limit)return;a[k]=val(a,k)+10;p.pontosAtributo-=1;save(a);RpgSistemas.salvarProgresso(personagem,p);render()}function topInfo(sum){if(!personagem){status.textContent='Nenhum personagem ativo';name.textContent='Sem personagem';return}let p=RpgSistemas.obterProgresso(personagem);status.textContent=`${personagem.classe||'Classe'} / ${personagem.profissao||'Especialidade'}`;name.textContent=personagem.nome||'Personagem';classe.textContent=personagem.classe||'---';prof.textContent=personagem.profissao||'---';org.textContent=personagem.organizacao||personagem.organization||'---';saldo.textContent=`${fmt(p.pontosAtributo)} pts livres`}function render(){let a=attrs(),sum=cfg.reduce((s,x)=>s+val(a,x[0]),0),rest=Math.max(0,limit-sum);total.textContent=fmt(sum);notice.textContent=`Limite máximo do RPG: ${fmt(limit)} pontos totais. Restante disponível: ${fmt(rest)}.`;topInfo(sum);renderList(a);radar(a);focusBox(a);document.body.classList.toggle('mode',mode);dist.textContent=mode?'Fechar Distribuição':'Distribuir Atributos'}dist.onclick=()=>{mode=!mode;render()};render()</script></body></html>
