<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game23">
    <style>
        html, body { min-height: 100%; margin: 0; background: #020708; color: #fff7df; overflow: hidden; }
        body { font-family: Arial, sans-serif; }
        .video-fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.22) saturate(1.25); z-index: 0; }
        .world-app { position: relative; z-index: 2; width: 100vw; height: 100svh; display: grid; grid-template-rows: 1fr; padding: 10px; box-sizing: border-box; }
        .world-top { display: none; }
        .world-top small { color: #90ff00; font-weight: 1000; letter-spacing: .14em; text-transform: uppercase; }
        .world-top h1 { margin: 2px 0 0; font: 1000 clamp(1rem, 2vw, 1.45rem)/.95 "Segoe UI Black","Arial Black",Impact,sans-serif; text-transform: uppercase; text-shadow: 0 3px 0 #210b08, 0 10px 20px rgba(0,0,0,.52); }
        .world-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: end; }
        .world-actions a, .world-actions button { min-height: 30px; padding: 0 10px; border: 1px solid rgba(255,226,138,.42); border-radius: 8px; color: #fff7df; background: rgba(4,12,13,.72); font-size: .68rem; font-weight: 1000; text-transform: uppercase; text-decoration: none; cursor: pointer; }
        .world-actions .primary { color: #07100d; background: linear-gradient(90deg,#90ff00,#ffe28a); }
        .world-frame { position: relative; min-height: 0; border: 1px solid rgba(54,224,255,.20); border-radius: 8px; background: radial-gradient(circle at 50% 35%, rgba(54,224,255,.12), transparent 42%), rgba(1,5,7,.86); box-shadow: inset 0 0 70px rgba(0,0,0,.42), 0 24px 70px rgba(0,0,0,.5); overflow: hidden; }
        #world-canvas { position: absolute; inset: 0; }
        #world-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
        .world-hud { position: absolute; left: 14px; top: 14px; z-index: 3; display: grid; gap: 8px; width: min(310px, calc(100% - 28px)); pointer-events: none; }
        .world-card { padding: 9px 10px; border: 1px solid rgba(255,226,138,.22); border-radius: 8px; background: rgba(3,8,10,.68); box-shadow: 0 14px 34px rgba(0,0,0,.28); backdrop-filter: blur(8px); }
        .world-card strong { display: block; color: #ffe28a; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }
        .world-card span { display: block; margin-top: 4px; color: #d9e8d4; font-size: .86rem; font-weight: 800; line-height: 1.35; }
        .world-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .world-stat { padding: 8px; border: 1px solid rgba(144,255,0,.18); border-radius: 8px; background: rgba(144,255,0,.06); }
        .world-stat b { display: block; color: #90ff00; font-size: 1rem; }
        .world-stat small { color: #d9e8d4; font-weight: 900; text-transform: uppercase; }
        .world-touch { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: none; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 5px; pointer-events: auto; }
        .world-touch button { border: 1px solid rgba(255,226,138,.34); border-radius: 8px; background: rgba(3,8,10,.72); color: #ffe28a; font-weight: 1000; }
        .world-touch [data-dir="up"] { grid-column: 2; }
        .world-touch [data-dir="left"] { grid-column: 1; grid-row: 2; }
        .world-touch [data-dir="action"] { grid-column: 2; grid-row: 2; color: #07100d; background: linear-gradient(90deg,#90ff00,#ffe28a); }
        .world-touch [data-dir="right"] { grid-column: 3; grid-row: 2; }
        .world-touch [data-dir="down"] { grid-column: 2; grid-row: 3; }
        .world-log { position: absolute; right: 14px; bottom: 14px; z-index: 4; width: min(360px, calc(100% - 28px)); max-height: 118px; overflow: auto; display: grid; gap: 5px; pointer-events: none; scrollbar-width: none; }
        .world-log::-webkit-scrollbar { width: 0; height: 0; }
        .world-log p { margin: 0; padding: 7px 9px; border-left: 3px solid #36e0ff; background: rgba(3,8,10,.66); color: #d9e8d4; font-size: .82rem; font-weight: 800; box-shadow: 0 10px 28px rgba(0,0,0,.22); }
        .world-prompt { position: absolute; left: 50%; bottom: 18px; z-index: 7; transform: translateX(-50%); min-width: min(440px, calc(100% - 28px)); padding: 10px 12px; border: 1px solid rgba(255,226,138,.42); border-radius: 8px; background: linear-gradient(90deg, rgba(5,12,12,.86), rgba(19,28,22,.82)); color: #fff7df; text-align: center; font-weight: 1000; text-transform: uppercase; letter-spacing: .06em; box-shadow: 0 18px 42px rgba(0,0,0,.38); backdrop-filter: blur(10px); pointer-events: none; }
        .world-prompt kbd { display: inline-grid; place-items: center; min-width: 28px; min-height: 24px; margin-right: 8px; border: 1px solid rgba(144,255,0,.48); border-radius: 6px; background: rgba(144,255,0,.12); color: #90ff00; font: 1000 .78rem Arial,sans-serif; }
        body.mundo-jogavel #rpg-hud-global,
        body.mundo-jogavel #rpg-quest-dock { display: none !important; }
        body.mundo-jogavel #rpg-minimap { top: 86px !important; right: 14px !important; width: 92px !important; height: 92px !important; opacity: .58 !important; }
        body.mundo-jogavel #rpg-page-rail { display: none !important; }
        body.mundo-jogavel #rpg-save-status { opacity: .70 !important; }
        body.mundo-jogavel #rpg-sys-button { opacity: .72 !important; }
        .world-loading { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: radial-gradient(circle, rgba(255,226,138,.15), rgba(1,5,7,.92) 62%); color: #ffe28a; font: 1000 1rem Arial,sans-serif; letter-spacing: .12em; text-transform: uppercase; }
        @media(max-width: 760px) {
            .world-app { padding: 7px; padding-top: 52px; }
            .world-top { left: 8px; right: 8px; top: 8px; grid-template-columns: 1fr auto; }
            .world-top small { display: none; }
            .world-top h1 { font-size: 1rem; }
            .world-actions { justify-content: start; }
            .world-actions a:not(.primary), .world-actions button { display: none; }
            .world-touch { display: grid; }
            .world-log { right: 8px; left: auto; bottom: 8px; width: min(280px, calc(100% - 116px)); max-height: 96px; }
            .world-hud { left: 8px; top: 58px; width: min(330px, calc(100% - 16px)); }
            .world-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            body.mundo-jogavel #rpg-minimap { display: none !important; }
        }
    </style>
</head>
<body class="mundo-jogavel">
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="world-app">
        <header class="world-top">
            <div>
                <small>World Mode / Phaser</small>
                <h1>Entrar no Mundo</h1>
            </div>
            <nav class="world-actions" aria-label="Ações do mundo">
                <a href="lobby.html">Lobby</a>
                <a href="aventura.html">Mapa clássico</a>
                <a class="primary" href="batalha.html" id="battle-link">Batalha</a>
                <button type="button" id="world-reset">Reset mundo</button>
            </nav>
        </header>
        <section class="world-frame" aria-label="Cena jogável do mundo">
            <div id="world-canvas"></div>
            <div class="world-loading" id="world-loading">Inicializando cena jogável</div>
            <aside class="world-hud">
                <div class="world-card">
                    <strong id="world-name">Personagem</strong>
                    <span id="world-quest">Explore o mar, chegue perto dos pontos e use E/A para interagir.</span>
                </div>
                <div class="world-stats">
                    <div class="world-stat"><b id="world-level">1</b><small>Nível</small></div>
                    <div class="world-stat"><b id="world-berris">0</b><small>Berris</small></div>
                    <div class="world-stat"><b id="world-fame">0</b><small>Fama</small></div>
                </div>
            </aside>
            <div class="world-touch" aria-label="Controles mobile">
                <button type="button" data-dir="up">↑</button>
                <button type="button" data-dir="left">←</button>
                <button type="button" data-dir="action">A</button>
                <button type="button" data-dir="right">→</button>
                <button type="button" data-dir="down">↓</button>
            </div>
            <div class="world-prompt" id="world-prompt" hidden></div>
            <div class="world-log" id="world-log"></div>
        </section>
    </main>
    <script src="musica-fundo.js?v=20260619-game23"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg10"></script>
    <script>
        const personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const sistemas = window.RpgSistemas || {
            obterProgresso: (p) => p?.progressoRpg || { nivel: 1, berris: 0 },
            normalizar: (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        };
        const progresso = sistemas.obterProgresso(personagem || {});
        const nomeNormalizado = sistemas.normalizar(personagem?.nome || "jogador");
        const estadoMundo = JSON.parse(localStorage.getItem("rpg_world_" + nomeNormalizado) || "null") || {
            x: 980,
            y: 760,
            fame: 0,
            chests: [],
            npcs: [],
            battles: 0
        };
        const teclasMobile = { up: false, down: false, left: false, right: false, action: false };
        const logEl = document.getElementById("world-log");
        const loadingEl = document.getElementById("world-loading");
        const questEl = document.getElementById("world-quest");
        const promptEl = document.getElementById("world-prompt");
        const battleLink = document.getElementById("battle-link");
        const logState = { texto: "", vezes: 0 };
        document.getElementById("world-name").textContent = personagem?.nome || "Sem personagem";
        document.getElementById("world-level").textContent = progresso.nivel || 1;
        document.getElementById("world-berris").textContent = Number(progresso.berris || 0).toLocaleString("pt-BR");
        document.getElementById("world-fame").textContent = estadoMundo.fame || 0;

        function salvarMundo() {
            localStorage.setItem("rpg_world_" + nomeNormalizado, JSON.stringify(estadoMundo));
        }

        function log(texto) {
            if (logState.texto === texto && logEl.firstElementChild) {
                logState.vezes += 1;
                logEl.firstElementChild.textContent = texto + " x" + logState.vezes;
                return;
            }
            logState.texto = texto;
            logState.vezes = 1;
            const item = document.createElement("p");
            item.textContent = texto;
            logEl.prepend(item);
            [...logEl.children].slice(4).forEach((child) => child.remove());
        }

        function setPrompt(texto) {
            if (!texto) {
                promptEl.hidden = true;
                promptEl.innerHTML = "";
                return;
            }
            promptEl.hidden = false;
            promptEl.innerHTML = '<kbd>E</kbd>' + texto;
        }

        function carregarScript(src, id) {
            return new Promise((resolve, reject) => {
                if (document.getElementById(id)) { resolve(); return; }
                const script = document.createElement("script");
                script.id = id;
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error("Falha ao carregar " + src));
                document.head.appendChild(script);
            });
        }

        function atualizarObjetivo(texto) {
            questEl.textContent = texto;
            if (window.RpgFeedback?.aviso) window.RpgFeedback.aviso("Mundo", texto);
        }

        function recompensar(tipo, valor) {
            if (!personagem?.nome) return;
            const chaveInv = `inventario_${personagem.nome}`;
            const inv = JSON.parse(localStorage.getItem(chaveInv) || "[]");
            if (tipo === "bau") {
                inv.unshift({
                    id: Date.now(),
                    nome: "Baú de rota marítima",
                    tipo: "tesouros",
                    quantidade: 1,
                    raridade: "Raro",
                    descricao: "Encontrado explorando o mundo jogável.",
                    origem: "Mundo",
                    adicionadoEm: new Date().toLocaleString("pt-BR"),
                    sprite: [2, 1]
                });
                localStorage.setItem(chaveInv, JSON.stringify(inv.slice(0, 120)));
                atualizarObjetivo("Tesouro coletado. O item foi enviado para o inventário.");
            }
            estadoMundo.fame += valor;
            document.getElementById("world-fame").textContent = estadoMundo.fame;
            salvarMundo();
        }

        async function iniciarWorld() {
            try {
                await carregarScript("assets/vendor/phaser/phaser.min.js", "phaser-world").catch(() => carregarScript("https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js", "phaser-world-cdn"));
                if (!window.Phaser) throw new Error("Phaser indisponível");
                const parent = document.getElementById("world-canvas");
                const config = {
                    type: Phaser.AUTO,
                    parent,
                    width: Math.max(640, parent.clientWidth),
                    height: Math.max(420, parent.clientHeight),
                    backgroundColor: "#041419",
                    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
                    physics: { default: "arcade", arcade: { debug: false } },
                    scene: { preload, create, update }
                };
                new Phaser.Game(config);
            } catch (erro) {
                loadingEl.textContent = "Phaser offline. Abra com internet para jogar o mundo.";
                console.warn(erro);
            }
        }

        let player, cursors, keys, npcs, chests, threats, cameraText, targetMarker, nearestInteractable = null, actionCooldown = 0;
        let moveTarget = null;
        const worldSize = { w: 2200, h: 1600 };

        function preload() {
        }

        function create() {
            loadingEl.remove();
            this.physics.world.setBounds(0, 0, worldSize.w, worldSize.h);
            const ocean = this.add.graphics();
            ocean.fillGradientStyle(0x062e45, 0x062e45, 0x041827, 0x03101a, 1);
            ocean.fillRect(0, 0, worldSize.w, worldSize.h);
            for (let i = 0; i < 120; i += 1) {
                const x = Math.random() * worldSize.w;
                const y = Math.random() * worldSize.h;
                ocean.lineStyle(1 + Math.random() * 2, i % 3 ? 0x36e0ff : 0xffe28a, i % 3 ? .08 : .05);
                ocean.beginPath();
                ocean.arc(x, y, 40 + Math.random() * 130, Math.random() * Math.PI, Math.random() * Math.PI + Math.PI);
                ocean.strokePath();
            }
            const grid = this.add.graphics();
            grid.lineStyle(1, 0x36e0ff, .09);
            for (let x = 0; x < worldSize.w; x += 96) grid.lineBetween(x, 0, x, worldSize.h);
            for (let y = 0; y < worldSize.h; y += 96) grid.lineBetween(0, y, worldSize.w, y);
            const shipTexture = this.make.graphics({ x: 0, y: 0, add: false });
            shipTexture.fillStyle(0xffe28a, 1);
            shipTexture.fillTriangle(32, 2, 58, 58, 32, 46);
            shipTexture.fillStyle(0x36e0ff, 1);
            shipTexture.fillTriangle(32, 2, 6, 58, 32, 46);
            shipTexture.fillStyle(0x061011, 1);
            shipTexture.fillCircle(32, 35, 9);
            shipTexture.lineStyle(3, 0x90ff00, 1);
            shipTexture.strokeTriangle(32, 2, 58, 58, 6, 58);
            shipTexture.generateTexture("playerShipPro", 64, 64);
            shipTexture.destroy();
            const targetTexture = this.make.graphics({ x: 0, y: 0, add: false });
            targetTexture.lineStyle(3, 0x90ff00, .9);
            targetTexture.strokeCircle(24, 24, 20);
            targetTexture.lineBetween(24, 0, 24, 48);
            targetTexture.lineBetween(0, 24, 48, 24);
            targetTexture.generateTexture("targetMarker", 48, 48);
            targetTexture.destroy();
            const wakeTexture = this.make.graphics({ x: 0, y: 0, add: false });
            wakeTexture.fillStyle(0x8cecff, .8);
            wakeTexture.fillCircle(6, 6, 6);
            wakeTexture.generateTexture("wakeParticle", 12, 12);
            wakeTexture.destroy();
            const chestTexture = this.make.graphics({ x: 0, y: 0, add: false });
            chestTexture.fillStyle(0x2b1406, 1);
            chestTexture.fillRoundedRect(3, 12, 46, 30, 6);
            chestTexture.fillStyle(0xffc247, 1);
            chestTexture.fillRoundedRect(6, 6, 40, 32, 5);
            chestTexture.lineStyle(3, 0x120803, 1);
            chestTexture.strokeRoundedRect(6, 6, 40, 32, 5);
            chestTexture.lineStyle(2, 0xfff0a6, .7);
            chestTexture.lineBetween(10, 19, 42, 19);
            chestTexture.fillStyle(0x07100d, 1);
            chestTexture.fillCircle(26, 24, 4);
            chestTexture.generateTexture("worldChest", 52, 46);
            chestTexture.destroy();
            const npcTexture = this.make.graphics({ x: 0, y: 0, add: false });
            npcTexture.fillStyle(0x08232c, 1);
            npcTexture.fillCircle(28, 28, 25);
            npcTexture.fillStyle(0x36e0ff, .9);
            npcTexture.fillCircle(28, 26, 18);
            npcTexture.lineStyle(3, 0xffffff, .54);
            npcTexture.strokeCircle(28, 28, 24);
            npcTexture.fillStyle(0xffe28a, .95);
            npcTexture.fillCircle(21, 22, 3);
            npcTexture.fillCircle(35, 22, 3);
            npcTexture.generateTexture("worldNpc", 56, 56);
            npcTexture.destroy();
            const threatTexture = this.make.graphics({ x: 0, y: 0, add: false });
            threatTexture.fillStyle(0x2b0907, .95);
            threatTexture.fillRoundedRect(6, 6, 54, 54, 7);
            threatTexture.lineStyle(3, 0xffe28a, .52);
            threatTexture.strokeRoundedRect(6, 6, 54, 54, 7);
            threatTexture.lineStyle(2, 0xff4128, .9);
            threatTexture.strokeCircle(33, 33, 22);
            threatTexture.generateTexture("worldThreat", 66, 66);
            threatTexture.destroy();
            for (let i = 0; i < 18; i += 1) {
                const x = 120 + Math.random() * (worldSize.w - 240);
                const y = 120 + Math.random() * (worldSize.h - 240);
                const island = this.add.ellipse(x, y, 120 + Math.random() * 180, 60 + Math.random() * 90, 0x2b6b45, .58).setStrokeStyle(2, 0xffe28a, .18);
                this.add.ellipse(x - 10, y - 8, island.width * .55, island.height * .4, 0xf7c84b, .18);
            }
            chests = this.physics.add.staticGroup();
            [
                [540, 420], [1420, 520], [1780, 1160], [760, 1240], [1120, 880]
            ].forEach((pos, i) => {
                if (estadoMundo.chests.includes(i)) return;
                const chest = this.add.image(pos[0], pos[1], "worldChest");
                chest.idMundo = i;
                chest.tipoInteracao = "bau";
                this.physics.add.existing(chest, true);
                chests.add(chest);
            });
            npcs = this.physics.add.staticGroup();
            [
                [340, 740, "Navegador: missões raras aparecem no quadro."],
                [1180, 300, "Ferreiro: treinos aumentam seu dano em batalha."],
                [1660, 820, "Cartógrafa: siga os pontos dourados do radar."]
            ].forEach((npc, i) => {
                const body = this.add.image(npc[0], npc[1], "worldNpc");
                body.fala = npc[2];
                body.idMundo = i;
                body.tipoInteracao = "npc";
                this.physics.add.existing(body, true);
                npcs.add(body);
                this.add.text(npc[0], npc[1] - 44, "NPC", { fontFamily: "Arial Black", fontSize: "13px", color: "#fff7df", stroke: "#041011", strokeThickness: 4 }).setOrigin(.5);
            });
            threats = this.physics.add.staticGroup();
            [
                [1840, 420, "E"], [1320, 1260, "D"], [420, 1180, "C"]
            ].forEach((enemy) => {
                const threat = this.add.image(enemy[0], enemy[1], "worldThreat");
                threat.rank = enemy[2];
                threat.tipoInteracao = "ameaca";
                this.physics.add.existing(threat, true);
                threats.add(threat);
                const ring = this.add.circle(enemy[0], enemy[1], 48, 0xff4128, .10).setStrokeStyle(2, 0xff4128, .34).setDepth(3);
                this.tweens.add({ targets: ring, scale: 1.4, alpha: .03, duration: 980, repeat: -1, yoyo: true, ease: "sine.inOut" });
                this.add.text(enemy[0], enemy[1], enemy[2], { fontFamily: "Arial Black", fontSize: "26px", color: "#fff7df", stroke: "#210b08", strokeThickness: 5 }).setOrigin(.5);
            });
            targetMarker = this.add.image(estadoMundo.x, estadoMundo.y, "targetMarker").setDepth(8).setVisible(false).setAlpha(.82);
            player = this.physics.add.sprite(estadoMundo.x, estadoMundo.y, "playerShipPro");
            player.setDisplaySize(64, 64).setDepth(10);
            player.setCollideWorldBounds(true);
            player.body.setSize(42, 42);
            player.aura = this.add.circle(player.x, player.y, 48, 0x90ff00, .13).setStrokeStyle(2, 0x90ff00, .55).setDepth(9);
            this.tweens.add({ targets: player.aura, scale: 1.22, alpha: .22, yoyo: true, repeat: -1, duration: 760, ease: "sine.inOut" });
            try {
                player.wake = this.add.particles(0, 0, "wakeParticle", {
                    lifespan: 520,
                    speed: { min: 8, max: 28 },
                    scale: { start: .55, end: 0 },
                    alpha: { start: .30, end: 0 },
                    frequency: 58,
                    blendMode: "ADD",
                    follow: player,
                    followOffset: { x: 0, y: 24 }
                }).setDepth(6);
            } catch (erro) {
                player.wake = null;
            }
            cursors = this.input.keyboard.createCursorKeys();
            keys = this.input.keyboard.addKeys("W,A,S,D,E,SPACE,SHIFT");
            this.cameras.main.startFollow(player, true, .12, .12);
            this.cameras.main.setBounds(0, 0, worldSize.w, worldSize.h);
            this.cameras.main.setZoom(1.04);
            this.input.on("pointerdown", (pointer) => {
                if (pointer.y < 120) return;
                const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                moveTarget = {
                    x: Phaser.Math.Clamp(worldPoint.x, 20, worldSize.w - 20),
                    y: Phaser.Math.Clamp(worldPoint.y, 20, worldSize.h - 20)
                };
                targetMarker.setPosition(moveTarget.x, moveTarget.y).setVisible(true);
                this.tweens.add({ targets: targetMarker, scale: { from: 1.35, to: .8 }, alpha: { from: 1, to: .55 }, duration: 220, yoyo: true });
            });
            this.physics.add.overlap(player, chests, (_p, chest) => {
                setPrompt("Abrir tesouro de rota");
            });
            this.physics.add.overlap(player, npcs, (_p, npc) => {
                setPrompt("Conversar com tripulante");
            });
            this.physics.add.overlap(player, threats, (_p, threat) => {
                setPrompt("Enfrentar ameaça rank " + threat.rank);
            });
            cameraText = this.add.text(16, 16, "", { fontFamily: "Arial", fontSize: "12px", color: "#d9e8d4", backgroundColor: "rgba(0,0,0,.24)", padding: { x: 8, y: 6 } }).setScrollFactor(0).setDepth(20).setVisible(false);
            log("Mundo carregado. Explore, colete e procure ameaças.");
        }

        function procurarInteracao() {
            let escolhido = null;
            let menorDistancia = 88;
            [chests, npcs, threats].forEach((grupo) => {
                if (!grupo) return;
                grupo.getChildren().forEach((item) => {
                    if (!item?.active) return;
                    const distancia = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
                    if (distancia < menorDistancia) {
                        menorDistancia = distancia;
                        escolhido = item;
                    }
                });
            });
            return escolhido;
        }

        function usarInteracao(scene, item) {
            if (!item || actionCooldown > scene.time.now) return;
            actionCooldown = scene.time.now + 700;
            if (item.tipoInteracao === "bau") {
                estadoMundo.chests.push(item.idMundo);
                item.destroy();
                recompensar("bau", 3);
                scene.cameras.main.flash(180, 255, 226, 138);
                log("Tesouro coletado: item raro enviado ao inventário.");
                setPrompt("");
                return;
            }
            if (item.tipoInteracao === "npc") {
                atualizarObjetivo(item.fala);
                log(item.fala);
                scene.cameras.main.flash(90, 54, 224, 255);
                return;
            }
            if (item.tipoInteracao === "ameaca") {
                battleLink.href = "batalha.html?rank=" + item.rank + "&origem=mundo";
                estadoMundo.battles += 1;
                salvarMundo();
                atualizarObjetivo("Ameaça rank " + item.rank + " encontrada. Entrando em batalha.");
                log("Ameaça rank " + item.rank + " encontrada. Preparando combate.");
                scene.cameras.main.shake(180, .01);
                setTimeout(() => { location.href = battleLink.href; }, 260);
            }
        }

        function update() {
            if (!player) return;
            const speed = keys.SHIFT.isDown ? 335 : 235;
            const left = cursors.left.isDown || keys.A.isDown || teclasMobile.left;
            const right = cursors.right.isDown || keys.D.isDown || teclasMobile.right;
            const up = cursors.up.isDown || keys.W.isDown || teclasMobile.up;
            const down = cursors.down.isDown || keys.S.isDown || teclasMobile.down;
            player.setVelocity(0);
            const usandoDirecional = left || right || up || down;
            if (usandoDirecional) {
                moveTarget = null;
                if (targetMarker) targetMarker.setVisible(false);
                if (left) player.setVelocityX(-speed);
                if (right) player.setVelocityX(speed);
                if (up) player.setVelocityY(-speed);
                if (down) player.setVelocityY(speed);
                player.body.velocity.normalize().scale(speed);
            } else if (moveTarget) {
                const dist = Phaser.Math.Distance.Between(player.x, player.y, moveTarget.x, moveTarget.y);
                if (dist < 14) {
                    moveTarget = null;
                    if (targetMarker) targetMarker.setVisible(false);
                } else {
                    this.physics.moveTo(player, moveTarget.x, moveTarget.y, speed);
                }
            }
            if (player.body.velocity.length() > 0) player.rotation = Phaser.Math.Angle.Between(0, 0, player.body.velocity.x, player.body.velocity.y) + Math.PI / 2;
            nearestInteractable = procurarInteracao();
            if (nearestInteractable) {
                const texto = nearestInteractable.tipoInteracao === "bau"
                    ? "Abrir tesouro"
                    : nearestInteractable.tipoInteracao === "npc"
                        ? "Conversar"
                        : "Marcar batalha rank " + nearestInteractable.rank;
                setPrompt(texto);
            } else {
                setPrompt("");
            }
            if (Phaser.Input.Keyboard.JustDown(keys.E) || Phaser.Input.Keyboard.JustDown(keys.SPACE) || teclasMobile.action) {
                usarInteracao(this, nearestInteractable);
                teclasMobile.action = false;
            }
            player.aura.setPosition(player.x, player.y);
            estadoMundo.x = Math.round(player.x);
            estadoMundo.y = Math.round(player.y);
            if (Math.random() < .01) salvarMundo();
            cameraText.setText("WASD/clique mover | Shift acelerar | E interagir");
        }

        document.querySelectorAll("[data-dir]").forEach((botao) => {
            const dir = botao.dataset.dir;
            const ligar = (valor) => { teclasMobile[dir] = valor; };
            botao.addEventListener("pointerdown", () => ligar(true));
            botao.addEventListener("pointerup", () => ligar(false));
            botao.addEventListener("pointercancel", () => ligar(false));
            botao.addEventListener("pointerleave", () => ligar(false));
        });

        document.getElementById("world-reset").onclick = () => {
            localStorage.removeItem("rpg_world_" + nomeNormalizado);
            location.reload();
        };

        window.addEventListener("beforeunload", salvarMundo);
        iniciarWorld();
    </script>
</body>
</html>
