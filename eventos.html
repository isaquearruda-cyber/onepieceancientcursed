<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - One Piece RPG</title>
    <link rel="stylesheet" href="estilo.css?v=20260619-game24">
    <style>
        body.pagina-formulario { position: relative; min-height: 100vh; padding: 0; overflow-x: hidden; background: #040c0d; color: #fff7df; }
        .eventos-app { position: relative; z-index: 2; width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: clamp(18px,4vw,42px) 0; display: grid; gap: 18px; }
        .eventos-topo, .evento-card, .temporada { border: 1px solid rgba(247,200,75,.28); border-radius: 8px; background: linear-gradient(180deg, rgba(7,20,22,.9), rgba(3,8,10,.92)); box-shadow: 0 22px 54px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,247,223,.06); }
        .eventos-topo { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: clamp(16px,3vw,26px); }
        .eventos-topo small, .evento-card small { color: #ffe28a; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
        .eventos-topo h1 { margin: 4px 0 8px; color: #fff7df; font-family: "Segoe UI Black","Arial Black",Impact,sans-serif; font-size: clamp(2.2rem,6vw,4.4rem); line-height: .94; text-transform: uppercase; text-shadow: 0 5px 0 #2a0d08, 0 14px 28px rgba(0,0,0,.68); }
        .botao-voltar, button { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,226,138,.52); border-radius: 8px; color: #1e211c; background: #f7c84b; font-weight: 900; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; }
        .botao-voltar { color: #fff7df; background: rgba(4,12,13,.72); }
        .eventos-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .temporada { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px; }
        .temporada div { padding: 12px; border: 1px solid rgba(255,226,138,.16); border-radius: 8px; background: rgba(0,0,0,.26); }
        .temporada h2 { margin: 4px 0 0; }
        .evento-card { --cor:#ffe28a; position: relative; overflow: hidden; display: grid; gap: 12px; padding: 16px; min-height: 330px; border-color: color-mix(in srgb,var(--cor) 28%,rgba(247,200,75,.2)); }
        .evento-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, color-mix(in srgb,var(--cor) 18%,transparent), transparent 42%); pointer-events: none; }
        .evento-card > * { position: relative; }
        .evento-card img { width: 84px; height: 84px; border-radius: 8px; object-fit: cover; box-shadow: 0 0 18px rgba(247,200,75,.3); }
        .evento-card p { color: #d9e8d4; line-height: 1.45; }
        .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .chips span { padding: 5px 8px; border: 1px solid color-mix(in srgb,var(--cor) 42%,transparent); border-radius: 999px; color: #ffe28a; background: rgba(0,0,0,.28); font-size: .68rem; font-weight: 900; text-transform: uppercase; }
        @media (max-width: 860px) { .eventos-grid, .eventos-topo, .temporada { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="pagina-formulario">
    <audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio>
    <video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video>
    <main class="eventos-app">
        <header class="eventos-topo">
            <div><small>Recompensas especiais</small><h1>Eventos</h1><p id="status-eventos">Carregando personagem...</p></div>
            <a class="botao-voltar" href="lobby.html">Voltar</a>
        </header>
        <section class="temporada">
            <div><small>Temporada</small><h2>Beta Seas</h2></div>
            <div><small>Reinício</small><h2 id="timer-eventos">--:--:--</h2></div>
            <div><small>Rotação</small><h2>Diária</h2></div>
            <div><small>Risco</small><h2>Escalável</h2></div>
        </section>
        <section class="eventos-grid" id="eventos-grid"></section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="banco-personagens.js?v=20260619-db2"></script>
    <script src="musica-fundo.js?v=20260619-game24"></script>
    <script src="rpg-sistemas.js?v=20260619-rpg10"></script>
    <script>
        const personagem = JSON.parse(localStorage.getItem("ultimoPersonagem") || "null");
        const eventos = [
            { nome: "Tempestade nos Blues", rank: "C", cor: "#36e0ff", img: "assets/mares/mar-east.webp", texto: "Rotas instáveis aparecem por 24h. Complete para registrar coragem de navegação.", extra: "Chance de material náutico" },
            { nome: "Caçada ao Procurado", rank: "B", cor: "#ff7b7b", img: "assets/img/sistemas/sistema-5.webp", texto: "Encontre um alvo valioso e retorne com prova da captura.", extra: "Aumenta fama do personagem" },
            { nome: "Guerra de Bandeiras", rank: "A", cor: "#ffcf3e", img: "assets/img/sistemas/sistema-4.webp", texto: "Evento grande de facções, alianças e domínio de rota.", extra: "Conta para conquistas" },
            { nome: "Mercado Negro Aberto", rank: "C", cor: "#8f7bff", img: "assets/img/menu-game/lojas.webp", texto: "Mercadores raros aparecem no cais por tempo limitado.", extra: "Combina com loja rotativa" },
            { nome: "Chamado do Bando", rank: "D", cor: "#64d6a4", img: "assets/img/menu-game/organizacao.webp", texto: "Objetivo social para bandos e organizações ganharem presença.", extra: "Gera progresso coletivo" },
            { nome: "Eco do Século Perdido", rank: "A", cor: "#ffe28a", img: "assets/img/sistemas/sistema-3.webp", texto: "Pistas antigas surgem em ruínas e bibliotecas. Evento raro de exploração.", extra: "Recomendado para narrativas longas" }
        ];
        function renderizar() {
            if (!personagem?.nome) { window.location.href = "index.html"; return; }
            const progresso = RpgSistemas.obterProgresso(personagem);
            document.getElementById("status-eventos").textContent = `${personagem.nome} / ${progresso.expDisponivel.toLocaleString("pt-BR")} EXP livre / ${progresso.berris.toLocaleString("pt-BR")} berris`;
            document.getElementById("eventos-grid").innerHTML = eventos.map((evento, indice) => {
                const r = RpgSistemas.recompensasAtividade("evento", evento.rank, "evento");
                return `<article class="evento-card" style="--cor:${evento.cor}"><img src="${evento.img}" alt=""><small>Rank ${evento.rank} / Ao vivo</small><h2>${evento.nome}</h2><p>${evento.texto}</p><div class="chips"><span>+${r.exp} EXP</span><span>+${r.berris} berris</span><span>+${r.pontosAtributo} ponto(s)</span></div><p>${evento.extra}</p><button type="button" data-evento="${indice}">Contabilizar evento</button></article>`;
            }).join("");
            document.querySelectorAll("[data-evento]").forEach((botao) => botao.addEventListener("click", async () => {
                const evento = eventos[Number(botao.dataset.evento)];
                personagem.eventosConcluidos = [...(personagem.eventosConcluidos || []), { titulo: evento.nome, rank: evento.rank, concluidoEm: new Date().toISOString(), concluidoEmTexto: new Date().toLocaleString("pt-BR") }];
                await RpgSistemas.concluirAtividade(personagem, { tipo: "evento", titulo: evento.nome, rank: evento.rank, periodo: "evento" });
                renderizar();
            }));
        }
        setInterval(() => {
            const fim = new Date(); fim.setHours(24,0,0,0);
            const ms = fim - new Date();
            document.getElementById("timer-eventos").textContent = `${String(Math.floor(ms / 3600000)).padStart(2,"0")}:${String(Math.floor(ms / 60000) % 60).padStart(2,"0")}:${String(Math.floor(ms / 1000) % 60).padStart(2,"0")}`;
        }, 1000);
        renderizar();
    </script>
</body>
</html>
