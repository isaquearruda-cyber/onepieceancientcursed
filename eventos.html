<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Eventos - One Piece RPG</title><link rel="stylesheet" href="estilo.css"><style>body.pagina-formulario{position:relative;min-height:100vh;padding:0;overflow-x:hidden;background:#040c0d;color:#fff7df}.app{position:relative;z-index:2;width:min(1180px,calc(100% - 28px));margin:0 auto;padding:clamp(18px,4vw,42px) 0;display:grid;gap:18px}.topo,.card{border:1px solid rgba(247,200,75,.28);border-radius:8px;background:linear-gradient(180deg,rgba(7,20,22,.9),rgba(3,8,10,.92));box-shadow:0 22px 54px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,247,223,.06)}.topo{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:clamp(16px,3vw,26px)}small{color:#ffe28a;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0 8px;color:#fff7df;font-family:"Segoe UI Black","Arial Black",Impact,sans-serif;font-size:clamp(2.2rem,6vw,4.4rem);line-height:.94;text-transform:uppercase;text-shadow:0 5px 0 #2a0d08,0 14px 28px rgba(0,0,0,.68)}.voltar,button{min-height:42px;padding:0 14px;border:1px solid rgba(255,226,138,.52);border-radius:8px;color:#1e211c;background:#f7c84b;font-weight:900;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}.voltar{color:#fff7df;background:rgba(4,12,13,.72)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:grid;gap:12px;padding:16px;min-height:300px}.card img{width:84px;height:84px;border-radius:8px;object-fit:cover;box-shadow:0 0 18px rgba(247,200,75,.3)}.card p{color:#d9e8d4;line-height:1.45}@media(max-width:860px){.grid,.topo{grid-template-columns:1fr}}</style></head><body class="pagina-formulario"><audio id="musica-fundo" loop preload="auto"><source src="assets/audio/drums-of-liberation.mp3" type="audio/mpeg"></audio><video class="video-fundo" autoplay muted loop playsinline aria-hidden="true"><source src="fundo-login.mp4" type="video/mp4"></video><main class="app"><header class="topo"><div><small>Recompensas especiais</small><h1>Eventos</h1><p id="status">Carregando personagem...</p></div><a class="voltar" href="lobby.html">Voltar</a></header><section class="grid" id="grid"></section></main><script src="supabase-config.js"></script><script src="banco-personagens.js"></script><script src="musica-fundo.js"></script><script src="rpg-sistemas.js"></script><script>const personagem=JSON.parse(localStorage.getItem('ultimoPersonagem')||'null');const eventos=[["Cerco da Ilha","C","Defenda ou conquiste um territorio em evento narrativo."],["Caçada ao Procurado","B","Encontre um alvo valioso e retorne com prova da captura."],["Guerra de Bandeiras","A","Evento grande de faccoes, alianças e dominio de rota."]];function render(){if(!personagem?.nome){location.href='index.html';return}const p=RpgSistemas.obterProgresso(personagem);status.textContent=`${personagem.nome} / ${p.expDisponivel.toLocaleString('pt-BR')} EXP livre / ${p.berris.toLocaleString('pt-BR')} berris`;grid.innerHTML=eventos.map((e,i)=>{const r=RpgSistemas.recompensasAtividade('evento',e[1],'evento');return`<article class="card"><img src="assets/img/sistemas/sistema-5.webp" alt=""><small>Rank ${e[1]}</small><h2>${e[0]}</h2><p>${e[2]}</p><p>+${r.exp} EXP / +${r.berris} berris / +${r.pontosAtributo} ponto(s)</p><button type="button" data-evento="${i}">Contabilizar evento</button></article>`}).join('');document.querySelectorAll('[data-evento]').forEach(b=>b.onclick=async()=>{const e=eventos[Number(b.dataset.evento)];personagem.eventosConcluidos=[...(personagem.eventosConcluidos||[]),{titulo:e[0],rank:e[1],concluidoEm:new Date().toISOString(),concluidoEmTexto:new Date().toLocaleString('pt-BR')}];await RpgSistemas.concluirAtividade(personagem,{tipo:'evento',titulo:e[0],rank:e[1],periodo:'evento'});render()})}render();</script></body></html>
